## Cómo están hechas las presentaciones\r
\r
Esto cambió y es importante:\r
\r
- **Ya no hay notas de docente.** El `<div class="notes">` fue retirado de todos los decks: **el libreto que escribes ES la única guía hablada**. No busques notas, no existen.\r
- Cada diapositiva es un `<section class="slide" data-title="...">`. Las clases `dense`, `xdense`, `xxdense` y `tiny` solo controlan el tamaño de letra; `mid` centra el contenido en vertical.\r
- **No hay horario de reloj.** El pie de cada diapositiva nombra el bloque, no la hora. Muchas indican su duración en el `<div class="ey">` (por ejemplo «Desafío 4 · 10 minutos»).\r
- `data-opcional="1"` marca una diapositiva prescindible. El contador de la barra lo indica al docente.\r
\r
### Lo que hay que accionar en vivo\r
\r
Si no lo dices en el libreto, no ocurre:\r
\r
- **`[data-r]`** — bloques ocultos que se revelan con la flecha derecha. Son las soluciones y los remates. **Siempre** indica en el libreto cuándo revelar.\r
- **`.cnode` y `.tnode`** — elementos **pulsables** dentro de diagramas SVG (pastillas de cardinalidad, tablas del mapa). Abren un panel con ejemplos o diccionarios. **Si nadie hace clic, ese contenido no existe.** Dilo explícitamente.\r
- **Temporizador flotante** — se abre con `T`, se arrastra a cualquier lado y no tapa el ejercicio. La tecla `M` lo oculta y lo devuelve. Los presets arrancan solos al elegirlos.\r
- **Quizzes `.q`** — el estudiante elige y pulsa «Verificar»; la retroalimentación aparece entonces.\r
\r
## Cómo trabajar\r
\r
1. Lee el HTML de la sesión que se te indique, diapositiva por diapositiva.\r
2. Lee el script SQL asociado (`Scripts/S2.sql`, `S3.sql`, `S4.sql`…) para conocer los resultados esperados.\r
3. Si necesitas comprobar un resultado, **ejecútalo** contra `Presentaciones/M2/base-datos/dvdrental.db` con `py -c "import sqlite3; ..."`. **No inventes cifras ni las copies del deck sin verificarlas**: en revisiones anteriores aparecieron números falsos que solo se detectaron ejecutándolos.\r
4. Si el deck afirma algo sobre otro motor (PostgreSQL, MySQL, SQL Server), no puedes ejecutarlo: márcalo como «no verificable aquí» en vez de darlo por bueno.\r
\r
## Lo que debes entregar\r
\r
Escribe **un solo archivo Markdown** en la ruta que se te indique.\r
\r
### Parte 1 · Libreto\r
\r
Para **cada** diapositiva, en orden, usando su `data-title` como encabezado:\r
\r
- **Qué digo**: el guion hablado, en primera persona, listo para leer en voz alta. Español de Colombia, natural, sin solemnidad. Entre 60 y 180 palabras; menos en las de tránsito.\r
- **Qué hago**: acciones concretas — compartir pantalla, ejecutar una consulta, **pulsar un elemento interactivo**, **revelar un `data-r`**, abrir el chat, arrancar el temporizador, esperar respuestas.\r
- **Transición**: la frase con la que enlazo con la diapositiva siguiente.\r
\r
El libreto debe poder leerse de corrido sin consultar la presentación.\r
\r
### Parte 2 · Evaluación de dictabilidad\r
\r
Una tabla con **una fila por diapositiva**:\r
\r
| Diapositiva | Densidad (1-5) | Riesgo en vivo (1-5) | Carga cognitiva (1-5) | Comentario |\r
\r
5 = problemático. Sé severo: una tabla donde todo es 2 no sirve para nada.\r
\r
Después, en prosa:\r
- Las **3 diapositivas más difíciles de dictar** y por qué.\r
- El **presupuesto de tiempo**: minutos por diapositiva y total. Compáralo con los 165 disponibles (o **145 si es un martes corto**). Si sobra, di **exactamente qué recortar**.\r
- Cuánto del tiempo es **teclado del estudiante** y cuánto exposición. La página promete actividad cada 10–15 minutos: si hay un tramo largo sin nada que hacer, señálalo con sus minutos.\r
- Las **dependencias frágiles**: algo que tiene que funcionar sí o sí.\r
\r
### Parte 3 · Recomendaciones\r
\r
Lista priorizada. Cada una con: **qué cambiar**, **en qué diapositiva** (por su `data-title`), **por qué** y **cuánto cuesta** (bajo / medio / alto). Separa lo imprescindible de lo deseable.\r
\r
## Reglas\r
\r
- Cita siempre las diapositivas por su `data-title` exacto. Nada de «la diapositiva del principio».\r
- Prohibido recomendar en genérico («mejorar la claridad», «agregar más ejemplos»). Di exactamente qué frase, qué ejercicio o qué elemento.\r
- Si una diapositiva está bien, dilo y sigue. No inventes problemas para llenar la lista.\r
- **Verifica los datos numéricos contra la base antes de escribirlos.**\r
- El archivo que escribas debe ir en `Presentaciones/**/libreto-*.md`, que está en `.gitignore` y no se publica."""
