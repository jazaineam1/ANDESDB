## El grupo real (diagnóstico de 38 respuestas)\r
\r
Esto manda sobre cualquier intuición pedagógica:\r
\r
- **SQL: promedio 3,2/10. 20 de 38 se autocalifican ≤2.** Solo 3 personas ≥7.\r
- **Excel: promedio ~6,5/10** — mucho más alto que SQL. Es la palanca: cada cláusula SQL se enseña como el equivalente de algo que ya saben hacer en Excel.\r
- Python: ~3,0/10. **El curso no usa Python en ninguna sesión**, aunque los prerrequisitos de la página lo mencionen.\r
- 34 Windows · 2 Linux · 1 macOS. **2 estudiantes en datos móviles a 5–10 Mbps. 1 sin equipo propio.**\r
- Perfiles: salud, contaduría, psicología, arquitectura, administración, ingeniería, diseño gráfico, economía.\r
