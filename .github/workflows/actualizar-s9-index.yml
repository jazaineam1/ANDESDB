name: Actualizar S9 e índice

on:
  push:
    paths:
      - '.github/workflows/actualizar-s9-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar metadatos de S9
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          curso_path = Path('tools/curso.json')
          curso = json.loads(curso_path.read_text(encoding='utf-8'))
          for modulo in curso['modulos']:
              for sesion in modulo.get('sesiones', []):
                  if sesion.get('n') == 9:
                      sesion['titulo'] = 'Del problema al DDL · PostgreSQL'
                      sesion['desc'] = ('Primero usamos consultas SQL conocidas para provocar y detectar problemas de 1FN, 2FN y 3FN; '
                                        'después reparamos dependencias y convertimos el modelo correcto en DDL real sobre PostgreSQL, '
                                        'probando PK, FK, NOT NULL, CHECK y DEFAULT en Supabase.')
                      sesion['tags'] = [
                          '1FN', '2FN', '3FN', 'dependencias', 'COUNT(DISTINCT)', 'HAVING',
                          'CREATE TABLE', 'PK', 'FK', 'CHECK', 'PostgreSQL', 'Supabase'
                      ]
                      sesion['recursos'] = [
                          {
                              'txt': '📄 Laboratorio 1FN–3FN + DDL PostgreSQL',
                              'href': 'Scripts/S9.sql',
                              'download': True
                          }
                      ]
          curso_path.write_text(json.dumps(curso, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          plan_path = Path('assets/learning/learning-plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          s9 = plan['sesiones']['9']
          s9['titulo'] = 'Del problema al DDL · PostgreSQL'
          s9['objetivo'] = ('Usar consultas SQL conocidas para hacer visibles anomalías de 1FN, 2FN y 3FN, '
                            'reparar las dependencias que las producen y convertir el modelo resultante en tablas y '
                            'restricciones ejecutables sobre PostgreSQL real en Supabase.')
          s9['actividad'] = {
              'titulo': 'Tres incidentes reales: 1FN, 2FN y 3FN → DDL',
              'minutos': 61,
              'instrucciones': ('Ejecuta tres diseños deliberadamente problemáticos. En 1FN intenta consultar cantidades '
                                'escondidas dentro de texto; en 2FN provoca dos nombres para un mismo plato y detecta la '
                                'contradicción con COUNT(DISTINCT) y HAVING; en 3FN provoca dos capacidades para una misma '
                                'mesa. En cada caso identifica de qué depende el dato, repara la estructura y reconstruye '
                                'la información con SQL. Después implementa PLATO, PEDIDO y LINEA_PEDIDO con DDL real.'),
              'criterios': [
                  'detecta el problema de 1FN mediante una consulta de negocio',
                  'explica qué atributo depende de una parte de una clave compuesta en 2FN',
                  'detecta una dependencia transitiva visible en 3FN',
                  'reconstruye información con JOIN después de separar tablas',
                  'crea y prueba PK, FK, NOT NULL, CHECK y DEFAULT en PostgreSQL'
              ]
          }
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"^const VERSION = '[^']+';", "const VERSION = 'andesdb-v10-s9-normalizacion-20260902';", sw, count=1)
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Regenerar portada
        run: |
          python tools/construir-index.py
          python tools/integrar-experiencia.py
          python tools/validar_curso.py

      - name: Publicar actualización
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/curso.json assets/learning/learning-plan.json index.html service-worker.js Presentaciones
          if git diff --cached --quiet; then
            echo 'No hay cambios pendientes'
            exit 0
          fi
          git commit -m 'Reflejar S9 de normalización aplicada y DDL en el índice'
          git pull --rebase origin main
          git push origin main
