name: Ajustar index S9 suave

on:
  push:
    paths:
      - '.github/workflows/ajustar-index-s9-suave.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ajustar manifiestos para index suave
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          titulo = 'Supabase paso a paso + DDL PostgreSQL'
          desc = (
              'Tutorial guiado para entrar a Supabase, usar SQL Editor y Table Editor, '
              'trabajar en grupos Zoom y crear tablas con DDL PostgreSQL. Las formas normales '
              'quedan más suaves: 1FN es no guardar listas en celdas; 2FN es no mezclar datos '
              'de pedido y plato; 3FN es no guardar un dato en el lugar equivocado.'
          )
          tags = ['Supabase','SQL Editor','Table Editor','1FN suave','2FN suave','3FN suave','CREATE TABLE','PK','FK','CHECK','PostgreSQL']

          curso_path = Path('tools/curso.json')
          curso = json.loads(curso_path.read_text(encoding='utf-8'))
          s9 = next(s for m in curso['modulos'] for s in m.get('sesiones', []) if s.get('n') == 9)
          s9['titulo'] = titulo
          s9['desc'] = desc
          s9['tags'] = tags
          curso_path.write_text(json.dumps(curso, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lp_path = Path('assets/learning/learning-plan.json')
          lp = json.loads(lp_path.read_text(encoding='utf-8'))
          l9 = lp['sesiones']['9']
          l9['titulo'] = titulo
          l9['objetivo'] = (
              'Entrar y orientarse en Supabase paso a paso; usar SQL Editor y Table Editor; '
              'distinguir PK/FK de API keys; explicar 1FN, 2FN y 3FN de forma suave y visual; '
              'y construir el modelo final con DDL PostgreSQL.'
          )
          l9['actividad']['titulo'] = 'Supabase paso a paso + formas normales suaves + DDL'
          l9['actividad']['instrucciones'] = (
              'Trabaja en grupo. Primero ubica SQL Editor y Table Editor. Luego mira tres problemas simples: '
              'una celda con lista para 1FN, datos de pedido y plato mezclados para 2FN, y puestos de mesa '
              'guardados dentro de pedido para 3FN. Finalmente crea PLATO, MESA, PEDIDO y LINEA_PEDIDO con DDL PostgreSQL.'
          )
          lp_path.write_text(json.dumps(lp, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerar index
        run: |
          python tools/construir-index.py
          python tools/integrar-experiencia.py

      - name: Validar
        run: python tools/validar_curso.py

      - name: Publicar index final
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ajustar-index-s9-suave.yml
          git add tools/curso.json assets/learning/learning-plan.json index.html
          git commit -m 'Actualizar index S9 con formas normales suaves'
          git pull --rebase origin main
          git push origin main
