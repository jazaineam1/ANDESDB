name: Validar curación pedagógica en rama

on:
  workflow_dispatch:
  push:
    branches:
      - mejoras-benchmark-pedagogico
    paths:
      - 'Presentaciones/**'
      - 'assets/learning/**'
      - 'docs/**'
      - 'Plantillas/**'
      - 'tools/**'
      - '.github/workflows/aplicar-benchmark-rama.yml'

permissions:
  contents: read

concurrency:
  group: curacion-pedagogica-rama
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar curso
        run: python tools/validar_curso.py

      - name: Validar regresiones manuales
        run: |
          if [ -f tools/validar-regresiones-manuales.py ]; then
            python tools/validar-regresiones-manuales.py
          else
            echo 'Validador manual aún no instalado'
          fi

      - name: Confirmar que no cambió el estilo visual
        run: |
          git fetch origin main
          if ! git diff --quiet origin/main -- '*.css' 'tools/estilo-portada.css'; then
            echo 'ERROR: la rama modifica archivos de estilo CSS'
            git diff --stat origin/main -- '*.css' 'tools/estilo-portada.css'
            exit 1
          fi
          echo 'OK: no hay cambios en CSS respecto de main'

      - name: Confirmar CI de solo lectura
        run: |
          if ! git diff --quiet; then
            echo 'ERROR: la validación modificó archivos; CI debe ser solo lectura'
            git diff --stat
            exit 1
          fi
          echo 'OK: CI valida, no reescribe contenido'
