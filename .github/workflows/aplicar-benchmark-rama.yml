name: Aplicar benchmark pedagógico en rama

on:
  workflow_dispatch:
  push:
    branches:
      - mejoras-benchmark-pedagogico
    paths:
      - 'tools/aplicar-mejoras-benchmark.py'
      - '.github/workflows/aplicar-benchmark-rama.yml'

permissions:
  contents: write

concurrency:
  group: benchmark-pedagogico-rama
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: mejoras-benchmark-pedagogico
          fetch-depth: 0

      - name: Ejecutar transformador pedagógico
        run: python tools/aplicar-mejoras-benchmark.py

      - name: Mantener recuperación DP-900 mínima en S6
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/learning/learning-plan.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          qs = data['sesiones']['6'].setdefault('dp900', [])
          if len(qs) < 2:
              qs.append({
                  'dominio': 'Relational data on Azure',
                  'pregunta': 'Una columna tiene DEFAULT abierto. ¿Qué afirmación es correcta?',
                  'opciones': [
                      'DEFAULT impide guardar cualquier otro valor',
                      'DEFAULT propone un valor cuando no se especifica; no sustituye una restricción',
                      'DEFAULT crea automáticamente una clave primaria',
                      'DEFAULT normaliza la tabla'
                  ],
                  'correcta': 1,
                  'explicacion': 'DEFAULT define un valor por omisión; CHECK, FK, NOT NULL u otras restricciones son las que pueden impedir estados inválidos.'
              })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Comprobar sintaxis Python
        run: python -m py_compile tools/aplicar-mejoras-benchmark.py

      - name: Validar curso existente
        run: python tools/validar_curso.py

      - name: Publicar cambios solo en la rama
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No hay cambios generados'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md tools/curso.json assets/learning docs Presentaciones service-worker.js .claude .codex
          git commit -m 'Aplicar benchmark pedagógico sin cambiar estilo visual'
          git push origin HEAD:mejoras-benchmark-pedagogico
