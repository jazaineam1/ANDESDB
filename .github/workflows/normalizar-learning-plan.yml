name: Normalizar plan pedagógico

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/normalizar-learning-plan.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajustar learning-plan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('assets/learning/learning-plan.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['principios'] = {
              'actividad_cada_min': 15,
              'progreso_persistente': False,
              'diferenciacion_tecnica': True,
              'diferenciacion_tecnica_sesiones': [9, 11, 12, 13, 14, 15],
              'dp900_transversal': True,
              'servicio_real_primero': True,
              'fallback_nunca_reemplaza_servicio_real': True,
          }

          # En estas sesiones hay una actividad común; no una división artificial
          # Núcleo/Reto. Conservamos el contenido como metadato de planificación.
          for n in ('6', '7', '8', '10', '16'):
              s = data['sesiones'][n]
              base = s.pop('nucleo', None)
              if base:
                  s['actividad'] = base
              s.pop('reto', None)

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar ajuste
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/learning/learning-plan.json
          if git diff --cached --quiet; then
            echo 'El plan ya está normalizado.'
            exit 0
          fi
          git commit -m 'Alinear plan con diferenciación técnica'
          git pull --rebase origin main
          git push origin main
