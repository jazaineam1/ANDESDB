name: Publicar S9 Supabase

on:
  push:
    paths:
      - '.github/workflows/publicar-s9-supabase.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar manifiesto de la sesión 9
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('tools/curso.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          encontrada = False
          for modulo in data.get('modulos', []):
              for sesion in modulo.get('sesiones', []):
                  if sesion.get('n') == 9:
                      sesion['titulo'] = 'DDL + Supabase/PostgreSQL'
                      sesion['desc'] = 'Convertir el modelo del Restaurante ABC en CREATE TABLE y restricciones, ejecutarlo en PostgreSQL real con Supabase y comprobar qué reglas acepta o rechaza el motor.'
                      sesion['href'] = 'Presentaciones/M3/sesion-9-ddl-supabase.html'
                      sesion['tags'] = [
                          'CREATE TABLE', 'PK', 'FK', 'NOT NULL', 'UNIQUE',
                          'CHECK', 'PostgreSQL', 'Supabase'
                      ]
                      sesion['recursos'] = [
                          {
                              'txt': '📄 Script del laboratorio · Supabase/PostgreSQL',
                              'href': 'Scripts/S9.sql',
                              'download': True
                          }
                      ]
                      encontrada = True

          if not encontrada:
              raise SystemExit('No se encontró la sesión 9 en tools/curso.json')

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerar portada
        run: python tools/construir-index.py

      - name: Validar curso
        run: python tools/validar_curso.py

      - name: Retirar workflow temporal y publicar
        run: |
          rm .github/workflows/publicar-s9-supabase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/curso.json index.html .github/workflows/publicar-s9-supabase.yml
          git commit -m 'Publicar S9 DDL con Supabase/PostgreSQL'
          git pull --rebase origin main
          git push origin main
