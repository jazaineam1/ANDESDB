name: Publicar soluciones programadas

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:
    inputs:
      session:
        description: 'Número de sesión a publicar manualmente (ej. 7)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
      SOLUTIONS_PASSPHRASE: ${{ secrets.SOLUTIONS_PASSPHRASE }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determinar sesión que corresponde publicar
        id: target
        shell: bash
        run: |
          set -euo pipefail
          manual='${{ inputs.session }}'
          if [ -n "$manual" ]; then
            echo "session=$manual" >> "$GITHUB_OUTPUT"
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          leido=$(python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          plan=json.load(open('assets/learning/learning-plan.json', encoding='utf-8'))
          today=datetime.now(ZoneInfo('America/Bogota')).strftime('%Y-%m-%d')
          for n,s in sorted(plan['sesiones'].items(), key=lambda x: int(x[0])):
              sol=s.get('solucion', {})
              hora=str(sol.get('publicar',''))
              if s.get('fecha')==today and sol.get('modo')=='programada' and hora >= '20:00':
                  print(n, hora)
                  break
          PY
          )
          echo "session=$(echo "$leido" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "at=$(echo "$leido" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "manual=false" >> "$GITHUB_OUTPUT"

      - name: No hay publicación para hoy
        if: steps.target.outputs.session == ''
        run: echo 'Hoy no hay ninguna solución programada.'

      - name: Verificar secreto y archivo cifrado
        if: steps.target.outputs.session != ''
        shell: bash
        run: |
          set -euo pipefail
          n='${{ steps.target.outputs.session }}'
          if [ -z "${SOLUTIONS_PASSPHRASE:-}" ]; then
            echo '::error::Falta configurar el secret SOLUTIONS_PASSPHRASE en Settings > Secrets and variables > Actions.'
            exit 1
          fi
          if [ ! -f "soluciones_cifradas/S${n}.sql.enc" ]; then
            echo "::error::No existe soluciones_cifradas/S${n}.sql.enc"
            exit 1
          fi

      - name: Esperar hasta la hora programada
        if: steps.target.outputs.session != '' && steps.target.outputs.manual != 'true'
        shell: bash
        env:
          AT: ${{ steps.target.outputs.at }}
        run: |
          set -euo pipefail
          seconds=$(python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          h, m = (os.environ.get('AT') or '20:00').split(':')
          tz=ZoneInfo('America/Bogota')
          now=datetime.now(tz)
          target=now.replace(hour=int(h), minute=int(m), second=0, microsecond=0)
          print(max(0, int((target-now).total_seconds())))
          PY
          )
          echo "Esperando ${seconds}s para publicar a las ${AT} de Bogotá."
          sleep "$seconds"

      - name: Descifrar y publicar solución
        if: steps.target.outputs.session != ''
        shell: bash
        run: |
          set -euo pipefail
          n='${{ steps.target.outputs.session }}'
          mkdir -p Scripts
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "soluciones_cifradas/S${n}.sql.enc" \
            -out "Scripts/S${n}-solucion.sql" \
            -pass env:SOLUTIONS_PASSPHRASE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Scripts/S${n}-solucion.sql"
          if git diff --cached --quiet; then
            echo "La solución S${n} ya estaba publicada."
            exit 0
          fi
          git commit -m "Publicar solución S${n}"
          git pull --rebase origin main
          git push origin main
