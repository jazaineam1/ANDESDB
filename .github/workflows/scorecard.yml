name: Security · OpenSSF Scorecard

# scorecard-action solo admite la rama por defecto. Este workflow queda
# preparado en la rama piloto y se vuelve efectivo cuando el baseline de
# seguridad se promueva a main. En la rama piloto, security_gate.py y CodeQL
# cubren los checks automatizables del código propio.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '31 9 * * 3'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Publicar SARIF
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3, 2026-08-26
        with:
          sarif_file: results.sarif
