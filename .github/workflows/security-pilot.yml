name: Security · piloto LMS SDD

on:
  push:
    branches:
      - piloto-lms-sdd-secure
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-pilot-sdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  course-gates:
    name: Validaciones ANDESDB + SDD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: ''

      - name: Validator del curso
        run: python tools/validar_curso.py

      - name: JavaScript del piloto
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/lms/*.js; do
            node --check "$file"
          done

      - name: Contrato SDD del piloto
        shell: bash
        run: |
          set -euo pipefail
          test -s .specify/memory/constitution.md
          test -s specs/001-lms-pilot/spec.md
          test -s specs/001-lms-pilot/clarifications.md
          test -s specs/001-lms-pilot/plan.md
          test -s specs/001-lms-pilot/checklists/requirements.md
          test -s specs/001-lms-pilot/tasks.md
          test -s specs/001-lms-pilot/analysis.md

      - name: Migraciones del piloto
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/202608300001_lms_pilot.sql \
            supabase/migrations/202608300002_lms_pilot_hardening.sql \
            supabase/migrations/202608300003_lms_pilot_rpc.sql \
            supabase/migrations/202608300004_lms_pilot_catalog.sql; do
            test -s "$file"
          done
          test -s supabase/tests/rls-adversarial.sql

      - name: Secretos de alta confianza
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files '.env' '.env.*' ':!.env.example')"
          if [ -n "$tracked_env" ]; then
            echo "Archivos .env versionados indebidamente:"
            echo "$tracked_env"
            exit 1
          fi

          if git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!docs/**' ':!SECURITY.md'; then
            echo 'Se detectó una posible clave privada.'
            exit 1
          fi

          if git grep -n -E -- 'sb_secret_[A-Za-z0-9_-]{12,}' -- ':!docs/**' ':!specs/**' ':!SECURITY.md'; then
            echo 'Se detectó una posible Supabase secret key.'
            exit 1
          fi

      - name: Fronteras del frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path('assets/lms/config.js').read_text(encoding='utf-8')
          if re.search(r"supabasePublishableKey\s*:\s*['\"]sb_secret_", config):
              raise SystemExit('config.js contiene una secret key en el campo público')

          teacher = Path('assets/lms/teacher.js').read_text(encoding='utf-8')
          if '.innerHTML' in teacher or 'insertAdjacentHTML' in teacher:
              raise SystemExit('teacher.js no puede interpretar HTML de estudiantes')

          for rel in ('pilot/index.html', 'pilot/s7.html', 'pilot/teacher.html'):
              text = Path(rel).read_text(encoding='utf-8')
              if 'Content-Security-Policy' not in text:
                  raise SystemExit(f'{rel}: falta CSP')
          PY

  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      packages: read
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3, 2026-08-26
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3, 2026-08-26
        with:
          category: /language:${{ matrix.language }}

# Snyk queda como gate opcional hasta que el repositorio tenga SNYK_TOKEN.
# No se simula una cobertura que todavía no existe. Como el runtime del piloto
# no añade paquetes npm ni CDN, CodeQL + secret guard cubren el código propio;
# Snyk se habilita antes de introducir nuevas dependencias de terceros.
