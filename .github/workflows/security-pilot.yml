name: Security · piloto LMS SDD

on:
  push:
    branches:
      - piloto-lms-sdd-secure
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-pilot-sdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  course-gates:
    name: Validaciones ANDESDB + SDD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: ''

      - name: Validator del curso
        run: python tools/validar_curso.py

      - name: Sintaxis del piloto
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/lms/*.js; do
            node --check "$file"
          done
          python -m py_compile tools/configurar_piloto_lms.py

      - name: Contrato SDD del piloto
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .specify/memory/constitution.md \
            specs/001-lms-pilot/spec.md \
            specs/001-lms-pilot/clarifications.md \
            specs/001-lms-pilot/plan.md \
            specs/001-lms-pilot/checklists/requirements.md \
            specs/001-lms-pilot/tasks.md \
            specs/001-lms-pilot/analysis.md \
            specs/001-lms-pilot/verify.md; do
            test -s "$file"
          done
          test -s docs/piloto-lms/OPERACION.md
          test -s docs/piloto-lms/PRIVACIDAD-PILOTO.md
          test -s docs/piloto-lms/ARQUITECTURA-Y-SEGURIDAD.md

      - name: Migraciones del piloto
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/202608300001_lms_pilot.sql \
            supabase/migrations/202608300002_lms_pilot_hardening.sql \
            supabase/migrations/202608300003_lms_pilot_rpc.sql \
            supabase/migrations/202608300004_lms_pilot_catalog.sql; do
            test -s "$file"
          done
          test -s supabase/pilot-admin.sql
          test -s supabase/tests/rls-adversarial.sql

      - name: Secretos de alta confianza
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files '.env' '.env.*' ':!.env.example')"
          if [ -n "$tracked_env" ]; then
            echo "Archivos .env versionados indebidamente:"
            echo "$tracked_env"
            exit 1
          fi

          if git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- . ':!docs/**' ':!SECURITY.md'; then
            echo 'Se detectó una posible clave privada.'
            exit 1
          fi

          if git grep -n -E -- 'sb_secret_[A-Za-z0-9_-]{12,}' -- ':!docs/**' ':!specs/**' ':!SECURITY.md'; then
            echo 'Se detectó una posible Supabase secret key.'
            exit 1
          fi

      - name: Fronteras del frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path('assets/lms/config.js').read_text(encoding='utf-8')
          if re.search(r"supabasePublishableKey\s*:\s*['\"]sb_secret_", config):
              raise SystemExit('config.js contiene una secret key en el campo público')

          teacher = Path('assets/lms/teacher.js').read_text(encoding='utf-8')
          if '.innerHTML' in teacher or 'insertAdjacentHTML' in teacher:
              raise SystemExit('teacher.js no puede interpretar HTML de estudiantes')

          pages = [Path(x) for x in ('pilot/index.html', 'pilot/s7.html', 'pilot/teacher.html')]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if 'Content-Security-Policy' not in text:
                  raise SystemExit(f'{page}: falta CSP')
              if "script-src 'self'" not in text:
                  raise SystemExit(f'{page}: script-src no está limitado a self')

          enabled = bool(re.search(r'enabled:\s*true', config))
          if enabled:
              if not re.search(r"supabaseUrl:\s*'https://[a-z0-9]+\.supabase\.co'", config):
                  raise SystemExit('Piloto enabled sin Supabase URL exacta')
              if not re.search(r"supabasePublishableKey:\s*'sb_publishable_[A-Za-z0-9_-]+'", config):
                  raise SystemExit('Piloto enabled sin publishable key válida')
              for page in pages:
                  if 'https://*.supabase.co' in page.read_text(encoding='utf-8'):
                      raise SystemExit(f'{page}: piloto enabled con connect-src wildcard')
          PY

      - name: Sin rastros de la rama SSDF descartada
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'piloto-lms-secure-ssdf' -- .; then
            echo 'Quedó una referencia a la rama descartada.'
            exit 1
          fi
          if git grep -n 'ARQUITECTURA-Y-SSDF' -- .; then
            echo 'Quedó una referencia al documento SSDF descartado.'
            exit 1
          fi

  codeql:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      packages: read
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3, 2026-08-26
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3, 2026-08-26
        with:
          category: /language:${{ matrix.language }}

# Snyk queda como gate opcional hasta que el repositorio tenga SNYK_TOKEN.
# No se simula una cobertura que todavía no existe. Como el runtime del piloto
# no añade paquetes npm ni CDN, CodeQL + secret guard cubren el código propio;
# Snyk se habilita antes de introducir nuevas dependencias de terceros.
