name: Sincronizar sitio desde manifiestos

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/curso.json'
      - 'tools/estilo-portada.css'
      - 'tools/construir-index.py'
      - 'tools/integrar-experiencia.py'
      - 'tools/normalizar_s9_ui.py'
      - 'tools/ajustar_validacion_s9.py'
      - 'assets/learning/learning-core.js'
      - 'assets/learning/learning-plan.json'
      - '.github/workflows/sincronizar-sitio.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Igualar controles de S9 con sesión 5
        run: python tools/normalizar_s9_ui.py

      - name: Alinear validación y manifiesto
        run: python tools/ajustar_validacion_s9.py

      - name: Generar portada desde curso.json
        run: python tools/construir-index.py

      - name: Integrar PWA y experiencia S6+
        run: python tools/integrar-experiencia.py

      - name: Validar curso
        run: python tools/validar_curso.py

      - name: Publicar revisión de S9
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Presentaciones/M3/sesion-9-ddl-supabase.html tools/curso.json tools/integrar-experiencia.py tools/validar_curso.py assets/learning/learning-core.js
          if git diff --cached --quiet; then
            echo 'S9 ya estaba normalizada'
            exit 0
          fi
          git commit -m 'Unificar S9 con controles de la sesión 5'
          git pull --rebase origin main
          git push origin main
