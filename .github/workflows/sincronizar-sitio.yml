name: Sincronizar sitio desde manifiestos

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/curso.json'
      - 'tools/estilo-portada.css'
      - 'tools/construir-index.py'
      - 'tools/integrar-experiencia.py'
      - 'tools/ajustar_plan_s9_auditoria.py'
      - 'assets/learning/learning-core.js'
      - 'assets/learning/learning-plan.json'
      - '.github/workflows/sincronizar-sitio.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Alinear plan de S9
        run: python tools/ajustar_plan_s9_auditoria.py

      - name: Generar portada desde curso.json
        run: python tools/construir-index.py

      - name: Integrar PWA y experiencia S6+
        run: python tools/integrar-experiencia.py

      - name: Validar curso
        run: python tools/validar_curso.py

      - name: Publicar cambios auditados
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html Presentaciones assets/learning/learning-plan.json; then
            echo 'Sitio y plan ya estaban sincronizados'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Presentaciones assets/learning/learning-plan.json
          git commit -m 'Alinear S9 con Supabase y sesión actual 7'
          git pull --rebase origin main
          git push origin main
