name: Sincronizar sitio desde manifiestos

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/curso.json'
      - 'tools/estilo-portada.css'
      - 'tools/construir-index.py'
      - 'tools/integrar-experiencia.py'
      - 'tools/actualizar_s15_auto.py'
      - 'tools/test_s15_autograder.py'
      - 'assets/learning/learning-core.js'
      - 'assets/learning/learning-plan.json'
      - 'assets/learning/s15-autograder.js'
      - 'assets/learning/s15-workbench.css'
      - 'evaluador-s15.html'
      - 'capstone.html'
      - 'Plantillas/proyecto-final/**'
      - 'Presentaciones/**/*.html'
      - 'Scripts/*.sql'
      - '.github/workflows/sincronizar-sitio.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Sincronizar S15 Workbench
        run: python tools/actualizar_s15_auto.py

      - name: Generar portada pública desde curso.json
        run: python tools/construir-index.py

      - name: Generar portada de revisión desde curso.json
        run: |
          cd revision
          python tools/construir-index.py

      - name: Integrar PWA y experiencia común
        run: python tools/integrar-experiencia.py

      - name: Validar sintaxis del Workbench S15
        run: node --check assets/learning/s15-autograder.js

      - name: S15 · probar DDL de referencia
        run: python -c "from tools.test_s15_autograder import test_reference_ddl; test_reference_ddl()"

      - name: S15 · probar 5 queries y mutaciones
        run: python -c "from tools.test_s15_autograder import test_reference_queries; test_reference_queries()"

      - name: S15 · validar interfaz del Workbench
        run: python -c "from tools.test_s15_autograder import test_workbench_contract; test_workbench_contract()"

      - name: S15 · validar presentación pública y revisión
        run: python -c "from tools.test_s15_autograder import test_presentation_contract; test_presentation_contract()"

      - name: S15 · validar 37 checkpoints y 100 puntos
        run: python -c "from tools.test_s15_autograder import test_scoring_contract; test_scoring_contract()"

      - name: Renovar caché del sitio
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('service-worker.js')
          text = p.read_text(encoding='utf-8')
          sha = os.environ['BUILD_SHA'][:12]
          text = re.sub(
              r"const VERSION = '[^']+';",
              f"const VERSION = 'andesdb-auto-{sha}';",
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validar curso
        run: python tools/validar_curso.py

      - name: Publicar cambios generados
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html revision/index.html \
            tools/curso.json revision/tools/curso.json \
            assets/learning/learning-plan.json revision/assets/learning/learning-plan.json \
            assets/learning/s15-autograder.js revision/assets/learning/s15-autograder.js \
            assets/learning/s15-workbench.css revision/assets/learning/s15-workbench.css \
            evaluador-s15.html revision/evaluador-s15.html \
            Presentaciones/M6/sesion-15-desafio-final.html revision/Presentaciones/M6/sesion-15-desafio-final.html \
            capstone.html revision/capstone.html \
            Plantillas/proyecto-final/README.md Plantillas/proyecto-final/criterios.md \
            revision/Plantillas/proyecto-final/README.md revision/Plantillas/proyecto-final/criterios.md \
            tools/integrar-experiencia.py revision/tools/integrar-experiencia.py \
            tools/validar_curso.py revision/tools/validar_curso.py \
            service-worker.js
          if git diff --cached --quiet; then
            echo 'Sitio ya sincronizado'
            exit 0
          fi
          git commit -m 'Sincronizar S15 Workbench, index y cache'
          git pull --rebase origin main
          git push origin main
