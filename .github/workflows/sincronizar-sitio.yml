name: Sincronizar sitio desde manifiestos

on:
  workflow_dispatch:
  push:
    branches: [main, s15-auditoria-integral-v7]
    paths:
      - 'tools/curso.json'
      - 'tools/estilo-portada.css'
      - 'tools/construir-index.py'
      - 'tools/integrar-experiencia.py'
      - 'tools/actualizar_s15_auto.py'
      - 'tools/test_s15_v7.py'
      - 'assets/learning/learning-core.js'
      - 'assets/learning/learning-plan.json'
      - 'assets/learning/s15-autograder-v7.js'
      - 'assets/learning/s15-nested-duckdb-v1.mjs'
      - 'assets/learning/s15-workbench-v7.css'
      - 'assets/learning/s15-teacher-link.js'
      - 'evaluador-s15.html'
      - 'evaluador-s15-v7.html'
      - 's15-analytics.html'
      - 'Plantillas/proyecto-final/**'
      - 'Presentaciones/**/*.html'
      - '.github/workflows/sincronizar-sitio.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Sincronizar S15 Workbench v7
        run: python tools/actualizar_s15_auto.py

      - name: Generar portada pública desde curso.json
        run: python tools/construir-index.py

      - name: Generar portada de revisión desde curso.json
        run: |
          cd revision
          python tools/construir-index.py

      - name: Integrar PWA y experiencia común
        run: python tools/integrar-experiencia.py

      - name: Alinear S15 pública y revisión tras integración
        run: |
          cp Presentaciones/M6/sesion-15-desafio-final.html revision/Presentaciones/M6/sesion-15-desafio-final.html
          cp Presentaciones/M6/sesion-15-desafio-final-v6.html revision/Presentaciones/M6/sesion-15-desafio-final-v6.html
          cp Presentaciones/M6/sesion-15-desafio-final-v7.html revision/Presentaciones/M6/sesion-15-desafio-final-v7.html

      - name: S15 v7 · validar sintaxis JavaScript
        run: |
          node --check assets/learning/s15-autograder-v7.js
          node --check assets/learning/s15-nested-duckdb-v1.mjs
          node --check assets/learning/s15-teacher-link.js

      - name: S15 v7 · cobertura integral y mutation tests
        run: |
          python tools/test_s15_v7.py

      - name: Renovar caché del sitio
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('service-worker.js');text=p.read_text(encoding='utf-8');sha=os.environ['BUILD_SHA'][:12]
          text=re.sub(r"const VERSION = '[^']+';",f"const VERSION = 'andesdb-auto-{sha}';",text,count=1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validar curso
        run: python tools/validar_curso.py

      - name: Publicar cambios generados
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --porcelain
          git add -A
          if git diff --cached --quiet; then
            echo 'Sitio ya sincronizado'
            exit 0
          fi
          git commit -m 'Sincronizar S15 Workbench integral v7, index y cache'
          git pull --rebase origin main
          git push origin main
