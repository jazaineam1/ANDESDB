          <section class="slide dense" data-title="Taller principal">
          <div class="ey">90–115 min · Producto</div>
          <h2>Primero una victoria pequeña; después, extensión</h2>
          <div class="vs-grid">
          <section><h3>Núcleo obligatorio</h3><ul>
          <li><strong>3 tablas</strong> que sí se relacionen.</li>
          <li>PK en las 3 y al menos <strong>2 FK</strong>.</li>
          <li>Al menos un <code>NOT NULL</code> justificado.</li>
          <li>Al menos un <code>CHECK</code>.</li>
          <li><strong>1 INSERT válido + 2 inválidos</strong>.</li>
          </ul><p class="small"><strong>Meta:</strong> que PostgreSQL acepte lo válido y rechace lo inválido por la razón esperada.</p></section>
