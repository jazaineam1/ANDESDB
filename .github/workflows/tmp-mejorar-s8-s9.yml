          <div class="ey">145–157 min · Cierre del laboratorio</div>
          <h2>Qué aprendimos del servicio real</h2>
          <div class="vs-grid">
          <section><h3>PostgreSQL</h3><p>Es el motor. Interpretó el DDL, creó objetos y rechazó filas cuando una restricción se incumplió.</p></section>
          <section><h3>Supabase</h3><p>Nos dio un PostgreSQL administrado y una interfaz para ejecutar SQL y revisar las tablas.</p></section>
          </div>
          <div class="hintbox"><p style="margin:0"><strong>El aprendizaje no es “usar Supabase”.</strong> Es poder llevar un modelo a un motor real y comprobar qué reglas quedaron realmente protegidas.</p></div>
