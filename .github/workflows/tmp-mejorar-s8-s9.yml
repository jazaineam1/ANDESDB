        PRIMARY KEY (pedido_id, mesa_id),
    CONSTRAINT fk_pedido_mesa_pedido
        FOREIGN KEY (pedido_id) REFERENCES pedido(pedido_id),
    CONSTRAINT fk_pedido_mesa_mesa
        FOREIGN KEY (mesa_id) REFERENCES mesa(mesa_id)
);</code></pre>
          <p class="hintbox">S7 cambió la regla: un pedido puede ocupar varias mesas. S8 conservó esa decisión. S9 la implementa con <code>pedido_mesa</code>. <strong>Es el mismo razonamiento de <code>film_category</code>.</strong></p>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>La cardinalidad se vuelve DDL</span></div>
          </section>''')

          s9 = replace_slide(s9, 'Romper la base', r'''
          <section class="slide " data-title="Romper la base">
          <div class="ey">115–135 min · Pruebas</div>
          <h2>Ahora intentamos guardar datos que deberían fallar</h2>
          <div class="steps">
          <article><b>1</b><h3>NOT NULL</h3><p><code>nombre = NULL</code></p></article>
          <article><b>2</b><h3>FK</h3><p>cliente inexistente</p></article>
          <article><b>3</b><h3>CHECK</h3><p><code>personas = 0</code></p></article>
          <article><b>4</b><h3>UNIQUE</h3><p><code>mesa.codigo</code> repetido</p></article>
          </div>
          <div class="warn"><p style="margin:0"><strong>NULL no es una cadena vacía.</strong> <code>NOT NULL</code> rechaza <code>NULL</code>, pero <code>''</code> es un valor de texto y puede ser aceptado. Si el negocio también prohíbe texto vacío, hace falta otra regla.</p></div>
          <p class="quote">Que una sentencia falle puede ser exactamente la evidencia que estábamos buscando.</p>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>Probar la regla, no solo el SQL</span></div>
          </section>''')

