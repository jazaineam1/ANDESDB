SET search_path TO abc_e01;</code></pre>
          <p class="hintbox"><strong>Aquí “schema” no significa el diagrama del modelo.</strong> En PostgreSQL es un espacio lógico dentro de la base, parecido a una carpeta de nombres. Lo usamos solo para que <code>cliente</code> del equipo 1 no choque con <code>cliente</code> del equipo 2.</p>
          <p class="small">No necesitamos profundizar en schemas, permisos ni búsqueda de objetos. Para esta clase: creen el suyo, actívenlo con <code>SET search_path</code> y continúen.</p>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>Schema = espacio lógico del equipo</span></div>
