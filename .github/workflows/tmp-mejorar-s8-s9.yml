name: Mejorar S8 y S9

on:
  push:
    paths:
      - '.github/workflows/tmp-mejorar-s8-s9.yml'
      - 'tools/tmp_patch_s8_s9.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar mejoras S8 y S9
        run: python tools/tmp_patch_s8_s9.py
      - name: Validar curso
        run: python tools/validar_curso.py
      - name: Publicar solo S8 y S9
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Presentaciones/M3/sesion-8-modelado-y-normalizacion.html Presentaciones/M3/sesion-9-ddl-supabase.html Scripts/S9.sql
          if git diff --cached --quiet; then
            echo 'No había cambios por publicar'
            exit 0
          fi
          git commit -m 'Mejorar continuidad pedagógica de S8 y S9'
          git pull --rebase origin main
          git push origin main
