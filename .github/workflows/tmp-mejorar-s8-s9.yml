name: Mejorar S8 y S9

on:
  push:
    paths:
      - '.github/workflows/tmp-mejorar-s8-s9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar mejoras pedagógicas S8 y S9
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_slide(text, title, new):
              marker = f'data-title="{title}"'
              p = text.find(marker)
              if p < 0:
                  raise SystemExit(f'No encontré la diapositiva: {title}')
              start = text.rfind('<section', 0, p)
              nxt = text.find('<section class="slide', p + len(marker))
              if nxt < 0:
                  nxt = text.find('<div class="progress"', p)
              if start < 0 or nxt < 0:
                  raise SystemExit(f'No pude delimitar la diapositiva: {title}')
              return text[:start] + new.strip() + '\n' + text[nxt:]

          s8p = Path('Presentaciones/M3/sesion-8-modelado-y-normalizacion.html')
          s8 = s8p.read_text(encoding='utf-8')

          s8 = replace_slide(s8, 'Otra pregunta', r'''
          <section class="slide dense mid" data-title="Otra pregunta">
          <div class="ey">7 minutos</div>
          <h2>Una pregunta que ayer no le hicimos</h2>
          <p class="lead">Ayer preguntamos si el modelo <strong>representaba las reglas</strong>. Hoy preguntamos otra cosa: <strong>¿qué le pasa cuando los datos cambian?</strong></p>
          <div class="g2">
          <div><h3>Una copia que puede quedar vieja</h3>
          <p>En este ejemplo <code>pedido.total</code> guarda exactamente la suma de las líneas. Al principio cuadra.</p>
          <div class="ctx"><p style="margin:0"><strong>No es un error de sintaxis.</strong> Es una decisión de diseño. Y una decisión puede funcionar hoy y volverse costosa mañana.</p></div>
          <p style="margin-top:.45em">El cliente pide un ajiaco más:</p>
          <pre><code>UPDATE linea_pedido
          SET cantidad = 3
          WHERE linea_id = 1;</code></pre>
          </div>
          <div><h3>El precio de guardar la copia</h3>
          <table class="optbl"><tbody>
          <tr><td><code>pedido.total</code></td><td><b>102.000</b></td></tr>
          <tr><td><code>SUM(linea_pedido)</code></td><td><b>134.000</b></td></tr>
          </tbody></table>
          <div class="warn" style="margin-top:.6em"><p style="margin:0">La base acepta el <code>UPDATE</code>. El problema no es que falle: <strong>el problema es que no falla</strong> y ahora dos copias dicen cosas distintas.</p></div>
          <p class="small" style="margin-top:.5em">Hoy no buscamos “borrar repetidos”. Buscamos entender <strong>de qué depende cada dato</strong> y qué información perderíamos si lo movemos o lo quitamos.</p></div>
          </div>
          <div class="brand"><span>Apertura</span><span>No es un error: es una decisión que envejeció</span></div>
          </section>''')

          s8 = replace_slide(s8, 'Dependencias', r'''
          <section class="slide dense mid" data-title="Dependencias">
          <div class="ey">12 minutos</div>
          <h2>«Si sé esto, ¿sé aquello?»</h2>
          <p class="lead">Esa pregunta es la forma práctica de reconocer una <strong>dependencia funcional</strong>. Primero se entiende; después se le pone nombre.</p>
          <div class="g2">
          <div><h3>La pregunta, siempre igual</h3>
          <div class="ctx"><p style="margin:0;font-size:1.06em">Si te digo <strong>X</strong>, ¿puedes conocer <strong>Y</strong> sin mirar nada más?</p></div>
          <table class="optbl"><tbody>
          <tr><td>mesa</td><td>puestos</td><td><b>sí</b></td></tr>
          <tr><td>mesero</td><td>documento</td><td><b>sí</b></td></tr>
          <tr><td>pedido</td><td>fecha</td><td><b>sí</b></td></tr>
          <tr><td>pedido</td><td>platos</td><td><b>no</b>: puede haber varios</td></tr>
          </tbody></table>
          <p class="small" style="margin-top:.5em">Luego la notación compacta será, por ejemplo: <code>mesa_id → puestos</code>.</p></div>
          <div><h3>¿Para qué sirve?</h3>
          <p><strong>La dependencia ayuda a decidir dónde debe vivir el dato.</strong></p>
          <ul class="checks">
          <li>Los puestos dependen de la <b>mesa</b> → viven en <code>mesa</code>.</li>
          <li>El documento depende del <b>mesero</b> → vive en <code>mesero</code>.</li>
          <li>El precio cobrado depende de la <b>línea de esa transacción</b>, no del precio actual del plato.</li>
          </ul>
          <div class="hintbox"><p style="margin:0"><strong>Primera pregunta de hoy:</strong> ¿de qué depende este atributo? Esa respuesta orienta dónde debe quedar.</p></div></div>
          </div>
          <div class="brand"><span>Dependencias</span><span>Cada dato, donde depende</span></div>
          </section>''')

          s8 = replace_slide(s8, '1FN', r'''
          <section class="slide dense mid" data-title="1FN">
          <div class="ey">12 minutos · juntos</div>
          <h2>Primera forma normal: una celda, un dato</h2>
          <p class="lead">Aquí sí hay una idea sencilla: <strong>una celda no debería contener una lista de valores que luego tengamos que partir</strong>.</p>
          <div class="g2">
          <div><h3>Antes</h3>
          <table class="optbl"><tbody><tr><td>pedido 1</td><td><b>Ajiaco x2; Bandeja paisa x1</b></td></tr></tbody></table>
          <p class="small" style="margin-top:.4em">Para el motor eso es una cadena de texto. Contar platos, relacionarlos o validar cantidades exige desarmarla.</p>
          <div class="warn"><p style="margin:0">1FN habla de <strong>atomicidad de los valores</strong>. No decide automáticamente cuál debe ser la clave primaria.</p></div></div>
          <div><h3>Después</h3>
          <table class="optbl"><thead><tr><th>linea_id</th><th>pedido_id</th><th>plato_id</th><th>cantidad</th></tr></thead><tbody>
          <tr><td>1</td><td>1</td><td>10</td><td>2</td></tr>
          <tr><td>2</td><td>1</td><td>14</td><td>1</td></tr>
          </tbody></table>
          <p style="margin-top:.5em"><strong>Una fila por línea.</strong> En nuestro modelo de referencia conservamos <code>linea_id</code> como PK.</p>
          <div class="hintbox"><p style="margin:0"><code>(pedido_id, plato_id)</code> podría ser una clave <strong>si el negocio confirma</strong> que un plato solo aparece una vez por pedido y luego solo aumenta <code>cantidad</code>. Como nadie confirmó esa regla, <strong>no la inventamos</strong>.</p></div></div>
          </div>
          <div class="brand"><span>1FN</span><span>Una celda, un dato · la PK se decide aparte</span></div>
          </section>''')

          s8 = replace_slide(s8, 'El taller', r'''
          <section class="slide yellow dense mid" data-title="El taller">
          <div class="ey">Taller · 35 minutos en salas</div>
          <h2>Lleven la hoja hasta el final</h2>
          <p class="lead">La hoja ya está en 1FN. Ahora muevan cada atributo al lugar donde <strong>realmente depende</strong>, sin perder información ni inventar reglas.</p>
          <div class="g2">
          <div><h3>Las dos preguntas</h3>
          <ol class="steps">
          <li><strong>¿De qué depende esta columna?</strong> Eso orienta dónde debe vivir.</li>
          <li><strong>Si la separo o la quito, ¿puedo reconstruir la información sin perder significado?</strong></li>
          </ol>
          <div class="ctx"><p style="margin:0">El <b>total</b> es un buen candidato para discutir: en nuestro caso didáctico es exactamente la suma de las líneas. El <b>precio_unitario</b>, en cambio, conserva el precio histórico cobrado.</p></div></div>
          <div><h3>Lo que entregan</h3>
          <ul class="checks">
          <li>Las tablas resultantes, cada una con su <strong>PK</strong>.</li>
          <li>Para cada atributo que movieron: <strong>de qué depende</strong>.</li>
          <li>Las relaciones necesarias para volver a unir la información.</li>
          <li>Una decisión que <strong>no se pueda tomar sin preguntarle al negocio</strong>.</li>
          </ul>
          <div class="hintbox"><p style="margin:0">Normalizar no es “partir hasta que se vea bonito”. Es <strong>poner cada dato donde corresponde y comprobar que la separación no destruyó información</strong>.</p></div></div>
          </div>
          <div class="brand"><span>Taller · 2FN y 3FN</span><span>Dependencia + reconstrucción</span></div>
          </section>''')

          s8 = replace_slide(s8, 'La lente', r'''
          <section class="slide dense mid" data-title="La lente">
          <div class="ey">22 minutos · en la herramienta</div>
          <h2>Paso 8: una lente, no un verificador automático</h2>
          <p class="lead">Abran el constructor y carguen el código del modelo. El paso 8 sirve para <strong>examinar redundancias concretas del caso</strong>; no certifica que todo el modelo esté “en 3FN”.</p>
          <div class="g2">
          <div><h3>Qué hace la lente</h3>
          <ol class="steps">
          <li><strong>Señala</strong> datos que aparecen en más de un lugar.</li>
          <li>Ejecuta un cambio que puede volver inconsistentes esas copias.</li>
          <li>Permite probar qué pasa si una copia se elimina.</li>
          <li>Vuelve a ejecutar pruebas para comprobar que el modelo sigue respondiendo.</li>
          </ol></div>
          <div><h3>Qué NO hace</h3>
          <ul class="checks">
          <li>No decide por ustedes si dos valores iguales significan lo mismo.</li>
          <li>No sabe qué información histórica exige el negocio.</li>
          <li>No reemplaza la pregunta <strong>“¿de qué depende?”</strong>.</li>
          </ul>
          <div class="hintbox"><p style="margin:0">La herramienta ayuda a <strong>ver consecuencias</strong>. La decisión de diseño sigue siendo de ustedes.</p></div></div>
          </div>
          <div class="brand"><span>La lente</span><span>Observar consecuencias, no certificar</span></div>
          </section>''')

          s8 = replace_slide(s8, 'Las dos caras', r'''
          <section class="slide dense mid" data-title="Las dos caras">
          <div class="ey">12 minutos · lo más importante de hoy</div>
          <h2>Mismo número no significa mismo dato</h2>
          <p class="lead"><code>pedido.total</code> y <code>linea_pedido.precio_unitario</code> pueden parecer “copias”. Pero responden a <strong>dependencias y significados distintos</strong>.</p>
          <div class="tabla-envuelta"><table class="optbl">
          <thead><tr><th></th><th><code>pedido.total</code></th><th><code>linea_pedido.precio_unitario</code></th></tr></thead>
          <tbody>
          <tr><td>¿De qué depende?</td><td>de las líneas del pedido</td><td>de esa línea en ese momento</td></tr>
          <tr><td>¿Se reconstruye hoy?</td><td>sí, con <code>SUM(...)</code></td><td>no desde <code>plato.precio_actual</code></td></tr>
          <tr><td>Si cambia el origen…</td><td>una copia guardada puede quedar vieja</td><td>el valor histórico debe quedarse igual</td></tr>
          <tr><td>En este caso</td><td>preferimos calcularlo</td><td><b>se conserva</b></td></tr>
          </tbody></table></div>
          <div class="ctx" style="margin-top:.5em"><p style="margin:0;font-size:1.04em"><strong>Las dos preguntas completas son:</strong> ¿de qué depende este dato? y ¿puedo reconstruirlo sin perder información ni significado histórico?</p></div>
          <p class="small" style="margin-top:.4em">Si el negocio dijera que al cerrar una factura el total queda legalmente congelado —con descuentos, impuestos o redondeos— ya no estaríamos hablando del mismo dato derivable. <strong>La semántica manda.</strong></p>
          <div class="brand"><span>Las dos caras</span><span>Dependencia + significado</span></div>
          </section>''')

          s8 = replace_slide(s8, 'Sin perdida', r'''
          <section class="slide dense mid" data-title="Sin perdida">
          <div class="ey">12 minutos</div>
          <h2>Comprueben que la separación no perdió información</h2>
          <p class="lead">No necesitamos sintaxis nueva. Con <code>WITH</code>, <code>GROUP BY</code> y <code>JOIN</code> —que ya conocen— podemos reconstruir la parte de la hoja que acabamos de separar.</p>
          <div class="g2">
          <div><h3>Primero, el total por pedido</h3>
          <pre><code>WITH totales AS (
    SELECT pedido_id,
           SUM(cantidad * precio_unitario) AS total
    FROM linea_pedido
    GROUP BY pedido_id
)
SELECT p.pedido_id,
       l.linea_id,
       pl.nombre,
       l.cantidad,
       l.precio_unitario,
       t.total
FROM pedido p
JOIN linea_pedido l ON l.pedido_id = p.pedido_id
JOIN plato pl        ON pl.plato_id = l.plato_id
JOIN totales t       ON t.pedido_id = p.pedido_id;</code></pre></div>
          <div><h3>¿Qué estamos comprobando?</h3>
          <ul class="checks">
          <li>Las líneas siguen perteneciendo al pedido correcto.</li>
          <li>El plato y el precio histórico siguen disponibles.</li>
          <li>El total reaparece aunque ya no esté guardado en <code>pedido</code>.</li>
          </ul>
          <div class="hintbox"><p style="margin:0">La comprobación no es “el SQL ejecutó”. Es: <strong>¿puedo recuperar la información que el negocio necesitaba antes de separar?</strong></p></div>
          <p class="small" style="margin-top:.5em">Y hagan la comprobación de S5: si esperaban dos líneas y aparecen cuatro, revisen el nivel de agregación y los <code>JOIN</code>.</p></div>
          </div>
          <div class="brand"><span>Sin pérdida</span><span>Reconstruir con SQL que ya conocen</span></div>
          </section>''')

          s8 = replace_slide(s8, 'A proposito', r'''
          <section class="slide dense mid" data-title="A proposito">
          <div class="ey">5 minutos</div>
          <h2>Y a veces se duplica a propósito</h2>
          <p class="lead">Normalizar no significa jurar que nunca volveremos a guardar algo calculable. Significa <strong>primero diseñar limpio y después medir</strong>.</p>
          <div class="g2">
          <div><div class="ctx"><p style="margin:0">La dueña: «la caja mensual ya tarda demasiado».</p></div>
          <p>Si medir demuestra que reconstruir una cifra cuesta demasiado, se puede guardar una copia calculada conscientemente.</p></div>
          <div><h3>La diferencia</h3>
          <ul class="checks">
          <li>Se hace <strong>después de medir</strong>, no por intuición.</li>
          <li>Se define <strong>quién la actualiza</strong> y cuándo.</li>
          <li>Se acepta que esa copia tiene un <strong>costo de consistencia</strong>.</li>
          </ul>
          <div class="hintbox"><p style="margin:0">Desnormalizar no contradice lo de hoy: es una optimización deliberada sobre un modelo cuyo comportamiento ya entendemos.</p></div></div>
          </div>
          <div class="brand"><span>Desnormalizar</span><span>Después de medir, no antes</span></div>
          </section>''')

          s8 = replace_slide(s8, 'Cierre', r'''
          <section class="slide yellow xdense mid" data-title="Cierre">
          <div class="ey">Cierre · 5 minutos</div>
          <h2>El modelo ya está listo para convertirse en una base real</h2>
          <div class="g2">
          <div><h3>Lo que te llevas</h3>
          <ul class="checks">
          <li>Una dependencia funcional se puede leer como: <strong>«si sé X, ¿sé Y?»</strong>.</li>
          <li>1FN evita listas dentro de una celda; <strong>no decide sola la PK</strong>.</li>
          <li>2FN y 3FN ayudan a colocar atributos donde realmente dependen.</li>
          <li>No basta preguntar «¿está repetido?»: pregunta <strong>de qué depende</strong> y si puedes <strong>reconstruir sin perder información o significado</strong>.</li>
          <li><code>precio_unitario</code> demuestra que <strong>mismo valor ≠ mismo dato</strong>.</li>
          <li>El modelo conserva la decisión de S7 de permitir varias mesas por pedido mediante <code>pedido_mesa</code>.</li>
          </ul></div>
          <div><h3>Sesión 9</h3>
          <div class="hintbox"><p style="margin:0"><strong>DDL + Supabase/PostgreSQL.</strong> No inventaremos otro modelo. Tomaremos este mismo y lo traduciremos a <code>CREATE TABLE</code>, PK, FK, <code>NOT NULL</code> y <code>CHECK</code>.</p></div>
          <p style="margin-top:.8em"><strong>La prueba final:</strong> intentaremos guardar datos inválidos. Si PostgreSQL los rechaza por la razón correcta, la decisión de diseño dejó de ser un dibujo y se volvió una regla ejecutable.</p></div>
          </div>
          <div class="brand"><span>Cierre</span><span>¿Dónde vive y qué perdería si lo quito?</span></div>
          </section>''')

          s8p.write_text(s8, encoding='utf-8')

          s9p = Path('Presentaciones/M3/sesion-9-ddl-supabase.html')
          s9 = s9p.read_text(encoding='utf-8')

          s9 = replace_slide(s9, 'Anatomía de una columna', r'''
          <section class="slide " data-title="Anatomía de una columna">
          <div class="ey">18–33 min · Leer antes de escribir</div>
          <h2>Una columna se lee de izquierda a derecha</h2>
          <pre><code>nombre TEXT NOT NULL</code></pre>
          <div class="steps" style="margin-top:1.2em">
          <article><b>1</b><h3><code>nombre</code></h3><p>Nombre de la columna.</p></article>
          <article><b>2</b><h3><code>TEXT</code></h3><p>Tipo de dato.</p></article>
          <article><b>3</b><h3><code>NOT NULL</code></h3><p>No acepta <code>NULL</code>.</p></article>
          <article><b>4</b><h3><code>,</code></h3><p>Continúa otra definición.</p></article>
          </div>
          <div class="hintbox"><p style="margin:0"><strong>Microactividad · 60 segundos:</strong> lean en voz alta <code>personas INTEGER NOT NULL</code> sin usar palabras SQL. Después inventen un valor que esa línea sí acepte y uno que no.</p></div>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>Nombre → tipo → regla</span></div>
          </section>''')

          s9 = replace_slide(s9, 'Sintaxis de restricciones', r'''
          <section class="slide dense" data-title="Sintaxis de restricciones">
          <div class="ey">18–33 min · Reglas declarativas</div>
          <h2>¿Cómo se escribe cada restricción?</h2>
          <table class="tbl"><thead><tr><th>Necesidad</th><th>Sintaxis</th><th>Qué protege</th></tr></thead><tbody>
          <tr><td>Obligatorio</td><td><code>nombre TEXT NOT NULL</code></td><td>no acepta <code>NULL</code></td></tr>
          <tr><td>Sin repetir</td><td><code>codigo TEXT UNIQUE</code></td><td>no acepta dos valores iguales <b>si el negocio exige unicidad</b></td></tr>
          <tr><td>Valor por omisión</td><td><code>estado TEXT DEFAULT 'abierto'</code></td><td>rellena cuando la columna se omite</td></tr>
          <tr><td>Identidad</td><td><code>PRIMARY KEY (cliente_id)</code></td><td>identifica una fila</td></tr>
          <tr><td>Relación</td><td><code>FOREIGN KEY (...) REFERENCES ...</code></td><td>evita referencias huérfanas</td></tr>
          <tr><td>Condición</td><td><code>CHECK (personas &gt; 0)</code></td><td>valida una condición de la fila</td></tr>
          </tbody></table>
          <p class="warn"><code>DEFAULT</code> no valida una regla del negocio. Y <code>UNIQUE</code> tampoco se agrega “porque suena bien”: <strong>la unicidad debe estar justificada</strong>.</p>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>Sintaxis de restricciones</span></div>
          </section>''')

          s9 = replace_slide(s9, 'Primer CREATE', r'''
          <section class="slide " data-title="Primer CREATE">
          <div class="ey">18–33 min · Anatomía</div>
          <h2>Primera tabla: <code>cliente</code></h2>
          <pre><code>CREATE TABLE cliente (
    cliente_id BIGINT GENERATED ALWAYS AS IDENTITY,
    nombre TEXT NOT NULL,
    telefono TEXT,

    CONSTRAINT pk_cliente PRIMARY KEY (cliente_id)
);</code></pre>
          <p class="hintbox"><strong>Lectura natural:</strong> cada cliente tiene un identificador generado, un nombre obligatorio y un teléfono opcional.</p>
          <p class="small">No declaramos <code>UNIQUE (telefono)</code>: nadie confirmó que dos clientes no puedan compartir un teléfono. Practicaremos <code>UNIQUE</code> después con <code>mesa.codigo</code> como <strong>decisión explícita de diseño</strong>.</p>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>Primer CREATE</span></div>
          </section>''')

          s9 = replace_slide(s9, 'Relación real', r'''
          <section class="slide dense" data-title="Relación real">
          <div class="ey">33–48 min · FK</div>
          <h2>Segunda tabla: <code>reserva</code></h2>
          <pre class="smallcode"><code>CREATE TABLE reserva (
    reserva_id BIGINT GENERATED ALWAYS AS IDENTITY,
    cliente_id BIGINT NOT NULL,
    fecha DATE NOT NULL,
    hora TIME NOT NULL,
    personas INTEGER NOT NULL,

    CONSTRAINT pk_reserva PRIMARY KEY (reserva_id),
    CONSTRAINT fk_reserva_cliente
        FOREIGN KEY (cliente_id)
        REFERENCES cliente(cliente_id),
    CONSTRAINT ck_reserva_personas CHECK (personas &gt; 0)
);</code></pre>
          <div class="g2" style="margin-top:.7em"><div class="hintbox"><p style="margin:0"><strong>S7:</strong> una reserva pertenece a un cliente. <strong>S9:</strong> esa relación se vuelve <code>FOREIGN KEY</code>.</p></div><div class="ctx"><p style="margin:0"><strong>Microactividad · 60 segundos:</strong> sin ejecutar nada, escriban un <code>cliente_id</code> que debería funcionar y otro que debería fallar. Luego expliquen por qué.</p></div></div>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>Relación real</span></div>
          </section>''')

          s9 = replace_slide(s9, 'CHECK tiene límites', r'''
          <section class="slide " data-title="CHECK tiene límites">
          <div class="ey">33–48 min · No todo cabe ahí</div>
          <h2>Un <code>CHECK</code> mira una condición de la fila</h2>
          <div class="proscons">
          <section class="pro"><h3>Sí es buen candidato</h3><ul><li><code>personas &gt; 0</code></li><li><code>precio &gt;= 0</code></li><li><code>estado IN (...)</code></li></ul></section>
          <section class="con"><h3>No cabe como CHECK simple</h3><ul><li>comparar con puestos guardados en otra tabla</li><li>detectar intervalos de reservas que se solapan</li><li>sumar pagos de varias filas</li></ul></section>
          </div>
          <div class="hintbox"><p style="margin:0"><strong>Microactividad · 90 segundos:</strong> inventen un valor que pase <code>CHECK (personas &gt; 0)</code> y otro que falle. Después expliquen por qué <code>personas &lt;= mesa.puestos</code> no es la misma clase de problema.</p></div>
          <p class="quote">Una restricción demasiado débil deja pasar errores; una inventada puede prohibir negocio válido.</p>
          <div class="brand"><span>ANDESDB · Sesión 9</span><span>CHECK tiene límites</span></div>
          </section>''')

