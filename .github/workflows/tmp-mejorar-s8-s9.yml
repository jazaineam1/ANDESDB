          <div class="ey">157–160 min · Nota, no otra unidad</div>
          <h2>Hoy no estamos publicando una API</h2>
          <p class="lead">Trabajamos desde <strong>SQL Editor</strong> en un schema de clase como <code>abc_e01</code>. No daremos permisos a clientes web ni construiremos autenticación.</p>
          <div class="g2"><div class="hintbox"><p style="margin:0"><strong>Para esta sesión:</strong> DDL, tablas y restricciones. Nada de keys, Auth, policies ni frontend.</p></div><div class="warn"><p style="margin:0"><strong>Para una app real:</strong> acceso por Data API y RLS son otra decisión de seguridad. La exposición de tablas depende de la configuración del proyecto y de los permisos otorgados.</p></div></div>
