name: Alinear S8 y S9 con S6

on:
  push:
    paths:
      - '.github/workflows/tmp-patch-s8-s9-desde-s6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar mejoras basadas en S6
        run: python tools/tmp_patch_s8_s9_desde_s6.py

      - name: Regenerar experiencia sin cambiar la estructura del curso
        run: |
          python tools/construir-index.py
          python tools/integrar-experiencia.py

      - name: Comprobar alcance del cambio
        shell: bash
        run: |
          git diff --quiet -- Presentaciones/M3/sesion-7-de-las-reglas-al-modelo.html || {
            echo '::error::S7 cambió y debía permanecer intacta'; exit 1;
          }
          git diff --quiet -- index.html || {
            echo '::error::La portada cambió y no forma parte de esta mejora'; git diff -- index.html; exit 1;
          }
          permitidos='^(Presentaciones/M3/sesion-8-modelado-y-normalizacion.html|Presentaciones/M3/sesion-9-ddl-supabase.html|Scripts/S9.sql)$'
          inesperados=$(git diff --name-only | grep -Ev "$permitidos" || true)
          if [ -n "$inesperados" ]; then
            echo '::error::Se modificaron archivos fuera de S8/S9:'
            echo "$inesperados"
            exit 1
          fi

      - name: Validar curso
        run: |
          python tools/pre_push_check.py
          python tools/validar_curso.py

      - name: Publicar S8 y S9
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Presentaciones/M3/sesion-8-modelado-y-normalizacion.html \
                  Presentaciones/M3/sesion-9-ddl-supabase.html \
                  Scripts/S9.sql
          if git diff --cached --quiet; then
            echo 'No hay cambios que publicar'
            exit 0
          fi
          git commit -m 'Alinear S8 y S9 con la certeza definida en S6'
          git push
