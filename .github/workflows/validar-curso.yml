name: Validar curso

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'assets/learning/**'
      - 'assets/pwa-install.js'
      - 'Presentaciones/**/*.html'
      - 'Scripts/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'revision/**'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/validar-curso.yml'

permissions:
  contents: read

jobs:
  quality:
    name: Course QA
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar contrato pre-push de IA
        run: python tools/pre_push_check.py

      - name: Validar estructura, pedagogía y recursos
        run: python tools/validar_curso.py

      - name: Auditar historia pregunta-respuesta de revision
        run: python revision/tools/auditar_preguntas.py

      - name: Auditar lecturas y feedback del laboratorio
        run: python revision/tools/auditar_lecturas_feedback.py

      - name: Validar JavaScript de la experiencia
        run: |
          node --check assets/learning/learning-core.js
          node --check assets/pwa-install.js
          node --check service-worker.js
          node --check Presentaciones/M3/sql-lab-s6.js
          node --check revision/assets/learning/presentation-story-v2-patch.js
          node --check revision/assets/learning/presentation-story-v3-polish.js
          node --check revision/assets/learning/presentation-story-s15-patch.js
          node --check revision/assets/learning/presentation-selfcontained-v1.js
          node --check revision/assets/learning/presentation-study-cleanup-v1.js
          node --check revision/assets/learning/presentation-material-alignment-v1.js
          node --check revision/assets/learning/interactive-nav.js
          node --check revision/assets/learning/learning-core.js
          node --check revision/assets/learning/portal-ux-v2.js
          node --check revision/assets/learning/course-story-ui.js
          node --check revision/assets/learning/readings-v6.js
          node --check revision/assets/learning/readings-v7-alignment.js
          node --check revision/assets/learning/lab-content-s13-s16-alignment-v1.js
          node --check revision/assets/learning/lab-runtime-v4.js
          node --check revision/assets/learning/lab-runtime-v7.js
          node --check revision/assets/learning/lab-sql-engine-v1.js
          node --check revision/assets/learning/lab-sql-worker-v1.js
          node --check revision/assets/learning/lab-ux-v7.js
          node --check revision/assets/learning/lab-progress-reliability-v2.js
          node --check revision/assets/learning/lab-hints-v2.js
          node --check revision/assets/learning/lab-context-output-v2.js
          node --check revision/assets/learning/lab-sql-scaffold-v2.js
          node --check revision/assets/learning/lab-context-output-v1.js
          node --check revision/assets/learning/lab-progress-reliability-v1.js
          node --check revision/assets/learning/lab-hints-v1.js
          node --check revision/assets/learning/lab-sql-scaffold-v1.js
          node --check revision/assets/learning/lab-finish-v1.js
          node --check revision/Presentaciones/M3/sql-lab-s9.js
          node --check revision/service-worker.js
          if [ -f assets/learning/analytics-fallback-link.js ]; then
            node --check assets/learning/analytics-fallback-link.js
          fi

      - name: Proteger rendimiento móvil del laboratorio SQL
        run: |
          set -euo pipefail
          LOADER='revision/assets/learning/lab-runtime-v4.js'
          RUNTIME='revision/assets/learning/lab-runtime-v7.js'
          ENGINE='revision/assets/learning/lab-sql-engine-v1.js'
          WORKER='revision/assets/learning/lab-sql-worker-v1.js'
          SCAFFOLD='revision/assets/learning/lab-sql-scaffold-v2.js'

          grep -q 'lab-runtime-v7.js' "$LOADER" || { echo '::error::El loader debe activar runtime v7.'; exit 1; }
          if grep -q 'lab-runtime-v5.js' "$LOADER"; then
            echo '::error::No se puede reactivar runtime v5 en el laboratorio.'
            exit 1
          fi
          grep -q 'new Worker' "$ENGINE" || { echo '::error::SQL debe ejecutarse mediante Web Worker.'; exit 1; }
          grep -q 'importScripts' "$WORKER" || { echo '::error::El Worker debe cargar SQL.js fuera del hilo principal.'; exit 1; }
          if grep -q 'initSqlJs' "$RUNTIME" || grep -q 'new SQL.Database' "$RUNTIME"; then
            echo '::error::runtime v7 no puede inicializar SQL.js en el hilo de interfaz.'
            exit 1
          fi
          if grep -q 'initSqlJs' "$SCAFFOLD" || grep -q 'new SQL.Database' "$SCAFFOLD"; then
            echo '::error::El revisor de sintaxis no puede crear un segundo motor SQL.'
            exit 1
          fi
          if grep -q 'warmSQL' "$RUNTIME"; then
            echo '::error::No se permite precalentar SQL mientras el estudiante puede estar escribiendo.'
            exit 1
          fi
          grep -q 'interactive-widget=resizes-content' revision/lab.html || { echo '::error::Falta manejo explícito del teclado móvil.'; exit 1; }

      - name: Comprobar que la portada se puede regenerar
        run: |
          python tools/construir-index.py
          python tools/integrar-experiencia.py

      - name: Detectar archivos generados desincronizados
        run: |
          if ! git diff --quiet -- index.html Presentaciones; then
            echo '::error::Hay archivos generados desincronizados. El workflow Sincronizar sitio debe regenerarlos.'
            git diff -- index.html Presentaciones
            exit 1
          fi
