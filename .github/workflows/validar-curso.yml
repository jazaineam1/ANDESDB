name: Validar curso

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'assets/learning/**'
      - 'assets/pwa-install.js'
      - 'Presentaciones/**/*.html'
      - 'Scripts/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'revision/**'
      - '.gitignore'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/validar-curso.yml'

permissions:
  contents: read

jobs:
  quality:
    name: Course QA
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar contrato pre-push de IA
        run: python tools/pre_push_check.py

      - name: Validar estructura, pedagogía y recursos
        run: python tools/validar_curso.py

      - name: Validar evaluación integral S15 v7
        run: |
          python tools/test_s15_v7.py
          python tools/test_s15_solution_v7.py

      - name: S15 v7 · prueba UI jsdom + SQL.js
        run: |
          npm install --no-save --package-lock=false jsdom@26 sql.js@1.13.0
          node tools/test_s15_v7_ui.mjs
          node tools/test_s15_solution_v7_ui.mjs
          node tools/test_s15_cohort_persistence.mjs
          node tools/test_s15_v7_persistence_modes.mjs

      - name: S16 · cierre + primer contacto DP-900
        run: |
          python tools/test_s16_dp900.py
          node tools/test_s16_dp900_ui.mjs

      - name: Auditar historia pregunta-respuesta de revision
        run: python revision/tools/auditar_preguntas.py

      - name: Auditar lecturas y feedback del laboratorio
        run: python revision/tools/auditar_lecturas_feedback.py

      - name: Auditar correspondencia presentación y laboratorio
        run: node revision/tools/auditar_laboratorios_curriculo.mjs

      - name: Auditar panel docente, archivado y UX institucional
        run: python revision/tools/auditar_teacher_dashboard.py

      - name: Proteger acceso automático por correo
        run: |
          set -euo pipefail
          grep -q 'email-access-v1.js' revision/assets/learning/lms-platform.js || { echo '::error::El portal debe cargar el runtime de acceso por correo.'; exit 1; }
          grep -q 'exchange_supabase' revision/assets/learning/email-access-v1.js || { echo '::error::El enlace de correo debe intercambiarse por una sesión LMS.'; exit 1; }
          grep -q 'history.replaceState' revision/assets/learning/email-access-v1.js || { echo '::error::El token del correo debe retirarse de la URL antes de continuar.'; exit 1; }
          grep -q 'email-access-v1.js' revision/service-worker.js || { echo '::error::La PWA debe incluir el runtime de acceso por correo.'; exit 1; }

      - name: Proteger salida visible y estilo institucional
        run: |
          set -euo pipefail
          grep -q 'session-controls-v1.js' revision/assets/learning/uniandes-skin-v1.js || { echo '::error::El LMS debe cargar el control global de sesión.'; exit 1; }
          grep -q "textContent='Salir'" revision/assets/learning/session-controls-v1.js || { echo '::error::El botón Salir debe permanecer visible para usuarios autenticados.'; exit 1; }
          grep -q 'session-controls-v1.js' revision/service-worker.js || { echo '::error::La PWA debe precachear el control global de sesión.'; exit 1; }
          if grep -q 'border-left:5px solid #175cd3' revision/assets/learning/portal-ux-v2.js; then
            echo '::error::No reintroducir el borde lateral azul tipo tarjeta generada por IA.'; exit 1
          fi
          if grep -q 'border-left:4px solid var(--andes-gold' revision/assets/learning/teacher-dashboard-ux-v2.js; then
            echo '::error::No reintroducir borde lateral de color en tarjetas docentes.'; exit 1
          fi

      - name: Mantener el minutaje fuera de las diapositivas del estudiante
        run: |
          set -euo pipefail
          CORE='revision/assets/learning/learning-core.js'
          CLEAN='revision/assets/learning/presentation-pacing-cleanup-v1.js'
          S16='revision/Presentaciones/M6/sesion-16-cierre-dp900.html'
          grep -q 'presentation-pacing-cleanup-v1.js' "$CORE" || { echo '::error::S13-S16 deben cargar la limpieza de ritmo flexible.'; exit 1; }
          grep -q 'presentation-pacing-cleanup-v1.js' "$S16" || { echo '::error::S16 debe aplicar la misma limpieza de ritmo que S13-S15.'; exit 1; }
          grep -q 'sc-activity' "$CLEAN" || { echo '::error::La limpieza debe retirar la capa actividad/producto heredada.'; exit 1; }
          grep -q 'sc-note-open' "$CLEAN" || { echo '::error::La guía docente N no debe quedar expuesta en la proyección.'; exit 1; }
          if grep -q 'presentation-selfcontained-v1.js' "$CORE"; then
            echo '::error::No reactivar la capa selfcontained que inyecta minutajes y productos en S13-S16.'; exit 1
          fi
          if grep -q 'presentation-selfcontained-v1.js' "$S16"; then
            echo '::error::S16 no debe inyectar la capa selfcontained visible.'; exit 1
          fi

      - name: Validar JavaScript de la experiencia
        run: |
          node --check assets/learning/learning-core.js
          node --check assets/learning/s15-autograder-v7.js
          node --check revision/assets/learning/s15-autograder-v7.js
          node --check assets/learning/s15-autograder-v7-practice.js
          node --check revision/assets/learning/s15-autograder-v7-practice.js
          node --check assets/learning/s15-autograder-v7-solution.js
          node --check revision/assets/learning/s15-autograder-v7-solution.js
          node --check assets/learning/s15-nested-duckdb-v1.mjs
          node --check assets/learning/s15-azure-transfer-v1.js
          node --check assets/pwa-install.js
          node --check service-worker.js
          node --check Presentaciones/M3/sql-lab-s6.js
          node --check revision/assets/learning/presentation-story-v2-patch.js
          node --check revision/assets/learning/presentation-story-v3-polish.js
          node --check revision/assets/learning/presentation-story-s15-patch.js
          node --check revision/assets/learning/presentation-selfcontained-v1.js
          node --check revision/assets/learning/presentation-study-cleanup-v1.js
          node --check revision/assets/learning/presentation-pacing-cleanup-v1.js
          node --check revision/assets/learning/presentation-material-alignment-v1.js
          node --check revision/assets/learning/interactive-nav.js
          node --check revision/assets/learning/learning-core.js
          node --check revision/assets/learning/portal-ux-v2.js
          node --check revision/assets/learning/email-access-v1.js
          node --check revision/assets/learning/session-controls-v1.js
          node --check revision/assets/learning/course-story-ui.js
          node --check revision/assets/learning/course-data.js
          node --check revision/assets/learning/uniandes-skin-v1.js
          node --check revision/assets/learning/teacher-dashboard-ux-v2.js
          node --check revision/assets/learning/lms-platform.js
          node --check revision/assets/learning/readings-v6.js
          node --check revision/assets/learning/readings-v7-alignment.js
          node --check revision/assets/learning/lab-content-s13-s16-alignment-v1.js
          node --check revision/assets/learning/lab-curriculum-v1.js
          node --check revision/assets/learning/lab-runtime-v4.js
          node --check revision/assets/learning/lab-runtime-v7.js
          node --check revision/assets/learning/lab-sql-engine-v1.js
          node --check revision/assets/learning/lab-sql-worker-v1.js
          node --check revision/assets/learning/lab-ux-v7.js
          node --check revision/assets/learning/lab-progress-reliability-v2.js
          node --check revision/assets/learning/lab-hints-v2.js
          node --check revision/assets/learning/lab-context-output-v2.js
          node --check revision/assets/learning/lab-sql-scaffold-v2.js
          node --check revision/assets/learning/lab-theme-v1.js
          node --check revision/assets/learning/lab-context-output-v1.js
          node --check revision/assets/learning/lab-progress-reliability-v1.js
          node --check revision/assets/learning/lab-hints-v1.js
          node --check revision/assets/learning/lab-sql-scaffold-v1.js
          node --check revision/assets/learning/lab-finish-v1.js
          node --check revision/Presentaciones/M3/sql-lab-s9.js
          node --check revision/service-worker.js
          if [ -f assets/learning/analytics-fallback-link.js ]; then
            node --check assets/learning/analytics-fallback-link.js
          fi

      - name: Proteger alineación curricular del laboratorio
        run: |
          set -euo pipefail
          LOADER='revision/assets/learning/lab-runtime-v4.js'
          CURRICULUM='revision/assets/learning/lab-curriculum-v1.js'
          SW='revision/service-worker.js'
          grep -q 'lab-curriculum-v1.js' "$LOADER" || { echo '::error::El runtime debe aplicar la alineación curricular antes de renderizar.'; exit 1; }
          grep -q 'lab-curriculum-v1.js' "$SW" || { echo '::error::La PWA debe publicar la alineación curricular.'; exit 1; }
          grep -q 'BETWEEN, IN y LIKE aparecen únicamente como anticipo de S3' "$CURRICULUM" || { echo '::error::Debe quedar documentada la frontera S2→S3.'; exit 1; }

      - name: Proteger rendimiento móvil del laboratorio SQL
        run: |
          set -euo pipefail
          LOADER='revision/assets/learning/lab-runtime-v4.js'
          RUNTIME='revision/assets/learning/lab-runtime-v7.js'
          ENGINE='revision/assets/learning/lab-sql-engine-v1.js'
          WORKER='revision/assets/learning/lab-sql-worker-v1.js'
          SCAFFOLD='revision/assets/learning/lab-sql-scaffold-v2.js'

          grep -q 'lab-runtime-v7.js' "$LOADER" || { echo '::error::El loader debe activar runtime v7.'; exit 1; }
          if grep -q 'lab-runtime-v5.js' "$LOADER"; then
            echo '::error::No se puede reactivar runtime v5 en el laboratorio.'
            exit 1
          fi
          grep -q 'new Worker' "$ENGINE" || { echo '::error::SQL debe ejecutarse mediante Web Worker.'; exit 1; }
          grep -q 'importScripts' "$WORKER" || { echo '::error::El Worker debe cargar SQL.js fuera del hilo principal.'; exit 1; }
          if grep -q 'initSqlJs' "$RUNTIME" || grep -q 'new SQL.Database' "$RUNTIME"; then
            echo '::error::runtime v7 no puede inicializar SQL.js en el hilo de interfaz.'; exit 1
          fi
          if grep -q 'initSqlJs' "$SCAFFOLD" || grep -q 'new SQL.Database' "$SCAFFOLD"; then
            echo '::error::El revisor de sintaxis no puede crear un segundo motor SQL.'; exit 1
          fi
          if grep -q 'warmSQL' "$RUNTIME"; then
            echo '::error::No se permite precalentar SQL mientras el estudiante puede estar escribiendo.'; exit 1
          fi
          grep -q 'interactive-widget=resizes-content' revision/lab.html || { echo '::error::Falta manejo explícito del teclado móvil.'; exit 1; }

      - name: Proteger cursor y contraste del laboratorio
        run: |
          set -euo pipefail
          LOADER='revision/assets/learning/lab-runtime-v4.js'
          LAB_THEME='revision/assets/learning/lab-theme-v1.js'
          SW='revision/service-worker.js'
          grep -q 'lab-theme-v1.js' "$LOADER" || { echo '::error::El laboratorio debe cargar su capa de contraste al final del runtime.'; exit 1; }
          grep -q 'caret-color:var(--lab-focus)!important' "$LAB_THEME" || { echo '::error::El editor SQL necesita un cursor explícito y visible.'; exit 1; }
          grep -q 'background:var(--lab-code-bg)!important' "$LAB_THEME" || { echo '::error::El editor SQL no puede heredar el fondo genérico de textarea.'; exit 1; }
          grep -q -- '--lab-text-soft:#d8e0ea' "$LAB_THEME" || { echo '::error::El tema oscuro debe conservar texto secundario legible.'; exit 1; }
          grep -q 'border-left:1px solid var(--lab-line)!important' "$LAB_THEME" || { echo '::error::Las tarjetas del laboratorio no deben volver a usar una franja lateral de color.'; exit 1; }
          grep -q 'lab-theme-v1.js' "$SW" || { echo '::error::La PWA debe precachear la capa de contraste del laboratorio.'; exit 1; }

      - name: Comprobar que la portada se puede regenerar
        run: |
          python tools/construir-index.py
          python tools/integrar-experiencia.py

      - name: Detectar archivos generados desincronizados
        run: |
          if ! git diff --quiet -- index.html Presentaciones; then
            echo '::error::Hay archivos generados desincronizados. El workflow Sincronizar sitio debe regenerarlos.'
            git diff -- index.html Presentaciones
            exit 1
          fi
