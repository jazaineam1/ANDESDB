name: Preparar motores WebAssembly locales

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-wasm.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Descargar paquetes fijados sin ejecutar scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vendor-tmp
          mkdir -p .vendor-tmp assets/vendor/sqljs assets/vendor/duckdb
          cd .vendor-tmp

          # npm pack valida el tarball contra la integridad publicada por el
          # registry. --ignore-scripts evita ejecutar código del paquete.
          npm pack --ignore-scripts --silent sql.js@1.14.1 > sqljs.tgz.name
          npm pack --ignore-scripts --silent @duckdb/duckdb-wasm@1.32.0 > duckdb.tgz.name

          SQL_TGZ="$(tail -n1 sqljs.tgz.name)"
          DUCK_TGZ="$(tail -n1 duckdb.tgz.name)"
          test -s "$SQL_TGZ"
          test -s "$DUCK_TGZ"

          mkdir sql duck
          tar -xzf "$SQL_TGZ" -C sql
          tar -xzf "$DUCK_TGZ" -C duck

          cp sql/package/dist/sql-wasm.js ../assets/vendor/sqljs/sql-wasm.js
          cp sql/package/dist/sql-wasm.wasm ../assets/vendor/sqljs/sql-wasm.wasm
          cp duck/package/dist/duckdb-browser.mjs ../assets/vendor/duckdb/duckdb-browser.mjs
          cp duck/package/dist/duckdb-browser-mvp.worker.js ../assets/vendor/duckdb/duckdb-browser-mvp.worker.js
          cp duck/package/dist/duckdb-mvp.wasm ../assets/vendor/duckdb/duckdb-mvp.wasm
          cp duck/package/dist/duckdb-browser-eh.worker.js ../assets/vendor/duckdb/duckdb-browser-eh.worker.js
          cp duck/package/dist/duckdb-eh.wasm ../assets/vendor/duckdb/duckdb-eh.wasm

          cd ..
          rm -rf .vendor-tmp

      - name: Registrar versiones e integridad del árbol vendorizado
        shell: bash
        run: |
          set -euo pipefail
          cat > assets/vendor/VERSIONS.md <<'EOF'
          # Motores WebAssembly usados por ANDESDB

          - sql.js: 1.14.1
          - @duckdb/duckdb-wasm: 1.32.0

          Origen de reproducción: npm registry mediante `npm pack --ignore-scripts`
          con versiones exactas. El cliente final sirve estos archivos desde el
          mismo hosting del curso y no depende de un CDN en tiempo de ejecución.
          EOF

          (
            cd assets/vendor
            find sqljs duckdb -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Cambiar S6 a sql.js local
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Presentaciones/M3/sql-lab-s6.js')
          t=p.read_text(encoding='utf-8')
          old="  const SQLJS_VERSION = '1.14.1';\n  const SQLJS_BASE = `https://cdn.jsdelivr.net/npm/sql.js@${SQLJS_VERSION}/dist/`;"
          new="  const SQLJS_VERSION = '1.14.1';\n  const SQLJS_BASE = new URL('../../assets/vendor/sqljs/', location.href).href;"
          if old in t:
              t=t.replace(old,new)
          t=t.replace('No se pudo cargar sql.js desde el CDN.', 'No se pudo cargar el motor SQL local.')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Publicar motores y checksums si cambiaron
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets/vendor Presentaciones/M3/sql-lab-s6.js)" ]; then
            echo 'Sin cambios'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor Presentaciones/M3/sql-lab-s6.js
          git commit -m 'Reproducir motores WebAssembly con integridad registrada'
          git pull --rebase origin main
          git push origin main
