utton><a href="../../Scripts/S9.sql" target="_blank" rel="noopener">SQL</a><a href="../../index.html">Índice</a></nav><div class="progress"><div id="bar"></div></div><script>const slides=[
['dark','Portada','Sesión 9 · Supabase paso a paso + DDL PostgreSQL','Entrar a Supabase, ejecutar SQL por bloques y convertir un modelo sencillo en tablas reales.',''],
['','Qué debe salir hoy','Tres resultados visibles','Llegar al SQL Editor, entender PK/FK sin confundirlas con API keys y crear tablas con DDL PostgreSQL.',''],
['','Trabajo en salas Zoom','Grupos de 5, no 5 computadores peleando','Una persona opera, otra lee, otra verifica, otra toma nota y otra pregunta. Todos entienden; no todos hacen clic.',''],
['','Roles del grupo','Cada estudiante tiene tarea','Operador, lector, auditor, relator y observador. La clase funciona si el grupo conversa mientras ejecuta.',''],
['','Mapa de Supabase','Primero ubicarse, luego escribir SQL','Dashboard → proyecto → SQL Editor para ejecutar código → Table Editor para ver tablas.','<div class="diagram four"><section>Dashboard</section><section>Proyecto</section><section>SQL Editor</section><section>Table Editor</section></div>'],
['','Crear o abrir proyecto','Ruta segura','Entrar a supabase.com/dashboard. Abrir proyecto existente o crear uno llamado andesdb-s9-equipoXX.',''],
['','Formulario del proyecto','Qué significa cada campo','Project name es el nombre. Database password es contraseña, no es PK. Region es ubicación del servidor.',''],
['','Entrar al SQL Editor','Dónde se pega el código','Menú izquierdo → SQL Editor → New query. Ahí pegamos los bloques del archivo S9.sql.',''],
['','Archivo de la clase','Script clicable','Abrir Scripts/S9.sql desde la portada o desde el índice. No ejecutar todo de una.','<a class="biglink" href="../../Scripts/S9.sql" target="_blank" rel="noopener">Abrir Scripts/S9.sql ↗</a>'],
['','Cómo ejecutar','Regla de oro','Selecciona un bloque pequeño, ejecútalo, mira el resultado y solo después avanza. Si sale error, primero se lee.',''],
['','Table Editor','Dónde ver lo creado','Después de CREATE TABLE o INSERT, abre Table Editor para mirar tablas, columnas y filas.',''],
['','Dos tipos de claves','No confundir nombres','PK/FK son claves del modelo de datos. API keys conectan aplicaciones. Hoy usamos PK/FK.',''],
['','Cómo nombrar claves','Convención simple','La PK se llama tabla_id: plato_id, pedido_id, mesa_id. La FK conserva el mismo nombre que la PK a la que apunta.',''],
['','Plan B docente','Si un grupo no logra entrar','El profesor abre andesdb-s9-demo-profesor y comparte pantalla. El grupo sigue pensando aunque no opere.','<div class="box good">Proyecto docente: <code>andesdb-s9-demo-profesor</code><br>Uso: respaldo de pantalla, no secretos.</div>'],
['','Idea central','Normalizar es preguntar: ¿dónde vive este dato?','No memorizamos definiciones. Miramos una tabla incómoda y movemos el dato al lugar correcto.',''],
['dense','1FN · problema visible','Una celda tiene una lista escondida','Dentro de una sola celda hay varios platos y cantidades.','<div class="box bad"><b>Tabla mala</b><table><tr><th>pedido_id</th><th>platos</th></tr><tr><td>1</td><td>Ajiaco x2; Limonada x4</td></tr><tr><td>2</td><td>Bandeja x1</td></tr><tr><td>3</td><td>Ajiaco x1; Bandeja x2</td></tr></table></div>'],
['dense','1FN · consulta que sufre','La pregunta parece fácil, pero no lo es','¿Cuántos ajiacos vendimos? Si el plato está mezclado en texto, la consulta se vuelve frágil.','<pre>SELECT *\nFROM lab_1fn_pedido_mal\nWHERE platos = \'Ajiaco\';</pre><div class="box warn">Resultado esperado: 0 filas o búsqueda frágil.</div>'],
['dense','1FN · arreglo visual','Una fila por plato vendido','Pedido 1 aparece en dos filas: Ajiaco 2 y Limonada 4.','<div class="box good"><b>Tabla buena</b><table><tr><th>pedido_id</th><th>plato</th><th>cantidad</th></tr><tr><td>1</td><td>Ajiaco</td><td>2</td></tr><tr><td>1</td><td>Limonada</td><td>4</td></tr><tr><td>2</td><td>Bandeja</td><td>1</td></tr><tr><td>3</td><td>Ajiaco</td><td>1</td></tr></table></div>'],
['','1FN · regla suave','Primera forma normal','Una celda debe guardar un solo dato, no una lista. Una fila, un hecho claro.',''],
['dense','2FN · problema visible','Datos del pedido y del plato mezclados','La fecha pertenece al pedido; el nombre pertenece al plato; cantidad pertenece a la combinación.','<div class="box bad"><table><tr><th>pedido_id</th><th>plato_id</th><th>fecha</th><th>nombre</th><th>cantidad</th></tr><tr><td>1</td><td>10</td><td>2026-09-04</td><td>Ajiaco</td><td>2</td></tr><tr><td>1</td><td>20</td><td>2026-09-04</td><td>Limonada</td><td>4</td></tr><tr><td>2</td><td>10</td><td>2026-09-05</td><td>Ajiaco</td><td>1</td></tr></table></div>'],
['dense','2FN · contradicción','El mismo plato puede quedar con dos nombres','Si actualizo Ajiaco solo en una fila, plato_id=10 queda con dos nombres.','<pre>SELECT plato_id, COUNT(DISTINCT nombre_plato)\nFROM lab_2fn_linea_mal\nGROUP BY plato_id\nHAVING COUNT(DISTINCT nombre_plato) > 1;</pre>'],
['dense','2FN · arreglo visual','Separar lo que pertenece a cada cosa','PEDIDO guarda fecha. PLATO guarda nombre. LINEA_PEDIDO guarda cantidad.','<div class="diagram three"><section>PEDIDO<br>pedido_id<br>fecha</section><section>PLATO<br>plato_id<br>nombre</section><section>LINEA_PEDIDO<br>pedido_id<br>plato_id<br>cantidad</section></div>'],
['','2FN · regla suave','Segunda forma normal','Si una fila se identifica con dos columnas, los datos deben depender de la combinación completa.',''],
['dense','3FN · problema visible','Un dato vive demasiado lejos','puestos no describe el pedido; describe la mesa.','<div class="box bad"><table><tr><th>pedido_id</th><th>mesa_id</th><th>puestos</th></tr><tr><td>1</td><td>1</td><td>4</td></tr><tr><td>2</td><td>2</td><td>2</td></tr><tr><td>3</td><td>1</td><td>4</td></tr></table></div>'],
['dense','3FN · arreglo visual','Mover puestos a MESA','MESA guarda puestos. PEDIDO guarda mesa_id. La capacidad se actualiza una sola vez.','<div class="diagram two"><section>MESA<br>mesa_id<br>puestos</section><section>PEDIDO<br>pedido_id<br>mesa_id</section></div>'],
['','3FN · regla suave','Tercera forma normal','No guardes un dato en una tabla si realmente depende de otro dato que ya está allí.',''],
['dark','Pausa','15 minutos','Volvemos para convertir el modelo bueno en DDL real.',''],
['dense','Puente a DDL','Ya sabemos qué tablas necesitamos','Ahora usamos SQL para construir estructura: CREATE TABLE, PRIMARY KEY, FOREIGN KEY, NOT NULL, CHECK y DEFAULT.','<div class="cards"><article>CREATE TABLE<br><small>crear estructura</small></article><article>PRIMARY KEY<br><small>identificar fila</small></article><article>FOREIGN KEY<br><small>conectar tablas</small></article></div>'],
['dense','Crear PLATO','Primera tabla real','plato_id identifica cada plato. nombre no puede ser nulo. precio debe ser mayor que cero.','<pre>CREATE TABLE plato (\n  plato_id BIGINT GENERATED ALWAYS AS IDENTITY,\n  nombre TEXT NOT NULL,\n  precio NUMERIC(10,2) NOT NULL CHECK (precio > 0),\n  PRIMARY KEY (plato_id)\n);</pre>'],
['dense','Crear MESA y PEDIDO','Dos tablas conectables','MESA guarda puestos. PEDIDO guarda estado y la mesa asignada.','<pre>CREATE TABLE mesa (\n  mesa_id BIGINT GENERATED ALWAYS AS IDENTITY,\n  puestos INTEGER NOT NULL CHECK (puestos > 0),\n  PRIMARY KEY (mesa_id)\n);\n\nCREATE TABLE pedido (\n  pedido_id BIGINT GENERATED ALWAYS AS IDENTITY,\n  mesa_id BIGINT REFERENCES mesa(mesa_id),\n  estado TEXT NOT NULL DEFAULT \'abierto\',\n  PRIMARY KEY (pedido_id)\n);</pre>'],
['dense','Crear LINEA_PEDIDO','La tabla que conecta pedido con plato','Aquí aparecen dos FK: pedido_id apunta a PEDIDO y plato_id apunta a PLATO.','<pre>CREATE TABLE linea_pedido (\n  pedido_id BIGINT REFERENCES pedido(pedido_id),\n  plato_id BIGINT REFERENCES plato(plato_id),\n  cantidad INTEGER NOT NULL CHECK (cantidad > 0),\n  PRIMARY KEY (pedido_id, plato_id)\n);</pre>'],
['dense','Probar errores','El motor también enseña','cantidad nula prueba NOT NULL; plato inexistente prueba FK; cantidad cero prueba CHECK.','<div class="cards"><article>cantidad = NULL<br><small>NOT NULL</small></article><article>plato_id inexistente<br><small>FK</small></article><article>cantidad = 0<br><small>CHECK</small></article></div>'],
['dense','Reconstruir con JOIN','Separar no significa perder información','Unimos pedido, línea y plato para volver a ver el pedido completo.','<pre>SELECT pe.pedido_id, pl.nombre, l.cantidad\nFROM pedido pe\nJOIN linea_pedido l ON l.pedido_id = pe.pedido_id\nJOIN plato pl ON pl.plato_id = l.plato_id;</pre>'],
['','Cierre','La pregunta que se llevan','Antes de crear una columna pregunta: ¿este dato de qué depende y dónde debería vivir?',''],
['dark','Ticket de salida','Explica en una frase','1FN: no listas en celdas. 2FN: no mezclar datos de partes de una clave compuesta. 3FN: no guardar datos en el lugar equivocado.','']
];const deck=document.getElementById('deck');deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s[0]}" data-title="${s[1]}"><div class="ey">Sesión 9 · diapositiva ${i+1}</div><h2>${s[1]}</h2><p class="lead">${s[2]}</p><p>${s[3]}</p>${s[4]}<div class="brand"><span>ANDESDB · Sesión 9</span><span>${i+1}/${slides.length}</span></div></section>`).join('');const ss=[...document.querySelectorAll('.slide')],count=document.getElementById('count'),bar=document.getElementById('bar');let i=0,t0=null,tInt=null;function show(n){i=(n+ss.length)%ss.length;ss.forEach((s,j)=>s.classList.toggle('active',j===i));count.textContent=(i+1)+'/'+ss.length;bar.style.width=((i+1)/ss.length*100)+'%'}function tick(){if(t0===null)return;const sec=Math.floor((Date.now()-t0)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');document.getElementById('timeBtn').textContent='⏱ '+m+':'+s}document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.getElementById('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();document.getElementById('timeBtn').onclick=()=>{if(t0===null){t0=Date.now();tInt=setInterval(tick,500)}else{clearInterval(tInt);tInt=null;t0=null;document.getElementById('timeBtn').textContent='⏱ 00:00'}};addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(i+1);if(['ArrowLeft','PageUp'].includes(e.key))show(i-1);if(e.key.toLowerCase()==='t')document.getElementById('timeBtn').click();if(e.key.toLowerCase()==='f')document.getElementById('fullBtn').click()});show(0);</script></body></html>
