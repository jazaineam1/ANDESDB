<style>
:root{

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --tinta:#eaf1f7; --tenue:#9fb0bf; --linea:#2b3945;
    --papel:#0d151c; --carta:#141f29; --az-sua:#16303f; --y-sua:#3a3410; --codigo:#ffe97a;

  }
}
:root[data-theme="dark"]{
  --tinta:#eaf1f7; --tenue:#9fb0bf; --linea:#2b3945;
  --papel:#0d151c; --carta:#141f29; --az-sua:#16303f; --y-sua:#3a3410; --codigo:#ffe97a;
  --sombra:0 10px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);
  font:16px/1.55 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow:hidden}

/* la fila y la columna se fijan a minmax(0,1fr): dejadas en auto crecian con
   la lamina y el max-height:100% de la imagen no ataba a nada, asi que el pie
   de cada diapositiva del PowerPoint se salia por abajo */
.mazo{position:fixed;inset:0;display:grid;place-items:center;padding:2.2vmin;
  grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.lam{display:none;width:100%;height:100%;min-width:0;min-height:0}
.lam.viva{display:grid;place-items:center}
/* el limite se mide contra el viewport y no en porcentaje: el porcentaje
   colgaba de una cadena de alturas que no llegaba a ser definida, y la lamina
   salia a lo ancho y se cortaba por abajo */
.lam img{max-width:calc(100vw - 4.4vmin);max-height:calc(100vh - 4.4vmin);
  width:auto;height:auto;object-fit:contain;
  border-radius:var(--r);box-shadow:var(--sombra);background:#fff}

/* --- las de Supabase, que si son HTML --- */
/* la tarjeta se ajusta a lo que lleva dentro, no al alto de la pantalla:
   estirarla dejaba un hueco muerto entre el contenido y el pie */
.lam.propia.viva{display:grid;grid-template-rows:auto auto auto;align-content:start;
  width:min(1600px,100%);height:auto;max-height:100%;background:var(--carta);
  border-radius:var(--r);box-shadow:var(--sombra);padding:3.2vmin 4vmin;overflow:auto}
.cinta{display:flex;align-items:center;gap:.6em;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;font-size:.72rem;color:var(--az)}
.cinta::before{content:"";width:2.1em;height:.42em;background:var(--y);border-radius:2px}
.lam.propia h2{margin:.28em 0 .5em;font-size:clamp(1.5rem,3.1vmin,2.5rem);line-height:1.12;
  letter-spacing:-.015em;text-wrap:balance}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.4vmin;align-items:start}
.pila{display:flex;flex-direction:column;gap:1.4vmin;min-width:0}
.toma{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--linea);
  box-shadow:0 3px 14px rgba(16,32,48,.13)}
.lam.propia ol,.lam.propia ul{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:.5em}
.lam.propia li{font-size:clamp(.9rem,1.75vmin,1.08rem)}
.caja{border:1px solid var(--linea);border-left:5px solid var(--az);background:var(--az-sua);
  border-radius:10px;padding:.85em 1.05em;font-size:clamp(.85rem,1.7vmin,1.03rem)}
.caja.ojo{border-left-color:#c47f00;background:var(--y-sua)}
.caja h3{margin:0 0 .3em;font-size:1em;letter-spacing:.02em}
/* el color del codigo es un token, no un literal: escrito a pelo se volvia
   marron sobre marron en cuanto el tema pasaba a oscuro */
code{font-family:Consolas,"Cascadia Mono",monospace;background:var(--y-sua);
  padding:.08em .34em;border-radius:5px;font-size:.94em;color:var(--codigo)}
.pie{display:flex;justify-content:space-between;gap:1em;margin-top:1.2vmin;
  padding-top:.7vmin;border-top:1px solid var(--linea);
  font-size:.74rem;color:var(--tenue);letter-spacing:.05em;text-transform:uppercase}

/* --- barra --- */
.barra{position:fixed;top:1.1vmin;right:1.4vmin;z-index:40;display:flex;gap:.4em;align-items:center}
.barra button,.barra a{border:1px solid var(--linea);background:var(--carta);color:var(--tinta);
  width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  font:800 .95rem/1 inherit;text-decoration:none;box-shadow:0 2px 8px rgba(16,32,48,.12)}
.barra button:hover,.barra a:hover{background:var(--az);color:#fff;border-color:var(--az)}
.barra button:focus-visible,.barra a:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.count{font-variant-numeric:tabular-nums;font-weight:800;font-size:.82rem;background:var(--tinta);
  color:var(--papel);padding:.42em .72em;border-radius:999px}
.bar{position:fixed;left:0;bottom:0;height:4px;background:var(--y);z-index:41;
  transition:width .18s ease}
.clockBox{position:fixed;left:1.4vmin;top:1.1vmin;z-index:40;background:var(--tinta);color:var(--papel);
  padding:.4em .8em;border-radius:999px;font:800 .95rem/1 Consolas,monospace;
  font-variant-numeric:tabular-nums;display:none}
.clockBox.viva{display:block}
.nowTitle{position:fixed;left:1.4vmin;bottom:1.2vmin;z-index:40;font-size:.72rem;
  color:var(--tenue);letter-spacing:.05em;text-transform:uppercase;max-width:52vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.barra,.avance,.reloj,.nowTitle{display:none}}

<script>
(function(){
  var L = Array.prototype.slice.call(document.querySelectorAll('.lam'));
  var i = 0, t0 = null, tick = null;
  var cuenta = document.getElementById('count');
  var avance = document.getElementById('bar');
  var rotulo = document.getElementById('nowTitle');
  var reloj  = document.getElementById('clockBox');

  function ir(n){
    i = Math.max(0, Math.min(L.length - 1, n));
    L.forEach(function(s, k){ s.classList.toggle('viva', k === i); });
    cuenta.textContent = (i + 1) + ' / ' + L.length;
    avance.style.width = ((i + 1) / L.length * 100) + '%';
    rotulo.textContent = L[i].dataset.title || '';
    try { localStorage.setItem('s9pptx', i); } catch (e) {}
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }
  function pinta(){
    var s = Math.floor((Date.now() - t0) / 1000);
    reloj.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2);
  }
  function crono(){
    if (tick) { clearInterval(tick); tick = null; reloj.classList.remove('viva'); return; }
    t0 = Date.now(); reloj.classList.add('viva'); pinta(); tick = setInterval(pinta, 1000);
  }
  document.getElementById('prev').onclick = function(){ ir(i - 1); };
  document.getElementById('next').onclick = function(){ ir(i + 1); };
  document.getElementById('timeBtn').onclick = crono;
  document.getElementById('fullBtn').onclick = function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  };
  document.addEventListener('keydown', function(e){
    if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); ir(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); ir(i - 1); }
    else if (k === 'Home') ir(0);
    else if (k === 'End') ir(L.length - 1);
    else if (k === 't' || k === 'T') crono();
    else if (k === 'f' || k === 'F') document.getElementById('fullBtn').click();
  });
  var d = 0;
  document.addEventListener('touchstart', function(e){ d = e.changedTouches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    var x = e.changedTouches[0].clientX - d;
    if (Math.abs(x) > 55) ir(i + (x < 0 ? 1 : -1));
  }, {passive:true});

  var n = parseInt((location.hash || '').slice(1), 10);
  if (!n) { try { n = parseInt(localStorage.getItem('s9pptx'), 10) + 1; } catch (e) {} }
  ir((n || 1) - 1);
