name: Ajustar etiqueta de avance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajustar-etiqueta-avance.yml'

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evitar lenguaje de progreso personal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/construir-index.py')
          t = p.read_text(encoding='utf-8')
          old = '<b>Tu avance</b>'
          new = '<b>Avance del curso</b>'
          if old not in t and new not in t:
              raise SystemExit('No se encontró la etiqueta esperada')
          p.write_text(t.replace(old, new), encoding='utf-8')
          PY
      - name: Publicar ajuste
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/construir-index.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Renombrar avance como estado del curso'
          git pull --rebase origin main
          git push origin main
