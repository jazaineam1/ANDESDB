name: Parchear enlace S9 SQL

on:
  push:
    paths:
      - '.github/workflows/parchear-s9-link.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  parchear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Convertir Scripts/S9.sql en hipervínculo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Presentaciones/M3/sesion-9-ddl-supabase.html')
          t = p.read_text(encoding='utf-8')
          old = 'Abre <code>Scripts/S9.sql</code>. Ejecuta <strong>CHECKPOINT 0</strong> y luego <strong>LABORATORIO DE NORMALIZACIÓN · PREPARACIÓN</strong>.'
          new = 'Abre <a href="../../Scripts/S9.sql" target="_blank" rel="noopener"><code>Scripts/S9.sql</code> ↗</a>. Ejecuta <strong>CHECKPOINT 0</strong> y luego <strong>LABORATORIO DE NORMALIZACIÓN · PREPARACIÓN</strong>.'
          if old not in t and new not in t:
              raise SystemExit('No encontré el texto esperado para parchear')
          t = t.replace(old, new)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar y publicar
        run: |
          set -euo pipefail
          python tools/validar_curso.py
          if git diff --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Presentaciones/M3/sesion-9-ddl-supabase.html
          git commit -m 'Agregar enlace al script SQL en S9'
          git pull --rebase origin main
          git push origin main
