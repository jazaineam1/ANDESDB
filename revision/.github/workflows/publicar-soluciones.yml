name: Publicar soluciones programadas

on:
  schedule:
    # Cada hora, y se publica cuando la hora de Bogotá YA pasó la del plan.
    #
    # Antes se disparaba una vez (00:45 UTC) y el trabajo esperaba dentro hasta
    # la hora del plan. No puede funcionar: GitHub arrastra los cron varias
    # horas —las corridas reales entran entre las 05:00 y las 07:30 UTC— y con
    # ese arrastre la espera supera el límite de 6 horas de un job. El 1 de
    # septiembre el trabajo murió a las 6 h 0 m 20 s y la solución de la S7
    # nunca se publicó.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      session:
        description: 'Número de sesión a publicar manualmente (ej. 7)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: andesdb-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
      SOLUTIONS_PASSPHRASE: ${{ secrets.SOLUTIONS_PASSPHRASE }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Determinar sesión que corresponde publicar
        id: target
        shell: bash
        run: |
          set -euo pipefail
          manual='${{ inputs.session }}'
          if [ -n "$manual" ]; then
            echo "session=$manual" >> "$GITHUB_OUTPUT"
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # La hora se lee del plan, no se fija aquí. Antes se comparaba contra
          # "20:00" literal, así que cualquier sesión programada a otra hora
          # (la S7 va a las 20:15, después de su debrief) no se publicaba nunca.
          leido=$(python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          plan=json.load(open('assets/learning/learning-plan.json', encoding='utf-8'))
          ahora=datetime.now(ZoneInfo('America/Bogota'))
          hoy=ahora.strftime('%Y-%m-%d')
          ahora_hm=ahora.strftime('%H:%M')
          # La hora sale del plan, no de una constante: cada sesión corta puede
          # publicar después de su propio debrief. Y se publica cuando esa hora
          # YA pasó — nunca se espera dentro del trabajo, que es lo que mató la
          # publicación de la S7.
          for n,s in sorted(plan['sesiones'].items(), key=lambda x: int(x[0])):
              sol=s.get('solucion', {})
              hora=str(sol.get('publicar',''))
              if s.get('fecha')!=hoy or sol.get('modo')!='programada' or not hora:
                  continue
              if os.path.exists('Scripts/S%s-solucion.sql' % n):
                  continue                      # ya publicada: no hay nada que hacer
              if ahora_hm >= hora:
                  print(n, hora)
                  break
          PY
          )
          echo "session=$(echo "$leido" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "at=$(echo "$leido" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "manual=false" >> "$GITHUB_OUTPUT"

      - name: No hay publicación para hoy
        if: steps.target.outputs.session == ''
        run: echo 'Hoy no hay ninguna solución programada.'

      - name: Verificar secreto y archivo cifrado
        if: steps.target.outputs.session != ''
        shell: bash
        run: |
          set -euo pipefail
          n='${{ steps.target.outputs.session }}'
          if [ -z "${SOLUTIONS_PASSPHRASE:-}" ]; then
            echo '::error::Falta configurar el secret SOLUTIONS_PASSPHRASE en Settings > Secrets and variables > Actions.'
            exit 1
          fi
          if [ ! -f "soluciones_cifradas/S${n}.sql.enc" ]; then
            echo "::error::No existe soluciones_cifradas/S${n}.sql.enc"
            exit 1
          fi

      - name: Esperar hasta la hora programada
        if: steps.target.outputs.session != '' && steps.target.outputs.manual != 'true'
        shell: bash
        env:
          AT: ${{ steps.target.outputs.at }}
        run: |
          set -euo pipefail
          seconds=$(python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          # La hora sale del plan de aprendizaje, no de una constante: cada
          # sesión corta puede publicar después de su propio debrief.
          h, m = (os.environ.get('AT') or '20:00').split(':')
          tz=ZoneInfo('America/Bogota')
          now=datetime.now(tz)
          target=now.replace(hour=int(h), minute=int(m), second=0, microsecond=0)
          # Red de seguridad: como el paso anterior ya exige que la hora haya
          # pasado, aquí no debería quedar nada que esperar. Si por un salto de
          # reloj quedara, se acota a 20 minutos: un job no puede pasar de 6 h.
          print(min(1200, max(0, int((target-now).total_seconds()))))
          PY
          )
          echo "Esperando ${seconds}s para publicar a las ${AT} de Bogotá."
          sleep "$seconds"

      - name: Descifrar y publicar solución
        if: steps.target.outputs.session != ''
        shell: bash
        run: |
          set -euo pipefail
          n='${{ steps.target.outputs.session }}'
          mkdir -p Scripts
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "soluciones_cifradas/S${n}.sql.enc" \
            -out "Scripts/S${n}-solucion.sql" \
            -pass env:SOLUTIONS_PASSPHRASE

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Scripts/S${n}-solucion.sql"
          if git diff --cached --quiet; then
            echo "La solución S${n} ya estaba publicada."
            exit 0
          fi
          git commit -m "Publicar solución S${n}"
          git pull --rebase origin main
          git push origin main
