<script>(async()=>{const name=decodeURIComponent(location.pathname.split('/').pop());const source=new URL('__original__/'+encodeURIComponent(name),location.href);const r=await fetch(source,{cache:'no-cache'});if(!r.ok)throw new Error('No se pudo cargar la presentación base ('+r.status+')');let html=await r.text();const tracker='<script src="../../assets/learning/learning-tracker.js?v=20260912-lms"><\/script>';const patch=`<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('a[download]').forEach(a=>{try{const u=new URL(a.getAttribute('href'),location.href);if(decodeURIComponent(u.pathname.split('/').pop())===decodeURIComponent(location.pathname.split('/').pop()))a.href='__original__/'+encodeURIComponent(location.pathname.split('/').pop());}catch{}});});<\/script>`;const pos=html.toLowerCase().lastIndexOf('</body>');html=pos>=0?html.slice(0,pos)+tracker+'\n'+patch+'\n'+html.slice(pos):html+tracker+patch;document.open();document.write(html);document.close();})().catch(err=>{document.body.innerHTML='<div class="boot"><h1>No se pudo abrir la sesión</h1><p>'+String(err.message||err)+'</p><p>Recarga la página.</p></div>';});</script></body></html>
