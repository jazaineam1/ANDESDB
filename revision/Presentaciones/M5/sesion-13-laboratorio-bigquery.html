<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ANDESDB · cargando presentación</title>
  <style>
    html,body{margin:0;height:100%;background:#0b1218;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center}
    .boot{max-width:560px;padding:28px;text-align:center}
    .spin{width:28px;height:28px;border:3px solid #ffffff33;border-top-color:#ffd600;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot">
    <div class="spin"></div>
    <b>Cargando presentación interactiva…</b>
    <p>Sincronizando la versión actual de la Sesión 13 con el LMS de revisión.</p>
  </div>

<!-- ANDESDB_VALIDATION_BRIDGE

<script>
(async()=>{
  const name = decodeURIComponent(location.pathname.split('/').pop());

  // La revisión usa la S13 vigente de main como fuente única de verdad.
  // Desde revision/Presentaciones/M5 subimos a la raíz del sitio y cargamos Presentaciones/M5.
  const source = new URL('../../../Presentaciones/M5/' + encodeURIComponent(name) + '?revision_sync=20260915c', location.href);
  const response = await fetch(source, { cache: 'no-store' });
  if (!response.ok) throw new Error('No se pudo cargar la presentación principal (' + response.status + ')');
  let html = await response.text();

  // Al document.write() la URL visible sigue siendo /revision/..., por eso fijamos la base
  // en la carpeta de la presentación principal para que tema, assets, timer y descargas
  // resuelvan exactamente igual que en main.
  const mainBase = new URL('../../../Presentaciones/M5/', location.href).href;
  html = html.replace(/<head([^>]*)>/i, `<head$1><base href="${mainBase}">`);

  // Herramientas exclusivas del LMS de revisión: usamos URLs absolutas calculadas desde
  // la página wrapper para que el <base> anterior no las redirija a main.
  const toolkitUrl = new URL('../../assets/learning/interactive-tools.js?v=20260915-s13sync', location.href).href;
  const navUrl = new URL('../../assets/learning/interactive-nav.js?v=20260915-s13sync', location.href).href;
  const kit = `<script src="${toolkitUrl}"><\/script>`;
  const nav = `<script src="${navUrl}"><\/script>`;

  // No reordenamos slides ni movemos Preflight/Ruta de acceso al apéndice: respetamos
  // el hilo pedagógico actual de main (acceso → partición → evidencia → pausa → clustering).
  const pos = html.toLowerCase().lastIndexOf('</body>');
  html = pos >= 0
    ? html.slice(0, pos) + kit + '\n' + nav + '\n' + html.slice(pos)
    : html + kit + nav;

  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML = '<div class="boot"><h1>No se pudo abrir la presentación</h1><p>' + String(err.message || err) + '</p><p>Recarga la página.</p></div>';
});
</script>
</body>
</html>
