<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ANDESDB · Acceso</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#111827;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(560px,100%);background:#fff;border:1px solid #dbe2ea;border-radius:20px;padding:26px;box-shadow:0 18px 50px #0f172a14}.ey{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#8a7300;font-weight:900}.mark{width:54px;height:54px;border-radius:16px;background:#0e1a24;color:#ffd600;display:grid;place-items:center;font-size:1.5rem;margin-bottom:16px}h1{margin:.3rem 0 .5rem;font-size:1.7rem}p{color:#64748b;line-height:1.5}.state{margin-top:16px;padding:12px 14px;border-radius:12px;background:#eef6ff;color:#1e3a5f}.state.ok{background:#dcfce7;color:#14532d}.state.err{background:#fee2e2;color:#7f1d1d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-flex;padding:10px 13px;border:0;border-radius:10px;background:#111827;color:#fff;text-decoration:none;font:800 1rem system-ui;cursor:pointer}.btn.alt{background:#e8edf2;color:#111827}.btn:disabled{opacity:.55;cursor:wait}.small{font-size:.83rem;color:#64748b;margin-top:10px}
</style>
</head>
<body>
<main class="card">
  <div class="mark">🎓</div>
  <div class="ey">ANDESDB · acceso seguro</div>
  <h1 id="title">Comprobando tu acceso…</h1>
  <p id="copy">Si ya tienes una sesión activa, entraremos directamente. Si cambiaste de pantalla, intentaremos recuperarla.</p>
  <div class="state" id="state">Conectando con la plataforma…</div>
  <div class="actions" id="actions" hidden>
    <button class="btn" id="enter" type="button">Entrar a ANDESDB</button>
    <a class="btn alt" id="back" href="portal.html">Volver al portal</a>
  </div>
  <div class="small" id="hint"></div>
</main>
<script>
(()=>{'use strict';
const API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1/learning-auth',STORE='andesdb.lms.auth.v1',COOKIE='andesdb_lms_session',COOKIE_PATH='/ANDESDB/revision/',COOKIE_AGE=34560000,state=document.getElementById('state'),title=document.getElementById('title'),copy=document.getElementById('copy'),actions=document.getElementById('actions'),enter=document.getElementById('enter'),hint=document.getElementById('hint');
const p=new URLSearchParams(location.hash.replace(/^#/,'')),token=p.get('token')||'';
history.replaceState(null,'',location.pathname);
const readCookie=()=>{const x=document.cookie.split('; ').find(v=>v.startsWith(COOKIE+'='));return x?decodeURIComponent(x.slice(COOKIE.length+1)):''};
const setCookie=t=>{if(t)document.cookie=`${COOKIE}=${encodeURIComponent(t)}; Path=${COOKIE_PATH}; Max-Age=${COOKIE_AGE}; Secure; SameSite=Lax`};
const clearCookie=()=>{document.cookie=`${COOKIE}=; Path=${COOKIE_PATH}; Max-Age=0; Secure; SameSite=Lax`};
const parse=s=>{try{return JSON.parse(s||'null')}catch{return null}};
const readAuth=()=>{const a=parse(localStorage.getItem(STORE))||parse(sessionStorage.getItem(STORE));if(a?.token)return a;const t=readCookie();return t?{token:t}:null};
const saveAuth=x=>{const s=JSON.stringify(x);localStorage.setItem(STORE,s);sessionStorage.setItem(STORE,s);setCookie(x.token)};
const clearAuth=()=>{try{localStorage.removeItem(STORE);sessionStorage.removeItem(STORE)}catch{}clearCookie()};
async function call(body,authToken='',ms=12000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),ms);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(authToken?{'Authorization':'Bearer '+authToken}:{})},body:JSON.stringify(body),signal:c.signal});const x=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(x.error||`HTTP ${r.status}`);e.data=x;throw e}return x}finally{clearTimeout(timer)}}
async function existingSession(){const a=readAuth();if(!a?.token)return false;try{const x=await call({action:'me'},a.token,6500);saveAuth({token:a.token,user:x.user,expires_at:x.expires_at,auth_session_id:x.auth_session_id,persistent:x.persistent,course_run:x.course_run});state.className='state ok';state.textContent='Tu sesión está activa. Entrando a tus cursos…';location.replace('portal.html?access=active');return true}catch(e){if(e.name!=='AbortError')clearAuth();return false}}
function errorView(message){title.textContent='No se pudo recuperar el acceso';copy.textContent='Tu matrícula no se pierde. Si fue un problema de conexión, puedes volver a intentar; si el enlace ya no es válido, pide al docente uno nuevo para esta misma cuenta.';state.className='state err';state.textContent=message;actions.hidden=false;enter.hidden=true;hint.textContent='No vuelvas a registrarte: un nuevo enlace reutiliza tu matrícula existente.'}
async function inspect(){if(await existingSession())return;if(!token){errorView('No encontramos un token de acceso en este enlace.');return}try{const x=await call({action:'inspect_access',token},'',10000);title.textContent=x.already_used?`Recuperar sesión${x.display_name?' de '+x.display_name:''}`:`Acceso listo${x.display_name?' para '+x.display_name:''}`;copy.textContent=x.already_used?'Este enlace sigue dentro de su ventana de acceso y puede restaurar tu sesión en este navegador.':'Confirma para iniciar tu sesión en este dispositivo.';state.className='state ok';state.textContent='Matrícula activa · '+((x.courses||[]).join(', ')||'ANDESDB');actions.hidden=false;enter.hidden=false;hint.textContent='El enlace es personal. Si el docente genera uno nuevo, el anterior deja de servir.'}catch(e){errorView(e.name==='AbortError'?'La conexión tardó más de lo esperado. Recarga esta página para volver a intentar.':e.message)}}
enter.onclick=async()=>{enter.disabled=true;enter.textContent='Ingresando…';try{const x=await call({action:'claim_access',token},'',12000);saveAuth({token:x.token,expires_at:x.expires_at,auth_session_id:x.auth_session_id,user:x.user,persistent:x.persistent,course_run:x.course_run});state.className='state ok';state.textContent=x.recovered?'Sesión recuperada. Entrando a tus cursos…':'Acceso confirmado. Entrando a tus cursos…';location.replace('portal.html?access=ok')}catch(e){enter.disabled=false;enter.textContent='Entrar a ANDESDB';errorView(e.name==='AbortError'?'La conexión tardó más de lo esperado. Intenta nuevamente.':e.message)}};
inspect();
})();
</script>
</body>
</html>
