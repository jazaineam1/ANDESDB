<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ANDESDB · Validando acceso</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#111827;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(560px,100%);background:#fff;border:1px solid #dbe2ea;border-radius:20px;padding:26px;box-shadow:0 18px 50px #0f172a14}.ey{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#8a7300;font-weight:900}.mark{width:54px;height:54px;border-radius:16px;background:#0e1a24;color:#ffd600;display:grid;place-items:center;font-size:1.5rem;margin-bottom:16px}h1{margin:.3rem 0 .5rem;font-size:1.7rem}p{color:#64748b;line-height:1.5}.state{margin-top:16px;padding:12px 14px;border-radius:12px;background:#eef6ff;color:#1e3a5f}.state.err{background:#fee2e2;color:#7f1d1d}.btn{display:inline-flex;margin-top:14px;padding:10px 13px;border-radius:10px;background:#111827;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="card">
  <div class="mark">🎓</div>
  <div class="ey">ANDESDB · acceso seguro</div>
  <h1 id="title">Validando tu acceso…</h1>
  <p id="copy">El enlace se verifica una sola vez. No necesitas contraseña.</p>
  <div class="state" id="state">Conectando con la plataforma…</div>
  <a class="btn" id="back" href="portal.html" hidden>Volver al portal</a>
</main>
<script>
(()=>{'use strict';
const API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1/learning-auth',STORE='andesdb.lms.auth.v1',state=document.getElementById('state'),title=document.getElementById('title'),copy=document.getElementById('copy'),back=document.getElementById('back');
const p=new URLSearchParams(location.hash.replace(/^#/,'')),token=p.get('token')||'';
history.replaceState(null,'',location.pathname);
async function run(){
 if(!token){title.textContent='Enlace incompleto';copy.textContent='Solicita al docente un nuevo enlace de acceso.';state.textContent='No encontramos el token de acceso.';state.className='state err';back.hidden=false;return}
 try{
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),8000);
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'claim_access',token}),signal:c.signal});clearTimeout(timer);
  const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);
  localStorage.setItem(STORE,JSON.stringify({token:x.token,expires_at:x.expires_at,auth_session_id:x.auth_session_id,user:x.user}));
  state.textContent='Acceso confirmado. Entrando a tus cursos…';
  location.replace('portal.html?access=ok');
 }catch(e){title.textContent='No se pudo usar este enlace';copy.textContent='Los enlaces son personales y de un solo uso. Si ya lo abriste antes, solicita uno nuevo al docente.';state.textContent=e.name==='AbortError'?'La plataforma tardó demasiado. Intenta nuevamente.':e.message;state.className='state err';back.hidden=false}
}
run();
})();
</script>
</body>
</html>
