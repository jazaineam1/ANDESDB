<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Entrega de evidencia ANDESDB"><title>ANDESDB · Entrega</title><style>:root{--ink:#17202a;--muted:#667085;--line:#e4e7ec;--bg:#f7f8fa;--nav:#101828;--yellow:#ffd600;--blue:#175cd3;--green:#16794b;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.appbar{height:58px;background:var(--nav);color:#fff;display:flex;align-items:center}.inner,.page{width:min(880px,94vw);margin:auto}.inner{display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:900}.mark{width:31px;height:31px;border-radius:9px;background:var(--yellow);color:#3d3300;display:grid;place-items:center}.nav{margin-left:auto;display:flex;gap:4px}.nav a{padding:8px 10px;color:#d0d5dd;text-decoration:none;font-size:.8rem;font-weight:800}.page{padding:22px 0 76px}.crumb{font-size:.76rem;color:var(--muted);margin-bottom:10px}.crumb a{text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 6px 20px #1018280a;margin-bottom:13px}.ey{font-size:.68rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#8a7300}.card h1{margin:.15rem 0 .5rem;font-size:clamp(1.45rem,4vw,2.1rem)}.muted{color:var(--muted);font-size:.8rem;line-height:1.45}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.pill{border-radius:999px;padding:4px 8px;background:#eef2f6;font-size:.67rem;font-weight:900}.pill.good{background:#dcfce7;color:#166534}.form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:.77rem;font-weight:850}.input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px 11px;background:#fff;font:inherit}.input:focus,select:focus,textarea:focus{outline:3px solid #dbe7ff;border-color:#84adff}.btn{border:0;border-radius:9px;padding:9px 12px;background:#101828;color:#fff;text-decoration:none;font-weight:850;cursor:pointer}.btn.primary{background:var(--blue)}.btn.alt{background:#eef2f6;color:#17202a}.msg{display:none;border-radius:9px;padding:9px 10px;font-size:.82rem}.msg.show{display:block}.msg.ok{background:#ecfdf3;color:#067647}.msg.bad{background:#fef3f2;color:var(--red)}.rubric{display:grid;gap:7px}.criterion{border:1px solid #eaecf0;border-radius:9px;padding:9px}.submission{border-top:1px solid #eef0f3;padding:10px 0}.submission:first-of-type{border-top:0}@media(max-width:650px){.nav{display:none}}</style></head><body><header class="appbar"><div class="inner"><a class="brand" href="portal.html"><span class="mark">A</span><span>ANDESDB</span></a><nav class="nav"><a href="portal.html">Inicio</a><a href="learning-hub.html">Curso</a><a href="calendar.html">Agenda</a></nav></div></header><main class="page"><div class="crumb"><a href="portal.html">Inicio</a> › <a href="calendar.html">Agenda</a> › Entrega</div><div id="app"><div class="card">Cargando entrega…</div></div></main><script src="assets/learning/course-data.js?v=20260912-lms2"></script><script src="assets/learning/lms-platform.js?v=20260912-lms2"></script><script src="assets/learning/learning-tracker.js?v=20260912-lms2"></script><script>(()=>{'use strict';const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>{if(!x)return'—';try{return new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Bogota'}).format(new Date(x))}catch{return x}},id=new URLSearchParams(location.search).get('id');let assignment=null;function bytesToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=reject;r.readAsDataURL(file)})}async function render(){if(!id){app.innerHTML='<div class="card"><h1>Entrega no encontrada</h1><a class="btn" href="calendar.html">Volver a agenda</a></div>';return}try{const p=await window.ANDES_PLATFORM.bootstrap(true);assignment=(p.assignments||[]).find(x=>x.id===id);if(!assignment)throw new Error('Esta entrega no está disponible para tu matrícula.');const s=assignment.latest_submission,types=assignment.allowed_types||['text','url','file'],rubric=Array.isArray(assignment.rubric)?assignment.rubric:[];app.innerHTML=`<section class="card"><div class="ey">${assignment.session_number?`Sesión ${assignment.session_number}`:'Evidencia del curso'}</div><h1>${esc(assignment.title)}</h1><div class="meta"><span class="pill">${assignment.required?'requerida':'opcional'}</span><span class="pill">máx. ${assignment.max_score} pts</span>${assignment.due_at?`<span class="pill">vence ${fmt(assignment.due_at)}</span>`:''}${s?`<span class="pill good">${esc(s.status)}</span>`:''}</div><div style="line-height:1.55">${esc(assignment.instructions||'Sigue las indicaciones dadas en clase.').replace(/\n/g,'<br>')}</div></section>${rubric.length?`<section class="card"><h2>Rúbrica</h2><div class="rubric">${rubric.map(r=>`<div class="criterion"><b>${esc(r.title||r.criterion||'Criterio')}</b><div class="muted">${esc(r.description||'')} ${r.points!=null?`· ${r.points} pts`:''}</div></div>`).join('')}</div></section>`:''}<section class="card"><h2>Enviar evidencia</h2><form class="form" id="submission"><div class="field"><label>Tipo</label><select name="type" id="type">${types.map(t=>`<option value="${t}">${t==='text'?'Texto':t==='url'?'Enlace':'Archivo (máx. 2 MB)'}</option>`).join('')}</select></div><div id="artifact"></div><button class="btn primary" type="submit">Enviar nueva versión</button><div class="msg" id="msg"></div></form></section><section class="card"><h2>Última entrega</h2>${s?`<div class="submission"><b>Intento ${s.attempt}</b><div class="muted">${fmt(s.submitted_at)} · ${esc(s.status)}${s.score!=null?` · ${s.score}/${assignment.max_score}`:''}</div>${s.feedback?`<p>${esc(s.feedback)}</p>`:''}${s.artifact_type==='file'?'<button class="btn alt" id="download-latest">Abrir archivo enviado</button>':''}</div>`:'<div class="muted">Todavía no has enviado evidencia.</div>'}</section>`;const type=document.getElementById('type'),artifact=document.getElementById('artifact');function field(){artifact.innerHTML=type.value==='text'?'<div class="field"><label>Tu evidencia</label><textarea name="text" rows="9" required placeholder="Explica o pega aquí tu evidencia…"></textarea></div>':type.value==='url'?'<div class="field"><label>URL</label><input class="input" type="url" name="url" required placeholder="https://…"></div>':'<div class="field"><label>Archivo</label><input class="input" type="file" name="file" required><div class="muted">CSV, JSON, SQL o texto. Máximo 2 MB.</div></div>'}type.onchange=field;field();document.getElementById('submission').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button[type=submit]'),m=document.getElementById('msg');b.disabled=true;b.textContent='Enviando…';m.className='msg';try{let payload={assignment_id:id,artifact_type:type.value};if(type.value==='text')payload.text=f.text.value;else if(type.value==='url')payload.url=f.url.value;else{const file=f.file.files[0];if(!file)throw new Error('Selecciona un archivo.');if(file.size>2097152)throw new Error('El archivo supera 2 MB.');payload.file={name:file.name,type:file.type||'application/octet-stream',base64:await bytesToBase64(file)}}await window.ANDES_PLATFORM.submitAssignment(payload);m.textContent='✓ Evidencia enviada. Puedes enviar otra versión si necesitas corregirla.';m.className='msg show ok';window.ANDES_PLATFORM.invalidate();setTimeout(render,600)}catch(ex){m.textContent=ex.message;m.className='msg show bad'}finally{b.disabled=false;b.textContent='Enviar nueva versión'}};document.getElementById('download-latest')?.addEventListener('click',async()=>{try{const x=await window.ANDES_PLATFORM.submissionUrl(s.id);open(x.url,'_blank','noopener')}catch(e){alert(e.message)}})}catch(e){app.innerHTML=`<div class="card"><h1>No se pudo abrir la entrega</h1><p class="muted">${esc(e.message)}</p><a class="btn" href="calendar.html">Volver a agenda</a></div>`}}render()})();</script></body></html>
