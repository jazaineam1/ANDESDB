<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Agenda académica ANDESDB"><meta name="theme-color" content="#101828"><title>ANDESDB · Agenda</title><style>:root{--ink:#17202a;--muted:#667085;--line:#e4e7ec;--bg:#f7f8fa;--paper:#fff;--nav:#101828;--yellow:#ffd600;--blue:#175cd3;--green:#16794b;--orange:#b54708}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.appbar{height:58px;background:var(--nav);color:#fff;display:flex;align-items:center;position:sticky;top:0;z-index:20}.inner,.page{width:min(1080px,94vw);margin:auto}.inner{display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:900}.mark{width:31px;height:31px;border-radius:9px;background:var(--yellow);color:#3d3300;display:grid;place-items:center}.nav{margin-left:auto;display:flex;gap:3px}.nav a{padding:8px 10px;border-radius:8px;text-decoration:none;color:#d0d5dd;font-size:.8rem;font-weight:800}.nav a.active,.nav a:hover{background:#ffffff14;color:#fff}.page{padding:20px 0 78px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:15px}.ey{font-size:.68rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#8a7300}.head h1{margin:.18rem 0 .2rem;font-size:clamp(1.6rem,4vw,2.3rem)}.muted{color:var(--muted);font-size:.8rem}.btn{border:0;border-radius:9px;padding:8px 10px;background:#101828;color:#fff;text-decoration:none;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--blue)}.btn.alt{background:#eef2f6;color:#17202a}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 20px #1018280a;margin-bottom:14px}.card h2{margin:.05rem 0 .4rem;font-size:1.08rem}.item{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid #eef0f3;padding:11px 0}.item:first-of-type{border-top:0}.date{font-weight:900;font-size:.78rem}.date span{display:block;color:var(--muted);font-weight:700;font-size:.68rem}.topic b{display:block}.topic span{font-size:.73rem;color:var(--muted)}.pill{border-radius:999px;padding:4px 7px;background:#eef2f6;font-size:.66rem;font-weight:900}.pill.today{background:#fff4cc;color:#765b00}.pill.done{background:#dcfce7;color:#166534}.actions{display:flex;gap:7px;flex-wrap:wrap}.todo{border-top:1px solid #eef0f3;padding:10px 0}.todo:first-of-type{border-top:0}.mobile-nav{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.nav{display:none}.item{grid-template-columns:64px minmax(0,1fr);}.item .btn{grid-column:2}.page{padding-bottom:88px}.mobile-nav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px #0001}.mobile-nav a{padding:10px 4px 12px;text-align:center;text-decoration:none;font-size:.72rem;font-weight:800;color:#475467}.mobile-nav a.active{color:#101828}}</style></head><body><header class="appbar"><div class="inner"><a class="brand" href="portal.html"><span class="mark">A</span><span>ANDESDB</span></a><nav class="nav"><a href="portal.html">Inicio</a><a href="learning-hub.html">Curso</a><a class="active" href="calendar.html">Agenda</a></nav></div></header><main class="page"><div class="head"><div><div class="ey">Plan de trabajo</div><h1>Agenda del curso</h1><div class="muted">Las fechas se leen directamente del manifiesto oficial del curso.</div></div><div class="actions"><button class="btn primary" id="ics">Descargar calendario .ics</button><a class="btn alt" href="learning-hub.html">Ver curso</a></div></div><div class="grid"><section><article class="card"><h2>Sesiones</h2><div id="sessions"><div class="muted">Cargando calendario…</div></div></article></section><aside><article class="card"><div class="ey">Pendientes</div><h2>Entregas</h2><div id="todos"><div class="muted">Sincronizando…</div></div></article><article class="card"><div class="ey">Próximo paso</div><h2 id="next-title">—</h2><div class="muted" id="next-copy"></div><div class="actions"><a class="btn primary" id="next-link" href="learning-hub.html">Continuar</a></div></article></aside></div></main><nav class="mobile-nav"><a href="portal.html">⌂<br>Inicio</a><a href="learning-hub.html">▤<br>Curso</a><a class="active" href="calendar.html">◷<br>Agenda</a></nav><script src="assets/learning/course-data.js?v=20260912-lms2"></script><script src="assets/learning/lms-platform.js?v=20260912-lms2"></script><script src="assets/learning/learning-tracker.js?v=20260912-lms2"></script><script>(()=>{'use strict';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>new Intl.DateTimeFormat('es-CO',{weekday:'short',day:'numeric',month:'short'}).format(new Date(`${d}T12:00:00-05:00`)),fmtWhen=x=>new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Bogota'}).format(new Date(x));function gcal(s){const start=String(s.fecha).replaceAll('-','')+'T230000Z',mins=Number(s.duracionUtil||165),d=new Date(`${s.fecha}T18:00:00-05:00`);d.setMinutes(d.getMinutes()+mins);const z=d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(`ANDESDB · S${s.n} · ${s.titulo}`)+'&dates='+start+'/'+z+'&details='+encodeURIComponent(s.desc||'')+'&location='+encodeURIComponent('Clase virtual')+'&sf=true&output=xml'}async function render(){await window.ANDES_COURSE.ready();const now=new Date(),today=now.toLocaleDateString('en-CA',{timeZone:'America/Bogota'}),ss=window.ANDES_COURSE.sessions.filter(s=>s.fecha);document.getElementById('sessions').innerHTML=ss.map(s=>{const past=s.fecha<today,cur=s.fecha===today;return `<div class="item"><div class="date">${fmt(s.fecha)}<span>6:00 p. m.</span></div><div class="topic"><b>S${s.n} · ${esc(s.titulo)}</b><span>${esc(s.desc||'')}</span></div><div class="actions"><span class="pill ${cur?'today':past?'done':''}">${cur?'hoy':past?'realizada':'próxima'}</span><a class="btn alt" href="${esc(s.href)}">Abrir</a><a class="btn alt" target="_blank" rel="noopener" href="${gcal(s)}">Google</a></div></div>`}).join('');const next=ss.find(s=>s.fecha>=today)||ss.at(-1);if(next){document.getElementById('next-title').textContent=`S${next.n} · ${next.titulo}`;document.getElementById('next-copy').textContent=`${fmt(next.fecha)} · 6:00 p. m.`;document.getElementById('next-link').href=next.href}try{const p=await window.ANDES_PLATFORM.bootstrap(true),as=p.assignments||[];document.getElementById('todos').innerHTML=as.length?as.map(a=>`<div class="todo"><b>${esc(a.title)}</b><div class="muted">${a.due_at?'Vence '+fmtWhen(a.due_at):'Sin fecha límite'} · ${a.latest_submission?'Estado: '+esc(a.latest_submission.status):'Pendiente'}</div><div class="actions"><a class="btn alt" href="assignment.html?id=${encodeURIComponent(a.id)}">Abrir entrega</a></div></div>`).join(''):'<div class="muted">No hay entregas abiertas.</div>'}catch{document.getElementById('todos').innerHTML='<div class="muted">Inicia sesión para ver tus entregas.</div>'}}document.getElementById('ics').onclick=()=>window.ANDES_COURSE.downloadCalendar();render()})();</script></body></html>
