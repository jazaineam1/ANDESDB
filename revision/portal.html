<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Portal de aprendizaje ANDESDB"><title>ANDESDB · Portal de aprendizaje</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--ink:#111827;--muted:#64748b;--line:#dbe2ea;--bg:#f4f6f8;--yellow:#ffd600;--green:#166534}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}.wrap{width:min(1080px,94vw);margin:auto}.hero{background:linear-gradient(145deg,#0d1822,#173247);color:#fff;padding:34px 0 28px}.ey{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:900}.hero h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1;margin:.45rem 0}.hero p{max-width:68ch;color:#cad7e1}.shell{padding:24px 0 70px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.72fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px #0f172a0c}.card h2,.card h3{margin:.1rem 0 .5rem}.muted{color:var(--muted);font-size:.88rem}.form{display:grid;gap:9px;margin-top:14px}.input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:#fff;font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.alt{background:#e8edf2;color:#111827}.btn.good{background:#166534}.btn:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{display:none;padding:9px 11px;border-radius:9px;font-size:.85rem}.msg.show{display:block}.msg.ok{background:#dcfce7;color:#14532d}.msg.bad{background:#fee2e2;color:#7f1d1d}.courses{display:grid;gap:11px;margin-top:12px}.course{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfd}.course-main{border-left:5px solid var(--yellow)}.course h3{font-size:1.05rem}.meta{font-size:.76rem;color:var(--muted);margin:.35rem 0 .7rem}.bar{height:8px;background:#edf1f5;border-radius:999px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--green);transition:width .2s}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.user{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.tracks{display:grid;gap:8px}.track{border:1px solid #e5e7eb;border-radius:12px;padding:11px}.track b{display:block}.track span{font-size:.79rem;color:var(--muted)}.security{border-left:4px solid #eab308;background:#fff8da;border-radius:10px;padding:10px 12px;font-size:.82rem;margin-top:12px}.free{border-left-color:#22c55e;background:#f0fdf4;color:#14532d}.split{height:1px;background:#edf0f4;margin:16px 0}.hp{position:absolute;left:-9999px}.loading{padding:30px;text-align:center;color:var(--muted)}details{margin-top:14px;border-top:1px solid #edf0f4;padding-top:12px}summary{cursor:pointer;font-weight:850}.sync{font-size:.76rem;color:#64748b;margin-top:7px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding-top:24px}.card{padding:15px}}</style></head><body><header class="hero"><div class="wrap"><div class="ey">ANDESDB · plataforma de aprendizaje</div><h1>Aprende desde un solo lugar</h1><p>Acceso, curso, laboratorios y progreso en una sola plataforma. Esta implementación se mantiene sobre servicios gratuitos: GitHub Pages y Supabase Free, sin depender de SMTP de pago.</p></div></header><main class="shell"><div class="wrap"><div id="app" class="loading">Preparando tu portal…</div></div></main><script>
(()=>{'use strict';const app=document.getElementById('app'),API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1',STORE='andesdb.lms.auth.v1',COOKIE='andesdb_lms_session',COOKIE_PATH='/ANDESDB/revision/',COOKIE_AGE=34560000,next=new URLSearchParams(location.search).get('next');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));const readCookie=()=>{const x=document.cookie.split('; ').find(v=>v.startsWith(COOKIE+'='));return x?decodeURIComponent(x.slice(COOKIE.length+1)):''},setCookie=t=>{if(t)document.cookie=`${COOKIE}=${encodeURIComponent(t)}; Path=${COOKIE_PATH}; Max-Age=${COOKIE_AGE}; Secure; SameSite=Lax`},clearCookie=()=>{document.cookie=`${COOKIE}=; Path=${COOKIE_PATH}; Max-Age=0; Secure; SameSite=Lax`};const getAuth=()=>{try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x?.token)return x}catch{}const t=readCookie();return t?{token:t}:null},setAuth=x=>{localStorage.setItem(STORE,JSON.stringify(x));setCookie(x.token)},clearAuth=()=>{try{localStorage.removeItem(STORE)}catch{}clearCookie()};async function jfetch(url,opt={},ms=7000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);return x}finally{clearTimeout(t)}}
async function exchangeEmailLink(){const h=new URLSearchParams(location.hash.replace(/^#/,'')),access=h.get('access_token'),err=h.get('error_description')||h.get('error');if(err){app.className='card';app.innerHTML=`<h2>No se pudo usar el enlace</h2><div class="msg show bad">${esc(err)}</div><a class="btn" href="portal.html">Volver</a>`;return true}if(!access)return false;app.className='card';app.innerHTML='<h2>Validando acceso…</h2><p class="muted">Esto debería tomar solo unos segundos.</p>';try{const x=await jfetch(API+'/learning-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'exchange_supabase',access_token:access})});setAuth({token:x.token,expires_at:x.expires_at,auth_session_id:x.auth_session_id,user:x.user});location.replace(next||'portal.html?access=ok')}catch(e){app.innerHTML=`<h2>No se pudo iniciar sesión</h2><div class="msg show bad">${esc(e.name==='AbortError'?'El servidor tardó demasiado. Intenta nuevamente.':e.message)}</div><a class="btn" href="portal.html">Volver</a>`}return true}
function courseCard(user){return `<section class="card"><div class="toprow"><div class="user"><span class="avatar">${esc((user.display_name||user.username||'U').charAt(0).toUpperCase())}</span><div><b>${esc(user.display_name||user.username)}</b><div class="muted">${user.email?esc(user.email):'@'+esc(user.username)} · ${esc(user.role)}</div></div></div><button class="btn alt" id="logout">Cerrar sesión</button></div>${next?`<div class="security"><b>Tienes una página pendiente.</b><div style="margin-top:7px"><a class="btn good" href="${esc(next)}">Continuar</a></div></div>`:''}<div class="split"></div><h2>Mis cursos</h2><div class="courses"><article class="course course-main"><div class="ey" style="color:#8a7300">Curso activo</div><h3>Diseño y Gestión de Bases de Datos con SQL</h3><p class="muted">16 sesiones · 16 laboratorios · 160 prácticas · lecturas y recursos adicionales.</p><div class="meta" id="progress-meta">Progreso cargándose en segundo plano…</div><div class="bar"><i id="progress-bar" style="width:0%"></i></div><div class="actions"><a class="btn" href="index.html?course=andesdb">Entrar al curso</a><a class="btn alt" href="learning-hub.html?course=andesdb">Centro de aprendizaje</a>${['teacher','admin'].includes(user.role)?'<a class="btn alt" href="teacher-dashboard.html">Panel docente</a>':''}</div><div class="sync" id="sync-state">Contenido disponible. Sincronizando progreso…</div></article></div></section>`}
function signedView(auth){setAuth(auth);const u=auth.user;app.className='grid';app.innerHTML=courseCard(u)+`<aside class="card"><h2>Rutas complementarias</h2><div class="tracks"><div class="track"><b>SQL desde cero</b><span>S2–S5 · práctica ejecutable</span></div><div class="track"><b>Modelado e integridad</b><span>S6–S9 · reglas, ER, normalización y DDL</span></div><div class="track"><b>NoSQL aplicado</b><span>S10–S11 · decisiones y documentos</span></div><div class="track"><b>Analítica y cloud</b><span>S12–S14 · warehouse y BigQuery</span></div></div><div class="security free"><b>Sesión de estudiante:</b> permanece activa en este dispositivo hasta que cierres sesión, el docente revoque el acceso o la cuenta sea desactivada. No hay un vencimiento fijo.</div></aside>`;document.getElementById('logout').onclick=async()=>{const t=getAuth()?.token;clearAuth();app.className='loading';app.textContent='Cerrando sesión…';try{if(t)await jfetch(API+'/learning-auth',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({action:'logout'})},2500)}catch{}location.replace('portal.html')};syncProgress(auth)}
async function syncProgress(auth){const meta=document.getElementById('progress-meta'),bar=document.getElementById('progress-bar'),state=document.getElementById('sync-state');if(!meta)return;try{const d=await jfetch(API+'/learning-dashboard?scope=me',{headers:{Authorization:'Bearer '+auth.token}},4500),ap=d.activity_progress||[],done=ap.filter(x=>x.status==='completed').length,labs=(d.session_progress||[]).filter(x=>Number(x.session_number)>0&&x.status==='completed').length,p=Math.round(done/160*100);meta.textContent=`${labs}/16 laboratorios completos · ${done}/160 prácticas`;bar.style.width=p+'%';state.textContent='Progreso sincronizado.'}catch(e){state.textContent='El progreso se sincronizará cuando el servidor responda. Puedes seguir navegando.'}}
function loginView(){app.className='grid';app.innerHTML=`<section class="card"><h2>Entrar a ANDESDB</h2><div class="security free"><b>Estudiantes:</b> abre el enlace personal que te compartió el docente después de aprobar tu matrícula. No necesitas crear contraseña ni contratar ningún servicio adicional.</div><p class="muted" style="margin-top:14px">¿Ya estabas aprobado pero perdiste el acceso? Usa nuevamente un enlace todavía válido o solicita al docente un nuevo enlace para la misma matrícula.</p><details><summary>Acceso docente</summary><p class="muted">Administración mediante usuario y contraseña.</p><form class="form" id="login"><input class="input" name="u" autocomplete="username" placeholder="Usuario" required><input class="input" type="password" name="p" autocomplete="current-password" placeholder="Contraseña" required><button class="btn" type="submit">Entrar como docente</button><div class="msg" id="lm"></div></form></details></section><aside class="card"><h2>Solicitar acceso</h2><p class="muted">Primera vez o solicitud de un nuevo enlace. Si tu matrícula ya existe, no se duplica el estudiante.</p><form class="form" id="request"><input class="input" name="name" placeholder="Nombre completo" required><input class="input" type="email" name="email" placeholder="Correo electrónico" required><select name="course"><option value="andesdb">Diseño y Gestión de Bases de Datos con SQL</option></select><input class="hp" name="website" tabindex="-1" autocomplete="off"><button class="btn alt" type="submit">Solicitar acceso</button><div class="msg" id="rm"></div></form><div class="security free"><b>Infraestructura de acceso: $0.</b> El enlace lo comparte el docente desde su correo o aplicación habitual; la plataforma no necesita un servicio SMTP de pago.</div></aside>`;
app.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,m=app.querySelector('#lm'),b=f.querySelector('button');m.className='msg';b.disabled=true;b.textContent='Ingresando…';try{const x=await jfetch(API+'/learning-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:f.u.value,password:f.p.value})},6500);setAuth({token:x.token,expires_at:x.expires_at,auth_session_id:x.auth_session_id,user:x.user});location.replace(next||'portal.html?login=ok')}catch(ex){m.textContent=ex.name==='AbortError'?'El servidor tardó demasiado. Intenta de nuevo.':ex.message;m.className='msg show bad';b.disabled=false;b.textContent='Entrar como docente'}};
app.querySelector('#request').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,m=app.querySelector('#rm'),b=f.querySelector('button');m.className='msg';b.disabled=true;b.textContent='Enviando…';try{const x=await jfetch(API+'/learning-access-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:f.name.value,email:f.email.value,course_code:f.course.value,website:f.website.value})},6500);m.textContent=x.message;m.className='msg show ok';f.reset()}catch(ex){m.textContent=ex.name==='AbortError'?'El servidor tardó demasiado. Intenta nuevamente.':ex.message;m.className='msg show bad'}finally{b.disabled=false;b.textContent='Solicitar acceso'}}}
async function hydrateAuth(a){if(!a?.token)return null;if(a.user){setCookie(a.token);return a}try{const x=await jfetch(API+'/learning-auth',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.token},body:JSON.stringify({action:'me'})},4500);const full={token:a.token,user:x.user,expires_at:x.expires_at,auth_session_id:x.auth_session_id};setAuth(full);return full}catch{clearAuth();return null}}
(async()=>{if(await exchangeEmailLink())return;const a=await hydrateAuth(getAuth());a?.user?signedView(a):loginView()})();})();
</script></body></html>
