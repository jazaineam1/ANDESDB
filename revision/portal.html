<style>

0;overflow:hidden}.course-head{padding:20px;background:linear-gradient(145deg,#132238,#1e3a56);color:#fff}.course-head h2{margin:.2rem 0 .5rem;font-size:clamp(1.35rem,3vw,1.9rem)}.course-head p{margin:0;color:#d0d5dd}.course-body{padding:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.metric{background:#f8fafc;border:1px solid #eaecf0;border-radius:12px;padding:12px}.metric b{display:block;font-size:1.25rem}.metric span{font-size:.75rem;color:var(--muted)}.bar{height:9px;background:#eaecf0;border-radius:999px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--nav);color:#fff;text-decoration:none;font-weight:850;cursor:pointer;font:inherit}.btn.primary{background:var(--blue)}.btn.alt{background:#eef2f6;color:#17202a}.btn.good{background:var(--green)}.btn:disabled{opacity:.5;cursor:wait}.side h3{margin:.1rem 0 .45rem}.side p{margin:.2rem 0 12px;color:var(--muted);font-size:.88rem}.linkrow{display:grid;gap:7px}.linkrow a{display:flex;align-items:center;justify-content:space-between;text-decoration:none;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:.86rem;font-weight:750;background:#fff}.linkrow a:hover{border-color:#98a2b3}.split{height:1px;background:#eaecf0;margin:16px 0}.form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:.78rem;font-weight:850;color:#344054}.input,select{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;background:#fff;font:inherit;outline:none}.input:focus,select:focus{border-color:#84adff;box-shadow:0 0 0 3px #dbe7ff}.msg{display:none;border-radius:10px;padding:10px 11px;font-size:.84rem}.msg.show{display:block}.msg.ok{background:#ecfdf3;color:#067647}.msg.bad{background:#fef3f2;color:var(--red)}.login-shell{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:28px 0}.login-grid{width:min(900px,94vw);display:grid;grid-template-columns:1.05fr .95fr;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 24px 70px rgba(16,24,40,.14)}.login-main{padding:34px}.login-main h1{font-size:clamp(1.8rem,5vw,2.7rem);letter-spacing:-.04em;margin:.2rem 0 .5rem}.login-main>p{color:var(--muted);margin:0 0 14px}.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f2f4f7;border-radius:12px;padding:5px;margin:12px 0 10px}.role-tab{border:0;border-radius:9px;padding:10px 9px;background:transparent;color:#667085;font:850 .86rem/1 system-ui;cursor:pointer}.role-tab.active{background:#fff;color:#101828;box-shadow:0 2px 8px #10182816}.mode-copy{font-size:.82rem;color:#667085;margin:0 0 14px}.login-side{background:#132238;color:#fff;padding:34px;display:flex;flex-direction:column;justify-content:space-between}.login-side h2{margin:.25rem 0 .5rem}.login-side p{color:#d0d5dd}.steps{display:grid;gap:11px;margin:18px 0}.step{display:flex;gap:10px}.step b{width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#3d3300;display:grid;place-items:center;flex:0 0 auto}.step span{font-size:.87rem;color:#eaecf0}.request{margin-top:14px;padding-top:14px;border-top:1px solid #ffffff22}.request summary{cursor:pointer;font-weight:850}.request .field label{color:#eaecf0}.request .input,.request select{background:#fff;color:#17202a}.loading{padding:60px;text-align:center;color:var(--muted)}.mobile-nav{display:none}@media(max-width:820px){.layout,.login-grid{grid-template-columns:1fr}.login-side{order:2}.welcome{align-items:flex-start;flex-direction:column}.nav{display:none}.userchip{margin-left:auto}.teacher-entry{margin-left:auto}.page{padding-bottom:92px}.mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px #0001}.mobile-nav a{padding:10px 4px 12px;text-align:center;text-decoration:none;font-size:.72rem;font-weight:800;color:#475467}.mobile-nav a.active{color:#101828}.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header class="appbar"><div class="inner"><a class="brand" href="portal.html"><span class="mark">A</span><span>ANDESDB</span></a><nav class="nav" id="topnav" hidden><a class="active" href="portal.html">Mis cursos</a><a href="learning-hub.html">Curso</a><a href="learning-hub.html#sesiones">Sesiones</a></nav><button class="teacher-entry" id="teacher-entry">Acceso docente</button><span class="userchip" id="userchip" hidden></span></div></header>
<div id="app" class="loading">Preparando tu espacio…</div>
<script>
(()=>{'use strict';
const app=document.getElementById('app'),topnav=document.getElementById('topnav'),userchip=document.getElementById('userchip'),teacherEntry=document.getElementById('teacher-entry');
const API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1',STORE='andesdb.lms.auth.v1',COOKIE='andesdb_lms_session',COOKIE_PATH='/ANDESDB/revision/',COOKIE_AGE=34560000;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readCookie=()=>{const x=document.cookie.split('; ').find(v=>v.startsWith(COOKIE+'='));return x?decodeURIComponent(x.slice(COOKIE.length+1)):''};
const setCookie=t=>{if(t)document.cookie=`${COOKIE}=${encodeURIComponent(t)}; Path=${COOKIE_PATH}; Max-Age=${COOKIE_AGE}; Secure; SameSite=Lax`};
const clearCookie=()=>document.cookie=`${COOKIE}=; Path=${COOKIE_PATH}; Max-Age=0; Secure; SameSite=Lax`;
const getAuth=()=>{try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x?.token)return x}catch{}const t=readCookie();return t?{token:t}:null};
const setAuth=x=>{try{localStorage.setItem(STORE,JSON.stringify(x))}catch{};setCookie(x.token)};
const clearAuth=()=>{try{localStorage.removeItem(STORE)}catch{};clearCookie()};
async function call(path,opt={},ms=7000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(API+'/'+path,{...opt,signal:c.signal});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);return x}finally{clearTimeout(t)}}
async function hydrate(a){if(!a?.token)return null;try{const x=await call('learning-auth',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.token},body:JSON.stringify({action:'me'})},4500),full={token:a.token,user:x.user,expires_at:x.expires_at,auth_session_id:x.auth_session_id};setAuth(full);return full}catch{clearAuth();return null}}
function mobileNav(){return `<nav class="mobile-nav"><a class="active" href="portal.html">⌂<br>Inicio</a><a href="learning-hub.html">▤<br>Curso</a><a href="learning-hub.html#sesiones">✓<br>Sesiones</a></nav>`}
function loginView(initialMode='student'){topnav.hidden=true;userchip.hidden=true;teacherEntry.hidden=false;app.className='login-shell';app.innerHTML=`<section class="login-grid"><div class="login-main"><div class="ey">ANDESDB · plataforma de aprendizaje</div><h1>Inicia sesión</h1><p>Estudiantes y docentes usan el mismo sistema de usuario y contraseña.</p><div class="role-tabs" id="role-tabs"><button type="button" class="role-tab active" data-mode="student">Soy estudiante</button><button type="button" class="role-tab" data-mode="teacher">Soy docente</button></div><p class="mode-copy" id="mode-copy"></p><form class="form" id="login"><div class="field"><label id="user-label">Usuario o correo</label><input class="input" name="u" autocomplete="username" required placeholder="nombre@correo.com"></div><div class="field"><label>Contraseña</label><input class="input" type="password" name="p" autocomplete="current-password" required placeholder="••••••••"></div><button class="btn primary" type="submit" id="login-submit">Entrar a ANDESDB</button><div class="msg" id="lm"></div></form><div class="split"></div><p style="font-size:.82rem;margin:0;color:#667085"><b>¿Olvidaste la contraseña?</b> El docente puede restablecerla desde su panel. No necesitas crear otra cuenta.</p></div><aside class="login-side"><div><div class="ey" style="color:#ffd600">Una ruta clara</div><h2>Del curso a la práctica, sin perderte</h2><p>La navegación sigue el patrón de un LMS: tablero → curso → sesión → actividad.</p><div class="steps"><div class="step"><b>1</b><span>Entra y ve tu curso y progreso.</span></div><div class="step"><b>2</b><span>Continúa exactamente en la sesión pendiente.</span></div><div class="step"><b>3</b><span>Abre presentación, lectura o laboratorio desde la misma sesión.</span></div></div></div><details class="request"><summary>¿Aún no tienes cuenta? Solicitar matrícula</summary><form class="form" id="request" style="margin-top:12px"><div class="field"><label>Nombre completo</label><input class="input" name="name" required></div><div class="field"><label>Correo</label><input class="input" type="email" name="email" required></div><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button class="btn" type="submit">Enviar solicitud</button><div class="msg" id="rm"></div></form></details></aside></section>`;
let loginMode='student';const lf=app.querySelector('#login'),modeCopy=app.querySelector('#mode-copy'),submit=app.querySelector('#login-submit'),label=app.querySelector('#user-label');
function setMode(mode){loginMode=mode;app.querySelectorAll('.role-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(mode==='teacher'){modeCopy.innerHTML='<b>Acceso docente.</b> Usa tu usuario de profesor para abrir directamente el panel de administración.';label.textContent='Usuario docente';lf.u.placeholder='usuario docente';submit.textContent='Entrar al panel docente';}else{modeCopy.textContent='Usa el correo/usuario y la contraseña que te entregó el docente.';label.textContent='Usuario o correo';lf.u.placeholder='nombre@correo.com';submit.textContent='Entrar a ANDESDB';}}
app.querySelector('#role-tabs').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)};setMode(initialMode);
teacherEntry.onclick=()=>{setMode('teacher');lf.u.focus();window.scrollTo({top:0,behavior:'smooth'})};
lf.onsubmit=async e=>{e.preventDefault();const b=submit,m=app.querySelector('#lm'),normal=loginMode==='teacher'?'Entrar al panel docente':'Entrar a ANDESDB';b.disabled=true;b.textContent='Ingresando…';m.className='msg';try{const x=await call('learning-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:lf.u.value,password:lf.p.value})},7000);if(loginMode==='teacher'&&!['teacher','admin'].includes(x.user.role))throw new Error('Esta cuenta no tiene permisos docentes.');setAuth({token:x.token,user:x.user,expires_at:x.expires_at,auth_session_id:x.auth_session_id});if(loginMode==='teacher'){location.replace('teacher-dashboard.html');return}signedView({token:x.token,user:x.user})}catch(ex){m.textContent=ex.name==='AbortError'?'La plataforma tardó demasiado. Intenta de nuevo.':ex.message;m.className='msg show bad';b.disabled=false;b.textContent=normal}};
const rf=app.querySelector('#request');rf.onsubmit=async e=>{e.preventDefault();const b=rf.querySelector('button'),m=app.querySelector('#rm');b.disabled=true;b.textContent='Enviando…';try{const x=await call('learning-access-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:rf.name.value,email:rf.email.value,course_code:'andesdb',website:rf.website.value})},6500);m.textContent=x.message||'Solicitud enviada.';m.className='msg show ok';rf.reset()}catch(ex){m.textContent=ex.name==='AbortError'?'La plataforma tardó demasiado.':ex.message;m.className='msg show bad'}finally{b.disabled=false;b.textContent='Enviar solicitud'}}}
async function signedView(auth){teacherEntry.hidden=true;topnav.hidden=false;userchip.hidden=false;userchip.textContent=auth.user.display_name||auth.user.username;app.className='page';app.innerHTML=`<div class="welcome"><div><div class="ey">Mi aprendizaje</div><h1>Hola, ${esc((auth.user.display_name||auth.user.username).split(' ')[0])}</h1><p>Continúa desde donde vas. No necesitas volver a buscar el material.</p></div></div><div class="layout"><main><article class="card course"><div class="course-head"><div class="ey" style="color:#ffd600">Curso activo</div><h2>Diseño y Gestión de Bases de Datos con SQL</h2><p>16 sesiones · presentaciones · lecturas · laboratorios prácticos</p></div><div class="course-body"><div class="metrics"><div class="metric"><b id="labs">—</b><span>laboratorios completos</span></div><div class="metric"><b id="acts">—</b><span>prácticas completadas</span></div><div class="metric"><b id="pct">—</b><span>progreso</span></div></div><div class="bar"><i id="bar"></i></div><p id="continue-copy" style="color:#667085;font-size:.86rem;margin:.35rem 0 12px">Buscando tu siguiente actividad…</p><div class="actions"><a class="btn primary" id="continue" href="learning-hub.html">Continuar</a><a class="btn alt" href="learning-hub.html">Ver curso</a></div></div></article></main><aside class="card side"><h3>Accesos rápidos</h3><p>Las mismas opciones aparecen en todas las pantallas principales.</p><div class="linkrow"><a href="learning-hub.html"><span>Inicio del curso</span><span>→</span></a><a href="learning-hub.html#sesiones"><span>Sesiones y laboratorios</span><span>→</span></a><a href="learning-hub.html#recursos"><span>Lecturas y recursos</span><span>→</span></a>${['teacher','admin'].includes(auth.user.role)?'<a href="teacher-dashboard.html"><span>Panel docente</span><span>→</span></a>':''}</div><div class="split"></div><details><summary style="cursor:pointer;font-weight:850">Mi cuenta</summary><p>Usuario: <b>${esc(auth.user.username)}</b></p><form class="form" id="pw"><div class="field"><label>Nueva contraseña</label><input class="input" type="password" name="p" minlength="8" maxlength="72" required></div><button class="btn alt" type="submit">Cambiar contraseña</button><div class="msg" id="pm"></div></form><button class="btn alt" id="logout" style="margin-top:10px">Cerrar sesión</button></details></aside></div>${mobileNav()}`;
document.getElementById('logout').onclick=()=>logout(auth.token);document.getElementById('pw').onsubmit=e=>changePassword(e,auth.token);loadProgress(auth)}
async function loadProgress(auth){try{const d=await call('learning-dashboard?scope=me',{headers:{Authorization:'Bearer '+auth.token}},5000),ap=d.activity_progress||[],sp=d.session_progress||[],done=ap.filter(x=>x.status==='completed').length,labs=sp.filter(x=>Number(x.session_number)>0&&x.status==='completed').length,pct=Math.min(100,Math.round(done/160*100));document.getElementById('labs').textContent=`${labs}/16`;document.getElementById('acts').textContent=`${done}/160`;document.getElementById('pct').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';let next=1;for(let n=1;n<=16;n++){const s=sp.find(x=>Number(x.session_number)===n);if(!s||s.status!=='completed'){next=n;break}if(n===16)next=16}document.getElementById('continue').href=`lab.html?session=${next}`;document.getElementById('continue').textContent=`Continuar en sesión ${next}`;document.getElementById('continue-copy').textContent=`Tu siguiente paso está en la sesión ${next}.`;}catch{document.getElementById('labs').textContent='—';document.getElementById('acts').textContent='—';document.getElementById('pct').textContent='—';document.getElementById('continue-copy').textContent='Puedes seguir entrando al curso; el progreso se sincronizará cuando el servidor responda.'}}
async function changePassword(e,token){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),m=document.getElementById('pm');b.disabled=true;m.className='msg';try{const x=await call('learning-auth',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'change_password',password:f.p.value})},6500);m.textContent=x.message||'Contraseña actualizada.';m.className='msg show ok';f.reset()}catch(ex){m.textContent=ex.message;m.className='msg show bad'}finally{b.disabled=false}}
async function logout(token){clearAuth();try{await call('learning-auth',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'logout'})},2500)}catch{}loginView('student')}
(async()=>{const a=await hydrate(getAuth());a?.user?signedView(a):loginView('student')})();
})();
</script>
</body>
</html>
