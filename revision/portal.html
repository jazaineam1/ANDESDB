:root{--ink:#111827;--muted:#64748b;--line:#dbe2ea;--bg:#f4f6f8;--dark:#0f1b28;--yellow:#ffd600;--green:#166534}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}.wrap{width:min(1080px,94vw);margin:auto}.hero{background:linear-gradient(145deg,#0d1822,#173247);color:#fff;padding:34px 0 28px}.ey{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:900}.hero h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1;margin:.45rem 0}.hero p{max-width:66ch;color:#cad7e1}.shell{padding:24px 0 70px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.72fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px #0f172a0c}.card h2,.card h3{margin:.1rem 0 .5rem}.muted{color:var(--muted);font-size:.88rem}.form{display:grid;gap:9px;margin-top:14px}.input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:#fff;font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.alt{background:#e8edf2;color:#111827}.btn.good{background:#166534}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{display:none;padding:9px 11px;border-radius:9px;font-size:.85rem}.msg.show{display:block}.msg.ok{background:#dcfce7;color:#14532d}.msg.bad{background:#fee2e2;color:#7f1d1d}.courses{display:grid;gap:11px;margin-top:12px}.course{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfd}.course-main{border-left:5px solid var(--yellow)}.course h3{font-size:1.05rem}.meta{font-size:.76rem;color:var(--muted);margin:.35rem 0 .7rem}.bar{height:8px;background:#edf1f5;border-radius:999px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--green)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}.user{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900}.tracks{display:grid;gap:8px}.track{border:1px solid #e5e7eb;border-radius:12px;padding:11px}.track b{display:block}.track span{font-size:.79rem;color:var(--muted)}.security{border-left:4px solid #eab308;background:#fff8da;border-radius:10px;padding:10px 12px;font-size:.82rem;margin-top:12px}.split{height:1px;background:#edf0f4;margin:16px 0}.hp{position:absolute;left:-9999px}.loading{padding:30px;text-align:center;color:var(--muted)}details{margin-top:14px;border-top:1px solid #edf0f4;padding-top:12px}summary{cursor:pointer;font-weight:850}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding-top:24px}.card{padding:15px}}
</style></head><body><header class="hero"><div class="wrap"><div class="ey">ANDESDB · plataforma de aprendizaje</div><h1>Aprende desde un solo lugar</h1><p>Solicita acceso una vez. Cuando el docente aprueba tu matrícula, recibes un enlace por correo y entras sin administrar contraseñas.</p></div></header><main class="shell"><div class="wrap"><div id="app" class="loading">Preparando tu portal…</div></div></main><script src="assets/learning/learning-tracker.js?v=20260912-portal2"></script><script>
(async()=>{const app=document.getElementById('app'),API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1',STORE='andesdb.lms.auth.v1',next=new URLSearchParams(location.search).get('next');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const auth=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};async function exchangeEmailLink(){const h=new URLSearchParams(location.hash.replace(/^#/,'')),access=h.get('access_token'),err=h.get('error_description')||h.get('error');if(err){app.className='card';app.innerHTML=`<h2>No se pudo usar el enlace</h2><div class="msg show bad">${esc(err)}</div><p class="muted"><a href="portal.html">Volver al portal</a></p>`;return true}if(!access)return false;app.className='loading';app.textContent='Validando tu enlace de acceso…';try{const r=await fetch(API+'/learning-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'exchange_supabase',access_token:access})});const x=await r.json();if(!r.ok)throw new Error(x.error||'No se pudo validar el enlace');localStorage.setItem(STORE,JSON.stringify({token:x.token,expires_at:x.expires_at,auth_session_id:x.auth_session_id,user:x.user}));history.replaceState({},'',location.pathname+'?email_access=ok');location.reload()}catch(e){app.className='card';app.innerHTML=`<h2>No se pudo iniciar sesión</h2><div class="msg show bad">${esc(e.message)}</div><p class="muted">Puedes pedir un enlace nuevo desde el portal.</p><a class="btn" href="portal.html">Volver</a>`}return true}
if(await exchangeEmailLink())return;
async function getCourses(){const t=auth()?.token;if(!t)return null;const r=await fetch(API+'/learning-courses',{headers:{Authorization:'Bearer '+t}});return r.ok?r.json():null}function pct(n,d){return d?Math.round(n/d*100):0}async function signed(){const api=window.ANDES_LMS,u=await api.ready();if(!u)return loginView(api);let d=null,c=null;try{[d,c]=await Promise.all([api.dashboard('me',true),getCourses()])}catch{}const ap=d?.activity_progress||[],done=ap.filter(x=>x.status==='completed').length,labs=(d?.session_progress||[]).filter(x=>Number(x.session_number)>0&&x.status==='completed').length,p=pct(done,160),tracks=c?.tracks||d?.tracks||[];app.className='grid';app.innerHTML=`<section class="card"><div class="toprow"><div class="user"><span class="avatar">${esc((u.display_name||u.username||'U').charAt(0).toUpperCase())}</span><div><b>${esc(u.display_name||u.username)}</b><div class="muted">${u.email?esc(u.email):'@'+esc(u.username)} · ${esc(u.role)}</div></div></div><button class="btn alt" id="logout">Cerrar sesión</button></div>${next?`<div class="security"><b>Tienes una página pendiente.</b><div style="margin-top:7px"><a class="btn good" href="${esc(next)}">Continuar donde estabas</a></div></div>`:''}<div class="split"></div><h2>Mis cursos</h2><p class="muted">Cada curso conserva su propio recorrido y evidencia de aprendizaje.</p><div class="courses"><article class="course course-main"><div class="ey" style="color:#8a7300">Curso activo</div><h3>Diseño y Gestión de Bases de Datos con SQL</h3><p class="muted">16 sesiones · 16 laboratorios · 160 prácticas · lecturas y recursos adicionales.</p><div class="meta">${labs}/16 laboratorios completos · ${done}/160 prácticas</div><div class="bar"><i style="width:${p}%"></i></div><div class="actions"><a class="btn" href="index.html?course=andesdb">Entrar al curso</a><a class="btn alt" href="learning-hub.html?course=andesdb">Centro de aprendizaje</a></div></article></div></section><aside class="card"><h2>Rutas complementarias</h2><div class="tracks">${tracks.map(t=>`<div class="track"><b>${esc(t.title)}</b><span>${esc(t.description||'')}</span></div>`).join('')||'<div class="muted">Sin rutas adicionales disponibles.</div>'}</div><div class="security"><b>Privacidad:</b> progreso e intentos se guardan en el LMS. La analítica web se mantiene separada de la identidad académica.</div></aside>`;app.querySelector('#logout').onclick=async()=>{await api.logout();location.replace('portal.html')}}
function loginView(api){app.className='grid';app.innerHTML=`<section class="card"><h2>Entrar con correo</h2><p class="muted">Si tu solicitud ya fue aprobada, escribe el mismo correo. Recibirás un enlace de un solo uso.</p><form class="form" id="email-login"><input class="input" type="email" name="email" autocomplete="email" placeholder="tu@correo.com" required><button class="btn good" type="submit">Enviar enlace de acceso</button><div class="msg" id="em"></div></form><details><summary>Acceso docente / cuenta anterior</summary><p class="muted">Se mantiene para la cuenta de prueba y administración durante la transición.</p><form class="form" id="login"><input class="input" name="u" autocomplete="username" placeholder="Usuario" required><input class="input" type="password" name="p" autocomplete="current-password" placeholder="Contraseña" required><button class="btn" type="submit">Entrar con usuario</button><div class="msg" id="lm"></div></form></details><div class="security">Los estudiantes aprobados no necesitan una contraseña ANDESDB. El correo actúa como identidad y el enlace es temporal.</div></section><aside class="card"><h2>¿Primera vez?</h2><p class="muted">Solicita matrícula. La solicitud queda pendiente hasta que un docente la apruebe.</p><form class="form" id="request"><input class="input" name="name" placeholder="Nombre completo" required><input class="input" type="email" name="email" placeholder="Correo electrónico" required><select name="course"><option value="andesdb">Diseño y Gestión de Bases de Datos con SQL</option></select><input class="hp" name="website" tabindex="-1" autocomplete="off"><button class="btn alt" type="submit">Solicitar acceso</button><div class="msg" id="rm"></div></form></aside>`;
app.querySelector('#email-login').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,m=app.querySelector('#em');m.className='msg';try{const r=await fetch(API+'/learning-email-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.email.value})});const x=await r.json();if(!r.ok)throw new Error(x.error||'No se pudo enviar');m.textContent=x.message;m.className='msg show ok'}catch(ex){m.textContent=ex.message;m.className='msg show bad'}};
app.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,m=app.querySelector('#lm');m.className='msg';try{await api.login(f.u.value,f.p.value);if(next)location.replace(next);else signed()}catch(ex){m.textContent=ex.message;m.className='msg show bad'}};
app.querySelector('#request').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,m=app.querySelector('#rm');m.className='msg';try{const r=await fetch(API+'/learning-access-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:f.name.value,email:f.email.value,course_code:f.course.value,website:f.website.value})});const x=await r.json();if(!r.ok)throw new Error(x.error||'No se pudo enviar');m.textContent=x.message;m.className='msg show ok';f.reset()}catch(ex){m.textContent=ex.message;m.className='msg show bad'}}}
const start=()=>window.ANDES_LMS?signed():setTimeout(start,80);start();})();
</script></body></html>
