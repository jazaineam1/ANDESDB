const API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1',STORE='andesdb.lms.auth.v1',COOKIE='andesdb_lms_session',COOKIE_PATH='/ANDESDB/revision/',COOKIE_AGE=34560000,PRIMARY={1:'s1-diagnostico',2:'sql-s2',3:'sql-s3',4:'sql-s4',5:'sql-s5',6:'s6-reglas-evidencia',7:'erd-s7',8:'erd-s8',9:'s9-constraints',10:'decision-s10',11:'s11-documentos',12:'warehouse-s12',13:'bigquery-s13',14:'unnest-s14',15:'s15-integrador',16:'s16-dp900'};

function loginView(initialMode='student'){topnav.hidden=true;userchip.hidden=true;teacherNav.hidden=true;teacherEntry.hidden=false;app.className='login-shell';app.innerHTML=`<section class="login-grid"><div class="login-main"><div class="ey">ANDESDB · plataforma de aprendizaje</div><h1>Inicia sesión</h1><p>Un solo acceso para curso, prácticas, avance y agenda.</p><div class="role-tabs" id="role-tabs"><button type="button" class="role-tab active" data-mode="student">Soy estudiante</button><button type="button" class="role-tab" data-mode="teacher">Soy docente</button></div><p class="mode-copy" id="mode-copy"></p><form class="form" id="login"><div class="field"><label id="user-label">Usuario o correo</label><input class="input" name="u" autocomplete="username" required placeholder="nombre@correo.com"></div><div class="field"><label>Contraseña</label><input class="input" type="password" name="p" autocomplete="current-password" required placeholder="••••••••"></div><button class="btn primary" type="submit" id="login-submit">Entrar a ANDESDB</button><div class="msg" id="lm"></div></form><div class="notice" style="margin-top:14px"><b>¿Olvidaste la contraseña?</b> El docente puede restablecerla sin crear otra cuenta.</div></div><aside class="login-side"><div class="ey" style="color:#ffd600">Una ruta, no un laberinto</div><h2>Curso → sesión → evidencia</h2><p>ANDESDB conserva tu progreso en el servidor, aunque cambies de dispositivo.</p><div class="steps"><div class="step"><b>1</b><span>Entra y retoma exactamente tu actividad pendiente.</span></div><div class="step"><b>2</b><span>Consulta presentación, lectura y laboratorio en una sola ruta.</span></div><div class="step"><b>3</b><span>Revisa agenda, avisos, competencias y evidencias.</span></div></div><details class="request"><summary>¿Aún no tienes cuenta? Solicitar matrícula</summary><form class="form" id="request" style="margin-top:12px"><div class="field"><label>Nombre completo</label><input class="input" name="name" req let mode='student';const lf=app.querySelector('#login'),copy=app.querySelector('#mode-copy'),submit=app.querySelector('#login-submit'),label=app.querySelector('#user-label');function setMode(v){mode=v;app.querySelectorAll('.role-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===v));if(v==='teacher'){copy.innerHTML='<b>Acceso docente.</b> Abre directamente el panel de control.';label.textContent='Usuario docente';lf.u.placeholder='usuario docente';submit.textContent='Entrar al panel docente'}else{copy.textContent='Usa el usuario/correo y contraseña entregados por el docente.';label.textContent='Usuario o correo';lf.u.placeholder='nombre@correo.com';submit.textContent='Entrar a ANDESDB'}}app.querySelector('#role-tabs').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)};setMode(initialMode);teacherEntry.onclick=()=>{setMode('teacher');lf.u.focus()};lf.onsubmit=async e=>{e.preventDefault();const m=app.querySelector('#lm'),normal=mode==='teacher'?'Entrar al panel docente':'Entrar a ANDESDB';submit.disabled=true;submit.textContent='Ingresando…';m.className='msg';try{const x=await authCall('login',{username:lf.u.value,password:lf.p.value},null,7000);if(mode==='teacher'&&!['teacher','admin'].includes(x.user.role))throw new Error('Esta cuenta no tiene permisos docentes.');setAuth({token:x.token,user:x.user,expires_at:x.expires_at,auth_session_id:x.auth_session_id,persistent:x.persistent,course_run:x.course_run});if(mode==='teacher'){location.replace('teacher-dashboard.html');return}const next=safeNext();if(next){location.replace(next);return}await signedView(getAuth())}catch(ex){m.textContent=ex.name==='AbortError'?'La plataforma tardó demasiado. Intenta de nuevo.':ex.message;m.className='msg show bad'}finally{submit.disabled=false;submit.textContent=normal}};const rf=app.querySelector('#request');rf.onsubmit=async e=>{e.preventDefault();const b=rf.querySelector('button'),m=app.querySelector('#rm');b.disabled=true;b.textContent='Enviando…';try{const x=await call('learning-access-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:rf.name.value,email:rf.email.value,course_code:'andesdb',website:rf.website.value})},6500);m.textContent=x.message||'Solicitud enviada.';m.className='msg show ok';rf.reset()}catch(ex){m.textContent=ex.message;m.className='msg show bad'}finally{b.disabled=false;b.textContent='Enviar solicitud'}}}
async function accountPanel(auth){let sessions=[];try{sessions=(await authCall('list_sessions',{},auth.token)).sessions||[]}catch{}return `<div class="account"><details><summary>Mi cuenta y dispositivos</summary><p class="muted">Usuario: <b>${esc(auth.user.username)}</b>. Puedes cerrar sesiones que ya no reconozcas.</p><div>${sessions.map(s=>`<div class="device"><div class="row"><div><b>${esc(s.device_label)}</b><div class="muted">${s.current?'Este dispositivo · ':''}último uso ${fmtWhen(s.last_seen_at||s.created_at)}</div></div>${s.current?'<span class="pill good">actual</span>':`<button class="btn alt" data-revoke="${s.id}">Cerrar</button>`}</div></div>`).join('')||'<div class="muted">No hay otras sesiones.</div>'}</div><form class="form" id="pw" style="margin-top:12px"><div class="field"><label>Contraseña actual</label><input class="input" type="password" name="current" required autocomplete="current-password"></div><div class="field"><label>Nueva contraseña</label><input class="input" type="password" name="next" minlength="8" maxlength="72" required autocomplete="new-password"></div><button class="btn alt" type="submit">Cambiar contraseña</button><div class="msg" id="pm"></div></form><button class="btn alt" id="logout" style="margin-top:10px">Cerrar sesión</button></details></div>`}
async function signedView(auth){teacherEntry.hidden=true;topnav.hidden=false;userchip.hidden=false;userchip.textContent=auth.user.display_name||auth.user.username;teacherNav.hidden=!['teacher','admin'].includes(auth.user.role);app.className='page';await window.ANDES_COURSE?.ready?.();let d={session_progress:[],activity_progress:[],summary:null,resume:null,competencies:[]},p={announcements:[],assignments:[],competencies:[],bookmarks:[],resume:null,run:null};try{[d,p]=await Promise.all([call('learning-dashboard?scope=me',{headers:{Authorization:'Bearer '+auth.token}},6000),window.ANDES_PLATFORM.bootstrap(true)])}catch(e){console.warn(e)}const sessions=window.ANDES_COURSE?.sessions||[],done=(d.activity_progress||[]).filter(x=>x.status==='completed').length,labs=(d.session_progress||[]).filter(x=>x.status==='completed').length,pct=Math.round(done/160*100),resume=p.resume||d.resume,continueHref=resume?resumeLink(resume):'learning-hub.html',continueCopy=resume?.session_number?`Retoma S${resume.session_number}${resume.activity_code?' · práctica pendiente':''}${resume.slide_number?` · última slide ${resume.slide_number}`:''}`:'Continúa por la siguiente sesión pendiente';const upcoming=window.ANDES_COURSE.upcoming(new Date()).slice(0,3),unread=(p.announcements||[]).filter(x=>!x.read_at).length,account=await accountPanel(auth);app.innerHTML=`<div class="topline"><div><div class="ey">Mi aprendizaje</div><h1>Hola, ${esc((auth.user.display_name||auth.user.username).split(' ')[0])}</h1><p>${esc(p.run?.title||'Diseño y Gestión de Bases de Datos con SQL')}</p></div><a class="btn primary" href="${esc(continueHref)}">Continuar →</a></div><div class="grid"><main><section class="card"><div class="course-head"><div><div class="ey">Progreso</div><div class="course-title">Diseño y Gestión de Bases de Datos con SQL</div><div class="muted">${esc(continueCopy)}</div></div><span class="pill good">${pct}%</span></div><div class="metrics"><div class="metric"><b>${labs}/16</b><span>sesiones logradas</span></div><div class="metric"><b>${done}/160</b><span>prácticas logradas</span></div><div class="metric"><b>${fmtTime(d.summary?.active_seconds)}</b><span>tiempo activo</span></div><div class="metric"><b>${(d.summary?.attempts||0)}</b><span>intentos</span></div></div><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div><div class="actions"><a class="btn primary" href="${esc(continueHref)}">Continuar</a><a class="btn alt" href="learning-hub.html">Ver curso</a><a class="btn alt" href="calendar.html">Agenda y calendario</a>${['teacher','admin'].includes(auth.user.role)?'<a class="btn warn" href="teacher-dashboard.html">Control docente</a>':''}</div></section><section class="card" style="margin-top:14px"><div class="row"><div><div class="ey">Avisos</div><h2>Comunicaciones ${unread?`<span class="pill new">${unread} nuevas</span>`:''}</h2></div></div><div id="announcements">${(p.announcements||[]).slice(0,5).map(a=>`<article class="announcement"><div class="row"><div><b>${esc(a.title)}</b><div class="muted">${fmtWhen(a.published_at)}</div></div>${a.read_at?'<span class="pill">leído</span>':`<button class="btn alt" data-read-ann="${a.id}">Marcar leído</button>`}</div><div style="font-size:.84rem;margin-top:5px">${esc(a.body)}</div>${a.link?`<a href="${esc(a.link)}" class="muted">Abrir recurso →</a>`:''}</article>`).join('')||'<div class="muted">No hay anuncios publicados.</div>'}</div></section><section class="card" style="margin-top:14px"><div class="ey">Competencias</div><h2>Lo que ya puedes demostrar</h2><div class="competencies">${(p.competencies||d.competencies||[]).map(c=>`<div class="comp"><b>${esc(c.title)}</b><div class="mini"><i style="width:${Math.min(100,Number(c.mastery_pct||0))}%"></i></div><span>${Number(c.mastery_pct||0).toFixed(0)}%</span></div>`).join('')||'<div class="muted">Se calcularán al registrar actividad.</div>'}</div></section></main><aside><section class="card"><div class="ey">Agenda</div><h2>Próximos pasos</h2>${upcoming.map(s=>`<div class="agenda-item"><div class="row"><div><b>S${s.n} · ${esc(s.titulo)}</b><div class="muted">${fmtDate(s.fecha)} · 6:00 p. m.</div></div><a class="btn alt" href="${esc(s.href)}">Abrir</a></div></div>`).join('')||'<div class="muted">No quedan sesiones programadas.</div>'}<div class="actions"><a class="btn alt" href="calendar.html">Ver agenda</a><button class="btn alt" id="ics">Descargar .ics</button></div></section><section class="card" style="margin-top:14px"><div class="ey">Entregas</div><h3>Pendientes</h3>${(p.assignments||[]).map(a=>`<div class="assignment"><b>${esc(a.title)}</b><div class="muted">${a.due_at?`vence ${fmtWhen(a.due_at)}`:'sin fecha límite'} · ${a.latest_submission?`estado: ${esc(a.latest_submission.status)}`:'sin entregar'}</div></div>`).join('')||'<div class="muted">No hay entregas abiertas.</div>'}</section><section class="card" style="margin-top:14px"><div class="ey">Guardados</div><h3>Marcadores y notas</h3>${(p.bookmarks||[]).slice(0,5).map(b=>`<div class="bookmark"><a href="${esc(b.path)}"><b>${esc(b.title||`S${b.session_number||''}`)}</b></a><div class="muted">${esc(b.note||'Sin nota')}</div></div>`).join('')||'<div class="muted">Todavía no guardaste nada.</div>'}</section><section class="card" style="margin-top:14px">${account}</section></aside></div>${mobileNav()}`;document.getElementById('ics')?.addEventListener('click',()=>window.ANDES_COURSE.downloadCalendar());document.querySelectorAll('[data-read-ann]').forEach(b=>b.onclick=async()=>{await window.ANDES_PLATFORM.readAnnouncement(b.dataset.readAnn);signedView(auth)});document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await authCall('revoke_session',{session_id:b.dataset.revoke},auth.token);signedView(auth)}catch(e){b.textContent=e.message}});document.getElementById('logout').onclick=()=>logout(auth.token);document.getElementById('pw').onsubmit=e=>changePassword(e,auth.token)}
async function changePassword(e,token){e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),m=document.getElementById('pm');b.disabled=true;m.className='msg';try{await call('learning-password',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({current_password:f.current.value,new_password:f.next.value})},6500);m.textContent='Contraseña actualizada. Las otras sesiones quedaron cerradas.';m.className='msg show ok';f.reset()}catch(ex){m.textContent=ex.message;m.className='msg show bad'}finally{b.disabled=false}}
async function logout(token){clearAuth();try{await authCall('logout',{},token,2500)}catch{}loginView('student')}
(async()=>{await window.ANDES_COURSE?.ready?.();const a=await hydrate(getAuth());if(a?.user){const next=safeNext();if(next){location.replace(next);return}signedView(a)}else loginView('student')})();
})();
</script>
