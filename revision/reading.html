r:1px solid #dbe4f0;border-radius:10px;background:#fff;padding:10px}.bridge-item b{display:block;font-size:.75rem;margin-bottom:3px}.bridge-item span{font-size:.76rem;color:#475467;line-height:1.45}.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 4px}.def{border:1px solid #d0d5dd;border-radius:11px;padding:11px 12px;background:#fafafa}.def b{display:block;color:#1849a9;margin-bottom:2px}.def span{font-size:.87rem;color:#475467;line-height:1.5}.idea{border-left:3px solid #d0d5dd;padding-left:13px;margin:14px 0}.idea h3{font-size:1rem;margin:0 0 4px}.idea p{margin:.25rem 0!important}.keybox,.beyond,.example,.apply{border-radius:12px;padding:14px 15px;margin:14px 0}.keybox{background:var(--softblue);border:1px solid #c7d7fe}.beyond{background:var(--softpurple);border:1px solid #d9d6fe}.example{background:var(--softgreen);border:1px solid #bbf7d0}.apply{background:#f8fafc;border:1px solid #e4e7ec}.keybox h2,.beyond h2,.example h2,.apply h2,.sources h2{font-size:1.08rem;margin:.05rem 0 .35rem}.keybox p,.beyond p,.apply p{font-size:.86rem!important;color:#475467;margin:.2rem 0 .65rem!important}.keybox li,.beyond li,.apply li{margin:.42rem 0}.new-label{display:inline-block;background:#6941c6;color:#fff;border-radius:999px;font-size:.66rem;font-weight:900;padding:4px 7px;margin-bottom:6px}.example b{display:block;color:#166534;margin-bottom:4px}.sources{margin:16px 0}.source{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin:7px 0}.source b{display:block}.source span{display:block;color:var(--muted);font-size:.75rem}.source a,.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:8px 10px;text-decoration:none;font-weight:850;font-size:.76rem}.source a{background:#eef4ff;color:#1849a9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{background:#101828;color:#fff}.btn.primary{background:var(--blue)}.btn.alt{background:#eef2f6;color:#17202a}.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.footer-nav a{flex:1}.footer-nav a:last-child{text-align:right}.loading{padding:40px;text-align:center;color:var(--muted)}@media(max-width:760px){.route{grid-template-columns:1fr}.bridge-grid{grid-template-columns:1fr}}@media(max-width:680px){.navlink.hide-mobile{display:none}.page{padding-top:14px}.hero{padding:19px}.article{padding:15px}.defs{grid-template-columns:1fr}.source{grid-template-columns:1fr}.source a{width:max-content}.footer-nav{flex-direction:column}.footer-nav a:last-child{text-align:left}.actions .btn{flex:1 1 45%}}
</style></head><body><header class="appbar"><div class="inner"><a class="brand" href="portal.html"><span class="mark">A</span><span>ANDESDB</span></a><span class="spacer"></span><a class="navlink hide-mobile" href="learning-hub.html">Curso</a><a class="navlink" href="calendar.html">Agenda</a></div></header><main class="page" id="app"><div class="loading">Cargando lectura…</div></main><script src="assets/learning/course-data.js?v=20260912-perf1"></script><script src="assets/learning/readings-v5.js?v=20260912"></script><script src="assets/learning/readings-v6.js?v=20260913-context1"></script><script src="assets/learning/learning-tracker.js?v=20260912-lms2" defer></script><script src="assets/learning/access-gate.js?v=20260912-lms2" defer></script><script>(()=>{'use strict';const app=document.getElementById('app'),n=Math.max(1,Math.min(16,Number(new URLSearchParams(location.search).get('session'))||1)),R=window.ANDES_READINGS,s=R?.sessions?.[n];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function source(r){return `<div class="source"><div><b>${esc(r[1])}</b><span>${esc(r[0])}</span></div><a href="${esc(r[2])}" target="_blank" rel="noopener noreferrer">Abrir fuente ↗</a></div>`}function list(items){return `<ul>${(items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}function bridge(items){const labels=['En la presentación','En el laboratorio','En esta lectura'];return `<div class="bridge-grid">${(items||[]).slice(0,3).map((x,i)=>`<div class="bridge-item"><b>${labels[i]||'Conexión'}</b><span>${esc(x)}</span></div>`).join('')}</div>`}async function render(){await window.ANDES_COURSE?.ready?.();const cs=window.ANDES_COURSE?.session?.(n);if(!s){app.innerHTML='<div class="objective"><b>Lectura no disponible</b>Regresa al curso.</div>';return}document.title=`S${n} · ${s.title} · ANDESDB`;const defs=(s.definitions||[]).map(d=>`<div class="def"><b>${esc(d[0])}</b><span>${esc(d[1])}</span></div>`).join('');const ideas=(s.core||[]).map((p,i)=>`<div class="idea"><div class="section-kicker">${['Fundamento','Razonamiento','Transferencia'][i]||'Profundización'}</div><h3>${['Idea central','Cómo razonar','Qué debes poder transferir'][i]||`Idea ${i+1}`}</h3><p>${esc(p)}</p></div>`).join('');const edu=R.methodology.education.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a> · ${esc(x.org)}</li>`).join('');const tags=(cs?.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');const story=window.ANDES_COURSE?.STORY?.[n]||'';app.innerHTML=`<div class="crumb"><a href="portal.html">Inicio</a> › <a href="learning-hub.html">Curso</a> › S${n} › Lectura</div><section class="hero"><div class="ey">Lectura guiada · Sesión ${n}</div><h1>${esc(s.title)}</h1><p>${esc(cs?.titulo||'Diseño y Gestión de Bases de Datos con SQL')}</p><div class="meta"><span class="pill">≈ ${s.minutes} min</span><span class="pill">Recupera la clase + explica + amplía</span><span class="pill">Fuentes oficiales</span></div></section><section class="orientation"><div class="section-kicker">Cómo usar esta lectura</div><h2>No es una lista de temas: es un recorrido</h2><p>La lectura parte de lo visto en las diapositivas, lo vuelve a explicar con más calma y separa de forma explícita qué ideas son ampliación. Así puedes saber qué ya debías reconocer de la clase, qué necesitas comprender ahora y qué es material adicional.</p><nav class="route" aria-label="Ruta de la lectura"><a href="#partida"><span class="route-num">1</span><span><strong>Punto de partida</strong><small>Por qué importa y qué problema resuelve.</small></span></a><a href="#clase"><span class="route-num">2</span><span><strong>Lo visto en clase</strong><small>Pregunta guía, alcance y conceptos de las diapositivas.</small></span></a><a href="#vocabulario"><span class="route-num">3</span><span><strong>Vocabulario</strong><small>Definiciones para leer el resto sin ambigüedad.</small></span></a><a href="#ideas"><span class="route-num">4</span><span><strong>Explicación</strong><small>Qué significa, cómo razonar y qué transferir.</small></span></a><a href="#ampliacion"><span class="route-num">5</span><span><strong>Ampliación</strong><small>Lo adicional que no cabe completo en las diapositivas.</small></span></a><a href="#practica"><span class="route-num">6</span><span><strong>Práctica</strong><small>Qué debes ser capaz de hacer sin copiar.</small></span></a></nav></section><section class="objective"><b>Al terminar debes poder</b>${esc(s.objective)}</section><section class="context" id="partida"><b>1 · Punto de partida: ¿por qué importa este tema?</b>${esc(s.context||'Esta lectura conecta la pregunta de la sesión con decisiones concretas de diseño y consulta.')}</section><section class="class-recap" id="clase"><div class="section-kicker">2 · Recuperación de la clase</div><h2>Lo que ya viste en las diapositivas</h2>${story?`<p class="class-question">Pregunta guía: ${esc(story)}</p>`:''}<p>${esc(cs?.desc||'Esta sección recupera el alcance trabajado en la sesión antes de añadir profundidad.')}</p>${tags?`<div class="tags" aria-label="Conceptos trabajados en clase">${tags}</div>`:''}<p>Este bloque no pretende repetir cada diapositiva. Su función es recordarte el terreno común antes de entrar en definiciones, razonamiento y ampliaciones.</p>${bridge(s.bridge)}</section><article class="article"><section class="section" id="vocabulario"><div class="section-kicker">3 · Vocabulario esencial</div><h2>Definiciones que debes manejar</h2><p class="section-lead">Estas palabras aparecen en la clase y en el laboratorio. Léelas como un contrato de significado: si una definición no está clara, el razonamiento posterior se vuelve confuso.</p><div class="defs">${defs}</div></section><section class="section" id="ideas"><div class="section-kicker">4 · Desarrollo conceptual</div><h2>Ahora sí: qué significa y cómo se razona</h2><p class="section-lead">Aquí se desarrollan las ideas que en una diapositiva suelen aparecer resumidas. No memorices la frase; intenta reconstruir la decisión que hay detrás.</p>${ideas}${(s.important||[]).length?`<div class="keybox"><h2>Conceptos que no deberías perder</h2><p>Si al terminar solo recuerdas unas pocas ideas, conserva estas porque sostienen el laboratorio y las sesiones siguientes.</p>${list(s.important)}</div>`:''}</section><section class="section" id="ampliacion"><div class="section-kicker">5 · Profundización</div><h2>Qué añade esta lectura más allá de las diapositivas</h2><p class="section-lead">Lo siguiente es deliberadamente adicional: aclara límites, casos borde o conexiones que no caben completas en la presentación. No se mezcla con el repaso para que sepas exactamente qué estás ampliando.</p>${(s.beyond||[]).length?`<div class="beyond"><span class="new-label">NUEVO / AMPLIACIÓN</span><h2>Ideas para profundizar</h2>${list(s.beyond)}</div>`:''}${s.example?`<div class="example"><h2>Ejemplo razonado</h2><b>${esc(s.example.title)}</b><p>${esc(s.example.body)}</p></div>`:''}</section><section class="section" id="practica"><div class="section-kicker">6 · Transferencia</div><h2>Llévalo a una decisión o consulta</h2><p class="section-lead">Esta es la prueba de comprensión: deberías poder hacer estas tareas sin buscar una plantilla exacta. Si no puedes explicarlas con tus palabras, vuelve al bloque conceptual correspondiente.</p><div class="apply"><h2>Transfiérelo a la práctica</h2>${list(s.apply)}</div></section></article><section class="check"><b>Comprobación sin releer</b>Responde con tus palabras: ${esc((s.apply||[])[0]||s.objective)}</section><section class="sources"><h2>Fuentes primarias y referentes</h2><p style="color:var(--muted);font-size:.82rem">Úsalas para ampliar, comprobar detalles del motor o contrastar la síntesis. La lectura está escrita para acompañar la clase; no es una copia de estas fuentes.</p>${(s.refs||[]).map(source).join('')}</section><details class="method"><summary><b style="display:inline">Criterio de estas lecturas</b></summary><p>${esc(R.methodology.statement)}</p><ul>${edu}</ul></details><div class="actions"><a class="btn alt" href="${esc(cs?.href||'learning-hub.html')}">▶ Presentación</a><a class="btn primary" href="lab.html?session=${n}">✓ Laboratorio</a><a class="btn alt" href="learning-hub.html?session=${n}#sesiones">Curso</a></div><nav class="footer-nav">${n>1?`<a href="reading.html?session=${n-1}">← Lectura S${n-1}</a>`:'<span></span>'}${n<16?`<a href="reading.html?session=${n+1}">Lectura S${n+1} →</a>`:'<span></span>'}</nav>`}render();})();</script></body></html>
