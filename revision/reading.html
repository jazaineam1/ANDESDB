color:#166534;padding:5px 8px;white-space:nowrap}.class-topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.class-topic{background:#fff;border:1px solid #d8e3f1;border-radius:10px;padding:11px 12px}.class-topic b{display:block;color:#1849a9;font-size:.82rem;margin-bottom:3px}.class-topic p{font-size:.78rem;line-height:1.48;margin:0!important;color:#475467}.bridge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.bridge-item{border:1px solid #e1e6ec;border-radius:10px;background:#fff;padding:10px}.bridge-item b{display:block;font-size:.73rem;margin-bottom:3px}.bridge-item span{font-size:.75rem;color:#475467;line-height:1.45}.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0 4px}.def{border:1px solid #d0d5dd;border-radius:11px;padding:11px 12px;background:#fafafa}.def b{display:block;color:#1849a9;margin-bottom:2px}.def span{font-size:.86rem;color:#475467;line-height:1.5}.idea{border-left:3px solid #d0d5dd;padding-left:13px;margin:15px 0}.idea h3{font-size:1rem;margin:.1rem 0 4px}.idea p{margin:.25rem 0;color:#344054}.keybox,.beyond,.example,.apply{border-radius:12px;padding:14px 15px;margin:14px 0}.keybox{background:var(--blue-soft);border:1px solid #c7d7fe}.beyond{background:var(--purple-soft);border:1px solid #d9d6fe}.example{background:var(--green-soft);border:1px solid #bbf7d0}.apply{background:#f8fafc;border:1px solid #e4e7ec}.keybox h3,.beyond h3,.example h3,.apply h3{font-size:1.03rem;margin:.05rem 0 .35rem}.keybox p,.beyond p,.apply p{font-size:.84rem;color:#475467;margin:.2rem 0 .65rem}.keybox li,.beyond li,.apply li{margin:.42rem 0}.new-label{display:inline-block;background:#6941c6;color:#fff;border-radius:999px;font-size:.65rem;font-weight:950;padding:4px 7px;margin-bottom:6px}.example b{display:block;color:#166534;margin-bottom:4px}.sources{margin:16px 0}.sources h2{font-size:1.08rem;margin:.1rem 0}.source{display:grid;grid-template-columns:1fr auto;gap:12px; <body>
<header class="appbar"><div class="inner"><a class="brand" href="portal.html"><span class="mark">A</span><span>ANDESDB</span></a><span class="spacer"></span><a class="navlink hide-mobile" href="learning-hub.html">Curso</a><a class="navlink" href="calendar.html">Agenda</a></div></header>
<main class="page" id="app"><div class="loading">Cargando lectura…</div></main>
<script src="assets/learning/course-data.js?v=20260912-perf1"></script>
<script src="assets/learning/readings-v5.js?v=20260912"></script>
<script src="assets/learning/readings-v6.js?v=20260913-context1"></script>
<script src="assets/learning/readings-v7-alignment.js?v=20260913-align1"></script>

<script>
(()=>{'use strict';
const app=document.getElementById('app');
const n=Math.max(1,Math.min(16,Number(new URLSearchParams(location.search).get('session'))||1));
const R=window.ANDES_READINGS,s=R?.sessions?.[n];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=items=>`<ul>${(items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
function source(r){return `<div class="source"><div><b>${esc(r[1])}</b><span>${esc(r[0])}</span></div><a href="${esc(r[2])}" target="_blank" rel="noopener noreferrer">Abrir fuente ↗</a></div>`}
function bridge(items){const labels=['En la presentación','En el laboratorio','En esta lectura'];return `<div class="bridge-grid">${(items||[]).slice(0,3).map((x,i)=>`<div class="bridge-item"><b>${labels[i]||'Conexión'}</b><span>${esc(x)}</span></div>`).join('')}</div>`}
function classTopics(items){return `<div class="class-topics">${(items||[]).map(x=>`<div class="class-topic"><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div>`).join('')}</div>`}
async function render(){
  await window.ANDES_COURSE?.ready?.();
  const cs=window.ANDES_COURSE?.session?.(n);
  if(!s){app.innerHTML='<section class="card objective"><b>Lectura no disponible</b>Regresa al curso.</section>';return}
  document.title=`S${n} · ${s.title} · ANDESDB`;
  const defs=(s.definitions||[]).map(d=>`<div class="def"><b>${esc(d[0])}</b><span>${esc(d[1])}</span></div>`).join('');
  const ideas=(s.core||[]).map((p,i)=>`<div class="idea"><div class="kicker">${['Fundamento','Razonamiento','Transferencia'][i]||'Profundización'}</div><h3>${['Idea central','Cómo razonar','Qué debes poder transferir'][i]||`Idea ${i+1}`}</h3><p>${esc(p)}</p></div>`).join('');
  const edu=(R.methodology?.education||[]).map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a> · ${esc(x.org)}</li>`).join('');
  const tags=(cs?.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  const story=window.ANDES_COURSE?.STORY?.[n]||'';
  const recap=s.classRecap||[];
  app.innerHTML=`
  <div class="crumb"><a href="portal.html">Inicio</a> › <a href="learning-hub.html">Curso</a> › S${n} › Lectura</div>
  <section class="hero"><div class="ey">Lectura guiada · Sesión ${n}</div><h1>${esc(s.title)}</h1><p>${esc(cs?.titulo||'Diseño y Gestión de Bases de Datos con SQL')}</p><div class="meta"><span class="pill">≈ ${s.minutes} min</span><span class="pill">Clase → explicación → ampliación → práctica</span><span class="pill">Fuentes primarias</span></div></section>
  <section class="card orientation"><div class="kicker">Cómo usar esta lectura</div><h2>Los números sí tienen una función</h2><p>No son un índice decorativo. Cada bloque responde una pregunta distinta y el orden está pensado para que no leas definiciones aisladas sin saber de dónde vienen.</p>
    <nav class="route" aria-label="Ruta de la lectura">
      <a href="#partida"><span class="route-num">1</span><span><strong>Contexto</strong><small>Qué problema abre el tema y por qué importa.</small></span></a>
      <a href="#clase"><span class="route-num">2</span><span><strong>Lo visto en diapositivas</strong><small>Recuperación explícita de los conceptos de la clase.</small></span></a>
      <a href="#vocabulario"><span class="route-num">3</span><span><strong>Definiciones</strong><small>Palabras que necesitas para razonar sin ambigüedad.</small></span></a>
      <a href="#ideas"><span class="route-num">4</span><span><strong>Explicación</strong><small>Qué significa, cómo se razona y dónde suele fallar.</small></span></a>
      <a href="#ampliacion"><span class="route-num">5</span><span><strong>Lo adicional</strong><small>Ideas que amplían lo que no se desarrolló completo en las diapositivas.</small></span></a>
      <a href="#practica"><span class="route-num">6</span><span><strong>Transferencia</strong><small>Qué debes poder hacer sin copiar una plantilla.</small></span></a>
    </nav>
    <div class="contract"><b>Contrato de lectura:</b> “Lo visto en diapositivas” recupera la clase; “NUEVO / AMPLIACIÓN” identifica lo que se añade. No se mezclan ambos sin avisarte.</div>
  </section>
  <section class="card objective"><b>Al terminar debes poder</b>${esc(s.objective)}</section>
  <section class="card context" id="partida"><div class="kicker">1 · Contexto</div><h2>¿Por qué importa este tema?</h2><p>${esc(s.context||'Esta lectura conecta la pregunta de la sesión con decisiones concretas de diseño y consulta.')}</p></section>
  <section class="card class-recap" id="clase"><div class="kicker">2 · Lo visto en diapositivas</div><h2>Recuperación de la clase antes de añadir nada nuevo</h2>${story?`<p class="class-question">Pregunta guía: ${esc(story)}</p>`:''}<p>${esc(cs?.desc||'Esta sección recupera el alcance trabajado en la sesión.')}</p>${tags?`<div class="tags" aria-label="Conceptos trabajados en clase">${tags}</div>`:''}<div class="coverage-head"><b>Cobertura conceptual de la presentación</b><span class="count-chip">${recap.length} bloques recuperados</span></div>${classTopics(recap)}${bridge(s.bridge)}</section>
  <article class="article">
    <section class="section" id="vocabulario"><div class="kicker">3 · Definiciones</div><h2>Vocabulario que necesitas para entender el resto</h2><p class="lead">No memorices tarjetas sueltas: usa estas definiciones para interpretar las decisiones que aparecen después.</p><div class="defs">${defs}</div></section>
    <section class="section" id="ideas"><div class="kicker">4 · Explicación y razonamiento</div><h2>Qué significa, cómo se piensa y qué debes poder transferir</h2><p class="lead">Aquí se desarrolla con más calma lo que en una diapositiva necesariamente aparece resumido.</p>${ideas}${(s.important||[]).length?`<div class="keybox"><h3>Conceptos que no deberías perder</h3><p>Son las ideas que sostienen el laboratorio y las sesiones siguientes.</p>${list(s.important)}</div>`:''}</section>
    <section class="section" id="ampliacion"><div class="kicker">5 · Lo adicional</div><h2>Qué añade esta lectura más allá de las diapositivas</h2><p class="lead">Este bloque está separado a propósito. Son matices, límites, casos borde o conexiones que no se desarrollaron completos durante la presentación.</p>${(s.beyond||[]).length?`<div class="beyond"><span class="new-label">NUEVO / AMPLIACIÓN</span><h3>Profundización</h3>${list(s.beyond)}</div>`:''}${s.example?`<div class="example"><h3>Ejemplo razonado</h3><b>${esc(s.example.title)}</b><p>${esc(s.example.body)}</p></div>`:''}</section>
    <section class="section" id="practica"><div class="kicker">6 · Transferencia</div><h2>Llévalo a una decisión, diseño o consulta</h2><p class="lead">Esta es la comprobación real: si entiendes el tema, deberías poder hacer estas tareas sin buscar una solución idéntica.</p><div class="apply"><h3>Práctica de recuperación</h3>${list(s.apply)}</div></section>
  </article>
  <section class="card check"><b>Comprobación sin releer</b>Responde con tus palabras: ${esc((s.apply||[])[0]||s.objective)}</section>
  <section class="sources"><h2>Fuentes primarias y referentes</h2><p style="color:var(--muted);font-size:.82rem">Sirven para comprobar detalles y ampliar. La lectura organiza y conecta la clase; no reemplaza la documentación oficial.</p>${(s.refs||[]).map(source).join('')}</section>
  <details class="card method"><summary><b>Criterio de estas lecturas</b></summary><p>${esc(R.methodology?.statement||'Síntesis docentes conectadas con práctica y fuentes.')}</p><ul>${edu}</ul></details>
  <div class="actions"><a class="btn alt" href="${esc(cs?.href||'learning-hub.html')}">▶ Presentación</a><a class="btn primary" href="lab.html?session=${n}">✓ Laboratorio</a><a class="btn alt" href="learning-hub.html?session=${n}#sesiones">Curso</a></div>
  <nav class="footer-nav">${n>1?`<a href="reading.html?session=${n-1}">← Lectura S${n-1}</a>`:'<span></span>'}${n<16?`<a href="reading.html?session=${n+1}">Lectura S${n+1} →</a>`:'<span></span>'}</nav>`;
}
render();
})();
</script>
</body>
</html>
