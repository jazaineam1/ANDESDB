<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Panel docente de analítica de aprendizaje ANDESDB"><title>ANDESDB · Panel docente</title><style>
:root{--ink:#111827;--muted:#64748b;--line:#dbe1e8;--bg:#f4f6f8;--paper:#fff;--yellow:#ffd600;--green:#166534;--orange:#a16207;--red:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}.wrap{width:min(1280px,94vw);margin:auto}.top{background:#0e1a24;color:#fff;padding:22px 0}.top .wrap{display:flex;gap:16px;align-items:center}.top h1{margin:0;font-size:clamp(1.5rem,3vw,2.4rem);flex:1}.top a,.top button{border:1px solid #ffffff44;background:#ffffff10;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;text-decoration:none;cursor:pointer}.ey{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:900}main{padding:24px 0 70px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #0f172a0a}.metric{padding:14px}.metric b{display:block;font-size:1.55rem}.metric span{font-size:.78rem;color:var(--muted)}.card{padding:16px;margin-bottom:18px}.card h2{margin:0 0 10px;font-size:1.15rem}.muted{color:var(--muted);font-size:.84rem}.tablewrap{overflow:auto;border:1px solid #e5e7eb;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:760px}th,td{padding:8px 9px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0;z-index:1}.pill{font-size:.7rem;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef2f7;color:#475569}.pill.done{background:#dcfce7;color:var(--green)}.pill.progress{background:#fef3c7;color:var(--orange)}.matrix{font-weight:900;text-align:center}.matrix.done{color:var(--green)}.matrix.progress{color:var(--orange)}.matrix.none{color:#cbd5e1}.error{background:#fee2e2;color:#7f1d1d;border-radius:12px;padding:12px}.notice{background:#fffbea;border:1px solid #fde68a;border-radius:12px;padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar button{border:0;border-radius:10px;padding:8px 11px;background:#111827;color:#fff;font-weight:800;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.top .wrap{flex-wrap:wrap}.top h1{flex-basis:100%}}
</style></head><body><header class="top"><div class="wrap"><div><div class="ey">ANDESDB · revision</div><h1>Panel docente · aprendizaje</h1></div><a href="learning-hub.html">Centro de aprendizaje</a><a href="index.html">Curso</a></div></header><main><div class="wrap"><div class="toolbar"><button id="refresh">Actualizar</button><span class="muted" id="viewer"></span></div><div id="content"><div class="notice">Cargando… Si aún no iniciaste sesión, abre <b>Mi aprendizaje</b> y entra con una cuenta docente.</div></div></div></main><script src="assets/learning/learning-tracker.js?v=20260912a"></script><script>
(()=>{const content=document.getElementById('content'),viewer=document.getElementById('viewer'),refresh=document.getElementById('refresh');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>{s=Number(s||0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`};
async function load(){const api=window.ANDES_LMS;if(!api)return;const u=await api.ready();if(!u){viewer.textContent='Sin sesión';content.innerHTML='<div class="notice">Inicia sesión desde el botón <b>Mi aprendizaje</b>. El panel solo se entrega a roles docente/administrador.</div>';return;}viewer.textContent=`${u.display_name||u.username} · ${u.role}`;if(!['teacher','admin'].includes(u.role)){content.innerHTML='<div class="error">Tu cuenta no tiene rol docente.</div>';return;}content.innerHTML='<div class="notice">Actualizando analítica…</div>';try{const d=await api.dashboard('all',true);render(d);}catch(e){content.innerHTML=`<div class="error">${esc(e.message)}</div>`;}}
function render(d){const users=d.users||[],sp=d.session_progress||[],ap=d.activity_progress||[],events=d.recent_events||[],sessions=d.sessions||[];const totalActive=users.reduce((a,x)=>a+Number(x.active_seconds||0),0);const done=ap.filter(x=>x.status==='completed').length;const attempts=ap.reduce((a,x)=>a+Number(x.attempts||0),0);const hints=ap.reduce((a,x)=>a+Number(x.hints_used||0),0);const byUserSession=new Map(sp.map(x=>[`${x.user_id}:${x.session_number}`,x]));const rows=users.map(u=>`<tr><td><b>${esc(u.display_name||u.username)}</b><br><span class="muted">${esc(u.username)} · ${esc(u.role)}</span></td><td>${time(u.active_seconds)}</td><td>${u.activities_completed||0}</td><td>${u.attempts||0}</td><td>${u.hints_used||0}</td>${sessions.map(s=>{const x=byUserSession.get(`${u.user_id}:${s.session_number}`);const cls=!x?'none':x.status==='completed'?'done':'progress';const txt=!x?'·':x.status==='completed'?'✓':time(x.active_seconds);return `<td class="matrix ${cls}" title="${x?`activo ${time(x.active_seconds)}`:'sin evidencia'}">${txt}</td>`}).join('')}</tr>`).join('');
const activityAgg=(d.activities||[]).map(a=>{const xs=ap.filter(x=>x.activity_code===a.code);const complete=xs.filter(x=>x.status==='completed').length;const at=xs.reduce((n,x)=>n+Number(x.attempts||0),0);const hi=xs.reduce((n,x)=>n+Number(x.hints_used||0),0);return `<tr><td>S${a.session_number}</td><td>${esc(a.title)}</td><td>${complete}/${users.length||0}</td><td>${at}</td><td>${hi}</td><td>${xs.length?Math.round(100*complete/xs.length):0}%</td></tr>`}).join('');
const evRows=events.slice(0,50).map(e=>{const u=users.find(x=>x.user_id===e.user_id);return `<tr><td>${new Date(e.created_at).toLocaleString('es-CO')}</td><td>${esc(u?.username||e.user_id)}</td><td>${esc(e.event_type)}</td><td>${e.session_number?`S${e.session_number}`:'—'}</td><td>${esc(e.activity_code||'—')}</td></tr>`}).join('');
content.innerHTML=`<section class="grid"><div class="metric"><b>${users.length}</b><span>usuarios activos</span></div><div class="metric"><b>${time(totalActive)}</b><span>tiempo activo acumulado</span></div><div class="metric"><b>${done}</b><span>retos logrados</span></div><div class="metric"><b>${attempts}</b><span>intentos</span></div><div class="metric"><b>${hints}</b><span>pistas solicitadas</span></div></section><section class="card"><h2>Matriz estudiante × sesión</h2><p class="muted">✓ = sesión marcada completa; tiempo = evidencia activa registrada. El tiempo es diagnóstico, no nota.</p><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Activo</th><th>Retos</th><th>Intentos</th><th>Pistas</th>${sessions.map(s=>`<th>S${s.session_number}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="99">Sin datos aún.</td></tr>'}</tbody></table></div></section><section class="card"><h2>Dificultad por actividad</h2><div class="tablewrap"><table><thead><tr><th>Sesión</th><th>Actividad</th><th>Completaron</th><th>Intentos</th><th>Pistas</th><th>Éxito entre quienes interactuaron</th></tr></thead><tbody>${activityAgg}</tbody></table></div></section><section class="card"><h2>Eventos recientes</h2><div class="tablewrap"><table><thead><tr><th>Hora</th><th>Usuario</th><th>Evento</th><th>Sesión</th><th>Actividad</th></tr></thead><tbody>${evRows||'<tr><td colspan="5">Todavía no hay eventos.</td></tr>'}</tbody></table></div></section>`;}
refresh.onclick=load;if(window.ANDES_LMS)load();else addEventListener('load',load,{once:true});})();
</script></body></html>
