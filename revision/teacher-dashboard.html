<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Control docente integral ANDESDB"><meta name="theme-color" content="#101828"><title>ANDESDB · Control docente</title><style>:root{--ink:#17202a;--muted:#667085;--line:#e4e7ec;--bg:#f7f8fa;--paper:#fff;--nav:#101828;--yellow:#ffd600;--green:#16794b;--orange:#b54708;--red:#b42318;--blue:#175cd3;--purple:#6941c6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}.appbar{height:60px;background:var(--nav);color:#fff;display:flex;align-items:center;position:sticky;top:0;z-index:30}.inner,.wrap{width:min(1260px,94vw);margin:auto}.inner{display:flex;align-items:center;gap:8px}.brand{display:flex;gap:8px;align-items:center;text-decoration:none;font-weight:900}.mark{width:32px;height:32px;border-radius:9px;background:var(--yellow);color:#3d3300;display:grid;place-items:center}.spacer{flex:1}.appbar a.nav,.appbar button{border:1px solid #ffffff25;background:#ffffff0c;color:#fff;border-radius:8px;padding:8px 9px;font-weight:800;text-decoration:none;cursor:pointer;font-size:.77rem}.wrap{padding:18px 0 70px}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}.ey{font-size:.68rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:#8a7300}.head h1{margin:.18rem 0 .05rem;font-size:clamp(1.55rem,4vw,2.3rem)}.muted{color:var(--muted);font-size:.79rem;line-height:1.45}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn,.act{border:0;border-radius:8px;padding:8px 10px;background:#101828;color:#fff;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font:800 .76rem/1.1 system-ui}.btn.alt,.act.alt{background:#eef2f6;color:#17202a}.btn.good,.act.good{background:var(--green)}.btn.blue,.act.blue{background:var(--blue)}.btn.red,.act.red{background:var(--red)}.btn.yellow{background:#fff4cc;color:#765b00}.btn:disabled,.act:disabled{opacity:.5}.tabs{display:flex;gap:5px;overflow:auto;padding:3px 0 11px;scrollbar-width:thin}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;font-weight:850;color:#475467;cursor:pointer}.tab.active{background:#101828;color:#fff;border-color:#101828}.status{display:none;margin-bottom:11px;padding:10px;border-radius:9px;font-size:.81rem}.status.show{display:block}.status.ok{background:#ecfdf3;color:#067647}.status.warn{background:#fffaeb;color:#93370d}.status.err{background:#fef3f2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:13px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 5px 18px #10182809}.metric{padding:12px}.metric b{display:block;font-size:1.3rem}.metric span{font-size:.7rem;color:var(--muted)}.card{padding:14px;margin-bottom:13px}.card h2{margin:.05rem 0 .4rem;font-size:1.07rem}.card h3{margin:.05rem 0 .35rem;font-size:.95rem}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tablewrap{overflow:auto;border:1px solid #eaecf0;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:.76rem;min-width:760px}th,td{padding:8px;border-bottom:1px solid #eaecf0;text-align:left;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0;color:#475467;font-size:.67rem;text-transform:uppercase;letter-spacing:.04em}.clickrow{cursor:pointer}.clickrow:hover td{background:#f8fafc}.pill{font-size:.65rem;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef2f6;display:inline-flex}.pill.high{background:#fee2e2;color:#991b1b}.pill.medium{background:#fef0c7;color:#93370d}.pill.low,.pill.approved,.pill.reviewed{background:#dcfce7;color:#166534}.pill.pending,.pill.submitted{background:#fff4cc;color:#765b00}.pill.rejected{background:#fee2e2;color:#991b1b}.list{display:grid;gap:7px}.item{border:1px solid #eaecf0;border-radius:10px;padding:10px;background:#fbfcfd}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.form{display:grid;gap:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px}.field label{font-size:.72rem;font-weight:850;color:#344054}.input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:9px 10px;background:#fff;font:inherit}.input:focus,select:focus,textarea:focus{outline:3px solid #dbe7ff;border-color:#84adff}.credentials{margin-top:9px;border:1px solid #b2ddff;background:#eff8ff;border-radius:10px;padding:10px}.credentials code{word-break:break-all;font-weight:900}.progressbar{height:6px;background:#eaecf0;border-radius:999px;overflow:hidden}.progressbar i{display:block;height:100%;background:var(--blue)}dialog{border:0;border-radius:15px;padding:0;width:min(840px,94vw);max-height:90vh;box-shadow:0 30px 100px #0006}dialog::backdrop{background:#101828aa}.modal-head{position:sticky;top:0;z-index:3;background:#101828;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:9px}.modal-head b{flex:1}.modal-head button{border:0;background:#ffffff14;color:#fff;border-radius:8px;padding:7px 9px;font-weight:900;cursor:pointer}.modal-body{padding:14px;overflow:auto}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.detailmetric{border:1px solid #eaecf0;border-radius:9px;padding:9px}.detailmetric b{display:block}.competency{display:grid;grid-template-columns:minmax(120px,1fr) 1.3fr 45px;gap:7px;align-items:center;font-size:.74rem;margin:7px 0}.riskbox{border-left:4px solid var(--orange);background:#fffaeb;border-radius:9px;padding:9px}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.head{align-items:flex-start;flex-direction:column}.appbar a.nav{display:none}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr 1fr}.wrap{padding-bottom:90px}}</style></head><body><header class="appbar"><div class="inner"><a class="brand" href="portal.html"><span class="mark">A</span><span>ANDESDB</span></a><span class="spacer"></span><a class="nav" href="portal.html">Inicio</a><a class="nav" href="learning-hub.html">Curso</a><a class="nav" href="calendar.html">Agenda</a><a class="nav" href="https://analytics.google.com/analytics/web/" target="_blank" rel="noopener">GA4</a><button id="logout">Salir</button></div></header><main class="wrap"><div class="head"><div><div class="ey">Control docente</div><h1>ANDESDB · Cohorte</h1><div class="muted" id="run-name">Cargando cohorte…</div></div><div class="toolbar"><button class="btn alt" id="export">Exportar CSV</button><button class="btn alt" id="refresh">Actualizar</button><span class="muted" id="viewer"></span></div></div><div class="tabs"><button class="tab active" data-tab="overview">Resumen</button><button class="tab" data-tab="students">Estudiantes</button><button class="tab" data-tab="communication">Anuncios</button><button class="tab" data-tab="assignments">Entregas</button><button class="tab" data-tab="access">Acceso</button></div><div id="status" class="status"></div><div id="content"><div class="card">Cargando control docente…</div></div></main><dialog id="dialog"><div class="modal-head"><b id="dialog-title">Detalle</b><button id="dialog-close">Cerrar</button></div><div class="modal-body" id="dialog-body"></div></dialog><script src="assets/learning/course-data.js?v=20260912-lms2"></script><script src="assets/learning/lms-platform.js?v=20260912-lms2"></script><script>(()=>{'use strict';const API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1',STORE='andesdb.lms.auth.v1',content=document.getElementById('content'),viewer=document.getElementById('viewer'),status=document.getElementById('status'),refresh=document.getElementById('refresh'),dialog=document.getElementById('dialog'),body=document.getElementById('dialog-body'),title=document.getElementById('dialog-title');let tab='overview',dash=null,platform=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const auth=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};const time=s=>{s=Number(s||0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`};const when=x=>{if(!x)return'—';try{return new Intl.DateTimeFormat('es-CO',{dateStyle:'short',timeStyle:'short',timeZone:'America/Bogota'}).format(new Date(x))}catch{return'—'}};function msg(text,type='ok',html=''){status.className='status show '+type;status.innerHTML=html||esc(text);setTimeout(()=>{if(status.textContent===text)status.className='status'},6000)}async function api(path,opt={},ms=8000){const a=auth();if(!a?.token)throw new Error('Sesión docente vencida.');const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(API+'/'+path,{...opt,signal:c.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.token,...(opt.headers||{})}}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);return x}finally{clearTimeout(t)}}async function review(id,action){return api('learning-access-review',{method:'POST',body:JSON.stringify({request_id:id,action})},9000)}function credentials(x){return `<div class="credentials"><b>Credenciales de ${esc(x.recipient_name||'estudiante')}</b><div>Usuario: <code>${esc(x.username)}</code></div><div>Contraseña temporal: <code>${esc(x.password)}</code></div><div class="actions"><button class="act blue" id="copy-credentials">Copiar</button><button class="act alt" id="share-credentials">Compartir</button></div></div>`}function wireCredentials(x){const text=`ANDESDB\nUsuario: ${x.username}\nContraseña temporal: ${x.password}\nPortal: https://jazaineam1.github.io/ANDESDB/revision/portal.html`;document.getElementById('copy-credentials')?.addEventListener('click',async e=>{try{await navigator.clipboard.writeText(text);e.currentTarget.textContent='Copiado ✓'}catch{}});document.getElementById('share-credentials')?.addEventListener('click',async()=>{try{navigator.share?await navigator.share({title:'Acceso ANDESDB',text}):await navigator.clipboard.writeText(text)}catch{}})}async function accessAction(id,action,btn){const old=btn.textContent;btn.disabled=true;btn.textContent='Procesando…';try{const x=await review(id,action);if(x.username&&x.password){msg(x.warning||'Credenciales creadas','warn',`${esc(x.warning||'Credenciales creadas')}${credentials(x)}`);setTimeout(()=>wireCredentials(x),0)}else msg('Acción completada');await load()}catch(e){msg(e.message,'err')}finally{btn.disabled=false;btn.textContent=old}}
function metrics(){const users=(dash?.users||[]).filter(x=>x.role==='student'),pending=(dash?.access_requests||[]).filter(x=>x.status==='pending').length,active=users.reduce((a,x)=>a+Number(x.active_seconds||0),0),done=(dash?.activity_progress||[]).filter(x=>x.status==='completed').length,high=(platform?.risk||[]).filter(x=>x.role==='student'&&x.risk_level==='high').length;return {users,pending,active,done,high}}
function overview(){const m=metrics(),risk=(platform.risk||[]).filter(x=>x.role==='student').sort((a,b)=>({high:3,medium:2,low:1,none:0}[b.risk_level]||0)-({high:3,medium:2,low:1,none:0}[a.risk_level]||0)).slice(0,8),diff=(platform.difficulty||[]).filter(x=>Number(x.learners_started)>0).sort((a,b)=>Number(b.avg_attempts||0)-Number(a.avg_attempts||0)||Number(b.hints_used||0)-Number(a.hints_used||0)).slice(0,8);content.innerHTML=`<section class="grid"><div class="metric"><b>${m.users.length}</b><span>estudiantes activos</span></div><div class="metric"><b>${m.pending}</b><span>solicitudes pendientes</span></div><div class="metric"><b>${time(m.active)}</b><span>tiempo activo grupo</span></div><div class="metric"><b>${m.done}</b><span>prácticas logradas</span></div><div class="metric"><b>${m.high}</b><span>requieren atención</span></div></section><div class="cols"><section class="card"><div class="ey">Intervención</div><h2>Estudiantes que necesitan atención</h2><div class="list">${risk.length?risk.map(x=>`<div class="item clickrow" data-user="${x.user_id}"><div class="row"><div><b>${esc(x.display_name||x.username)}</b><div class="muted">Última actividad ${when(x.last_activity_at)} · ${x.activities_completed}/160 prácticas</div></div><span class="pill ${x.risk_level}">${x.risk_level==='high'?'alta':x.risk_level==='medium'?'media':'baja'}</span></div>${x.struggling_activities?`<div class="riskbox muted">${x.struggling_activities} práctica(s) con ≥4 intentos sin completar.</div>`:''}</div>`).join(''):'<div class="muted">Aún no hay datos suficientes.</div>'}</div></section><section class="card"><div class="ey">Fricción pedagógica</div><h2>Prácticas más difíciles</h2><div class="list">${diff.length?diff.map(x=>`<div class="item"><div class="row"><div><b>S${x.session_number} · ${esc(x.title||x.activity_code)}</b><div class="muted">${x.learners_completed}/${x.learners_started} completaron · ${x.attempts} intentos · ${x.hints_used} pistas</div></div><span class="pill">${Number(x.avg_attempts||0).toFixed(1)} int.</span></div></div>`).join(''):'<div class="muted">Aparecerá cuando haya actividad.</div>'}</div></section></div><section class="card"><div class="ey">Cobertura</div><h2>Competencias del grupo</h2>${groupCompetencies()}</section>`;wireUserRows()}
function groupCompetencies(){const rows=platform.competencies||[],students=[...new Set(rows.map(x=>x.user_id))].length||1,by=new Map();for(const x of rows){const k=x.competency_code;if(!by.has(k))by.set(k,{title:x.title,domain:x.domain,sum:0,n:0});const z=by.get(k);z.sum+=Number(x.mastery_pct||0);z.n++}return `<div class="tablewrap"><table><thead><tr><th>Competencia</th><th>Dominio</th><th>Promedio</th></tr></thead><tbody>${[...by.values()].map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.domain)}</td><td><div class="progressbar"><i style="width:${x.n?x.sum/x.n:0}%"></i></div>${x.n?(x.sum/x.n).toFixed(0):0}%</td></tr>`).join('')}</tbody></table></div>`}
function students(){const users=(dash.users||[]).filter(x=>x.role==='student'),risk=new Map((platform.risk||[]).map(x=>[x.user_id,x]));content.innerHTML=`<section class="card"><div class="row"><div><div class="ey">Cohorte</div><h2>Estudiantes</h2></div><input class="input" id="student-search" type="search" placeholder="Buscar estudiante…" style="max-width:280px"></div><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Avance</th><th>Tiempo</th><th>Intentos</th><th>Pistas</th><th>Riesgo</th><th>Última actividad</th></tr></thead><tbody id="students-body">${users.map(u=>{const r=risk.get(u.user_id)||{};return `<tr class="clickrow" data-user="${u.user_id}" data-name="${esc((u.display_name||u.username).toLowerCase())}"><td><b>${esc(u.display_name||u.username)}</b><div class="muted">${esc(u.email||u.username)}</div></td><td>${u.activities_completed||0}/160</td><td>${time(u.active_seconds)}</td><td>${u.attempts||0}</td><td>${u.hints_used||0}</td><td><span class="pill ${r.risk_level||'low'}">${esc(r.risk_level||'low')}</span></td><td>${when(u.last_activity_at)}</td></tr>`}).join('')}</tbody></table></div></section>`;wireUserRows();document.getElementById('student-search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#students-body tr').forEach(r=>r.hidden=!r.dataset.name.includes(q))}}
function communication(){content.innerHTML=`<div class="cols"><section class="card"><div class="ey">Nueva comunicación</div><h2>Publicar anuncio</h2><form class="form" id="announcement-form"><div class="field"><label>Título</label><input class="input" name="title" maxlength="140" required></div><div class="field"><label>Mensaje</label><textarea name="body" rows="6" maxlength="5000" required></textarea></div><div class="field"><label>Enlace opcional</label><input class="input" name="link" placeholder="https://… o /ANDESDB/revision/…"></div><label><input type="checkbox" name="pinned"> Fijar arriba</label><button class="btn good" type="submit">Publicar</button></form></section><section class="card"><div class="ey">Historial</div><h2>Anuncios</h2><div class="list">${(platform.announcements||[]).map(a=>`<div class="item"><div class="row"><div><b>${esc(a.title)}</b><div class="muted">${when(a.published_at)}</div></div><button class="act red" data-del-ann="${a.id}">Eliminar</button></div><div class="muted" style="margin-top:5px">${esc(a.body)}</div></div>`).join('')||'<div class="muted">No hay anuncios.</div>'}</div></section></div>`;document.getElementById('announcement-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{await window.ANDES_PLATFORM.createAnnouncement({title:f.title.value,body:f.body.value,link:f.link.value,pinned:f.pinned.checked});f.reset();msg('Anuncio publicado');await load()}catch(ex){msg(ex.message,'err')}finally{b.disabled=false}};document.querySelectorAll('[data-del-ann]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar este anuncio?')){await window.ANDES_PLATFORM.deleteAnnouncement(b.dataset.delAnn);load()}})}
function assignments(){const users=new Map((platform.users||[]).map(x=>[x.id,x])),assignments=platform.assignments||[],names=new Map(assignments.map(x=>[x.id,x])),subs=(platform.submissions||[]).filter(x=>x.status==='submitted'||x.status==='returned');content.innerHTML=`<div class="cols"><section class="card"><div class="ey">Nueva evidencia</div><h2>Crear entrega</h2><form class="form" id="assignment-form"><div class="formgrid"><div class="field"><label>Título</label><input class="input" name="title" required></div><div class="field"><label>Sesión</label><select name="session"><option value="">Curso</option>${(dash.sessions||[]).map(s=>`<option value="${s.session_number}">S${s.session_number} · ${esc(s.title)}</option>`).join('')}</select></div></div><div class="field"><label>Instrucciones</label><textarea name="instructions" rows="5"></textarea></div><div class="formgrid"><div class="field"><label>Fecha límite</label><input class="input" type="datetime-local" name="due"></div><div class="field"><label>Puntaje máximo</label><input class="input" type="number" name="max" min="1" value="100"></div></div><div class="field"><label>Tipos permitidos</label><div><label><input type="checkbox" name="type" value="text" checked> Texto</label> · <label><input type="checkbox" name="type" value="url" checked> URL</label> · <label><input type="checkbox" name="type" value="file" checked> Archivo</label></div></div><button class="btn good" type="submit">Crear entrega</button></form></section><section class="card"><div class="ey">Configuradas</div><h2>Entregas activas</h2><div class="list">${assignments.map(a=>`<div class="item"><div class="row"><div><b>${esc(a.title)}</b><div class="muted">${a.session_number?`S${a.session_number} · `:''}${a.due_at?'vence '+when(a.due_at):'sin fecha límite'} · ${a.max_score} pts</div></div><button class="act red" data-archive="${a.id}">Archivar</button></div></div>`).join('')||'<div class="muted">No hay entregas activas.</div>'}</div></section></div><section class="card"><div class="ey">Bandeja de revisión</div><h2>Evidencias pendientes</h2><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Entrega</th><th>Intento</th><th>Tipo</th><th>Fecha</th><th></th></tr></thead><tbody>${subs.map(s=>`<tr><td>${esc(users.get(s.user_id)?.display_name||users.get(s.user_id)?.username||s.user_id)}</td><td>${esc(names.get(s.assignment_id)?.title||s.assignment_id)}</td><td>${s.attempt}</td><td>${esc(s.artifact_type)}</td><td>${when(s.submitted_at)}</td><td><button class="act blue" data-submission="${s.id}">Revisar</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No hay entregas pendientes.</td></tr>'}</tbody></table></div></section>`;document.getElementById('assignment-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),types=[...f.querySelectorAll('[name=type]:checked')].map(x=>x.value);if(!types.length)return msg('Elige al menos un tipo de evidencia','err');b.disabled=true;try{await window.ANDES_PLATFORM.createAssignment({title:f.title.value,session_number:f.session.value||null,instructions:f.instructions.value,due_at:f.due.value?new Date(f.due.value).toISOString():null,max_score:Number(f.max.value||100),allowed_types:types});f.reset();msg('Entrega creada');await load()}catch(ex){msg(ex.message,'err')}finally{b.disabled=false}};document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{if(confirm('¿Archivar esta entrega?')){await window.ANDES_PLATFORM.archiveAssignment(b.dataset.archive);load()}});document.querySelectorAll('[data-submission]').forEach(b=>b.onclick=()=>openSubmission(b.dataset.submission))}
function access(){const req=dash.access_requests||[];content.innerHTML=`<section class="card"><div class="ey">Matrícula y credenciales</div><h2>Solicitudes de acceso</h2><p class="muted">Aprobar crea/actualiza la cuenta, la matricula en la cohorte activa y genera una contraseña temporal.</p><div class="list">${req.map(r=>`<div class="item"><div class="row"><div><b>${esc(r.full_name)}</b><div class="muted">${esc(r.email)} · ${when(r.created_at)}</div></div><span class="pill ${r.status}">${esc(r.status)}</span></div><div class="actions">${r.status==='pending'?`<button class="act good" data-access="approve" data-id="${r.id}">Aprobar + credenciales</button><button class="act red" data-access="reject" data-id="${r.id}">Rechazar</button>`:r.status==='approved'?`<button class="act blue" data-access="reset_password" data-id="${r.id}">Restablecer contraseña</button>`:''}</div></div>`).join('')||'<div class="muted">No hay solicitudes.</div>'}</div></section>`;document.querySelectorAll('[data-access]').forEach(b=>b.onclick=()=>{const a=b.dataset.access;if((a==='approve'||a==='reject')&&!confirm(a==='approve'?'¿Aprobar y generar credenciales?':'¿Rechazar solicitud?'))return;accessAction(b.dataset.id,a,b)})}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({overview,students,communication,assignments,access}[tab]||overview)()}
function wireUserRows(){document.querySelectorAll('[data-user]').forEach(r=>r.onclick=()=>openUser(r.dataset.user))}
async function openUser(id){title.textContent='Ficha del estudiante';body.innerHTML='Cargando…';dialog.showModal();try{const d=await window.ANDES_PLATFORM.userDetail(id),u=d.user||{},s=d.summary||{},worst=(d.activity_progress||[]).filter(x=>x.status!=='completed').sort((a,b)=>Number(b.attempts)-Number(a.attempts)).slice(0,8);body.innerHTML=`<div class="row"><div><h2 style="margin:.1rem 0">${esc(u.display_name||u.username)}</h2><div class="muted">${esc(u.email||u.username)} · ${u.active?'activo':'desactivado'} · última actividad ${when(s.last_activity_at)}</div></div><span class="pill ${u.active?'low':'high'}">${u.active?'activo':'inactivo'}</span></div><div class="detailgrid" style="margin:12px 0"><div class="detailmetric"><b>${s.activities_completed||0}/160</b><span class="muted">prácticas</span></div><div class="detailmetric"><b>${s.sessions_completed||0}/16</b><span class="muted">sesiones</span></div><div class="detailmetric"><b>${time(s.active_seconds)}</b><span class="muted">tiempo activo</span></div><div class="detailmetric"><b>${s.attempts||0} / ${s.hints_used||0}</b><span class="muted">intentos / pistas</span></div></div><h3>Competencias</h3>${(d.competencies||[]).map(c=>`<div class="competency"><b>${esc(c.title)}</b><div class="progressbar"><i style="width:${Math.min(100,Number(c.mastery_pct||0))}%"></i></div><span>${Number(c.mastery_pct||0).toFixed(0)}%</span></div>`).join('')}<h3>Dificultades abiertas</h3>${worst.length?`<div class="tablewrap"><table><thead><tr><th>Actividad</th><th>Intentos</th><th>Pistas</th></tr></thead><tbody>${worst.map(x=>`<tr><td>${esc(x.activity_code)}</td><td>${x.attempts}</td><td>${x.hints_used}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No hay dificultades abiertas registradas.</div>'}<h3 style="margin-top:12px">Sesiones/dispositivos</h3><div class="list">${(d.sessions||[]).map(x=>`<div class="item"><b>${esc((x.user_agent||'Dispositivo').slice(0,100))}</b><div class="muted">Último uso ${when(x.last_seen_at||x.created_at)} · ${x.persistent?'persistente':'temporal'}</div></div>`).join('')||'<div class="muted">No hay sesiones abiertas.</div>'}</div><div class="actions"><button class="btn ${u.active?'red':'good'}" id="toggle-user">${u.active?'Desactivar cuenta':'Reactivar cuenta'}</button><button class="btn alt" id="revoke-user">Cerrar todas sus sesiones</button><button class="btn yellow" id="issue-cert">Emitir certificado</button></div>${d.certificate?`<div class="credentials"><b>Certificado: ${esc(d.certificate.credential_code)}</b><div class="muted">Verificación: <a target="_blank" href="verify.html?code=${encodeURIComponent(d.certificate.credential_code)}">abrir credencial</a></div></div>`:''}`;document.getElementById('toggle-user').onclick=async()=>{try{await window.ANDES_PLATFORM.setUserActive(id,!u.active);msg('Estado de cuenta actualizado');dialog.close();load()}catch(e){alert(e.message)}};document.getElementById('revoke-user').onclick=async()=>{if(confirm('¿Cerrar todas las sesiones de este estudiante?')){await window.ANDES_PLATFORM.revokeUserSessions(id);msg('Sesiones revocadas');dialog.close()}};document.getElementById('issue-cert').onclick=async()=>{try{const x=await window.ANDES_PLATFORM.issueCertificate(id);body.insertAdjacentHTML('beforeend',`<div class="credentials"><b>Certificado emitido: ${esc(x.credential_code)}</b><div><a target="_blank" href="verify.html?code=${encodeURIComponent(x.credential_code)}">Verificar credencial →</a></div></div>`)}catch(e){alert(e.message)}}}catch(e){body.innerHTML=`<div class="status show err">${esc(e.message)}</div>`}}
async function openSubmission(id){title.textContent='Revisar evidencia';body.innerHTML='Cargando evidencia…';dialog.showModal();try{const x=await api('learning-submission-detail',{method:'POST',body:JSON.stringify({submission_id:id})},9000),s=x.submission,a=x.assignment,u=x.student,artifact=s.artifact||{};let evidence=s.artifact_type==='text'?`<div class="item" style="white-space:pre-wrap">${esc(artifact.text||'')}</div>`:s.artifact_type==='url'?`<a class="btn blue" target="_blank" rel="noopener" href="${esc(artifact.url||'#')}">Abrir enlace enviado</a>`:x.signed_url?`<a class="btn blue" target="_blank" rel="noopener" href="${esc(x.signed_url)}">Abrir archivo enviado</a>`:'<div class="muted">Archivo no disponible.</div>';body.innerHTML=`<h2 style="margin:.1rem 0">${esc(a?.title||'Entrega')}</h2><div class="muted">${esc(u?.display_name||u?.username||'Estudiante')} · intento ${s.attempt} · ${when(s.submitted_at)}</div><div style="margin:12px 0">${evidence}</div><form class="form" id="review-form"><div class="field"><label>Puntaje (máx. ${a?.max_score||100})</label><input class="input" type="number" name="score" min="0" max="${a?.max_score||100}" value="${s.score??''}" required></div><div class="field"><label>Retroalimentación</label><textarea name="feedback" rows="6">${esc(s.feedback||'')}</textarea></div><button class="btn good" type="submit">Guardar revisión</button></form>`;document.getElementById('review-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{await window.ANDES_PLATFORM.reviewSubmission(id,Number(f.score.value),f.feedback.value);msg('Entrega revisada');dialog.close();load()}catch(ex){alert(ex.message)}finally{b.disabled=false}}}catch(e){body.innerHTML=`<div class="status show err">${esc(e.message)}</div>`}}
function csv(){const rows=[['Estudiante','Correo','Prácticas','Sesiones','Tiempo_seg','Intentos','Pistas','Última_actividad'],...(dash.users||[]).filter(x=>x.role==='student').map(x=>[x.display_name||x.username,x.email||x.username,x.activities_completed||0,x.sessions_completed||0,x.active_seconds||0,x.attempts||0,x.hints_used||0,x.last_activity_at||''])],text=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ANDESDB-progreso-cohorte.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}async function load(){refresh.disabled=true;try{const a=auth();if(!a?.token||!['teacher','admin'].includes(a?.user?.role)){location.replace('portal.html?next='+encodeURIComponent(location.pathname));return}viewer.textContent=`${a.user.display_name||a.user.username} · ${a.user.role}`;[dash,platform]=await Promise.all([api('learning-dashboard?scope=all',{method:'GET'},10000),window.ANDES_PLATFORM.teacherOverview()]);document.getElementById('run-name').textContent=platform.run?.title||dash.run?.title||'Cohorte activa';render()}catch(e){content.innerHTML=`<div class="card"><b>No se pudo cargar el panel.</b><div class="muted">${esc(e.message)}</div></div>`;msg(e.message,'err')}finally{refresh.disabled=false}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});refresh.onclick=load;document.getElementById('export').onclick=csv;document.getElementById('dialog-close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};document.getElementById('logout').onclick=async()=>{try{await api('learning-auth',{method:'POST',body:JSON.stringify({action:'logout'})},2500)}catch{}try{localStorage.removeItem(STORE)}catch{}location.replace('portal.html')};window.ANDES_COURSE?.ready?.().finally(load)})();</script><script src="assets/learning/analytics-config.js?v=202
