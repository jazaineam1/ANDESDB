<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Panel docente ANDESDB"><title>ANDESDB · Panel docente</title><style>
:root{--ink:#111827;--muted:#64748b;--line:#dbe1e8;--bg:#f4f6f8;--yellow:#ffd600;--green:#166534;--orange:#a16207;--red:#991b1b;--blue:#1d4ed8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}.wrap{width:min(1280px,94vw);margin:auto}.top{background:#0e1a24;color:#fff;padding:20px 0}.top .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(1.4rem,3vw,2.2rem);flex:1;min-width:230px}.top a,.top button{border:1px solid #ffffff44;background:#ffffff10;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;text-decoration:none;cursor:pointer}.ey{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:900}main{padding:20px 0 70px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar button,.act{border:0;border-radius:9px;padding:8px 11px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.muted{color:var(--muted);font-size:.84rem;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #0f172a0a}.metric{padding:14px}.metric b{display:block;font-size:1.5rem}.metric span{font-size:.76rem;color:var(--muted)}.metric.alert b{color:var(--orange)}.card{padding:16px;margin-bottom:18px}.card h2{margin:0 0 8px;font-size:1.15rem}.statusbox{display:none;margin:0 0 12px;padding:12px;border-radius:12px}.statusbox.show{display:block}.statusbox.ok{background:#dcfce7;color:#14532d}.statusbox.warn{background:#fff7d6;color:#854d0e}.statusbox.err{background:#fee2e2;color:#7f1d1d}.req-list{display:grid;gap:10px}.req{border:1px solid #e2e8f0;border-radius:14px;padding:13px;background:#fbfcfd}.req-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.req h3{margin:0;font-size:1rem}.pill{display:inline-block;font-size:.7rem;font-weight:900;border-radius:999px;padding:4px 7px;background:#eef2f7;color:#475569}.pill.pending{background:#fef3c7;color:var(--orange)}.pill.approved{background:#dcfce7;color:var(--green)}.pill.rejected{background:#fee2e2;color:var(--red)}.req-meta{font-size:.8rem;color:#64748b;margin-top:5px;overflow-wrap:anywhere}.req-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.act.approve{background:#166534}.act.reject{background:#991b1b}.act.resend{background:#1d4ed8}.act.link{background:#475569}.act:disabled{opacity:.5;cursor:wait}.manual{margin-top:10px;border:1px solid #bae6fd;background:#f0f9ff;border-radius:10px;padding:10px}.manual code{display:block;word-break:break-all;font-size:.72rem;margin:6px 0}.tablewrap{overflow:auto;border:1px solid #e5e7eb;border-radius:12px}table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:860px}th,td{padding:8px 9px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0;z-index:1}.matrix{font-weight:900;text-align:center}.matrix.done{color:var(--green)}.matrix.progress{color:var(--orange)}.matrix.none{color:#cbd5e1}.notice{background:#fffbea;border:1px solid #fde68a;border-radius:12px;padding:12px}.autorefresh{font-size:.76rem;color:#64748b}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.top h1{flex-basis:100%}.card{padding:13px}.metric b{font-size:1.35rem}}
</style></head><body><header class="top"><div class="wrap"><div><div class="ey">ANDESDB · revisión</div><h1>Panel docente · aprendizaje</h1></div><a href="portal.html">Portal</a><a href="learning-hub.html">Centro</a><button id="logout">Cerrar sesión</button></div></header><main><div class="wrap"><div class="toolbar"><button id="refresh">Actualizar ahora</button><span class="muted" id="viewer"></span><span class="autorefresh" id="auto">Actualización automática cada 15 s</span></div><div id="status" class="statusbox"></div><div id="content"><div class="notice">Cargando panel…</div></div></div></main><script>
(()=>{'use strict';const API='https://gnpouhsvsisqoxketlfr.supabase.co/functions/v1',STORE='andesdb.lms.auth.v1',content=document.getElementById('content'),viewer=document.getElementById('viewer'),status=document.getElementById('status'),refresh=document.getElementById('refresh'),logout=document.getElementById('logout');let loading=false,lastSignature='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const readAuth=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};const time=s=>{s=Number(s||0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`};const when=x=>{try{return new Date(x).toLocaleString('es-CO')}catch{return'—'}};function msg(text,type='ok',html=''){status.className='statusbox show '+type;status.innerHTML=html||esc(text)}function clearMsg(){status.className='statusbox';status.textContent=''}async function api(path,opt={},ms=7000){const a=readAuth();if(!a?.token)throw new Error('Sesión docente vencida.');const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(API+'/'+path,{...opt,signal:c.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.token,...(opt.headers||{})}}),x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);return x}finally{clearTimeout(t)}}
async function review(id,action){return api('learning-access-review',{method:'POST',body:JSON.stringify({request_id:id,action})},9000)}
function manualBox(link){const safe=esc(link);return `<div class="manual"><b>Enlace manual de acceso</b><div class="muted">Es de un solo uso. Compártelo únicamente con ese estudiante.</div><code id="manual-link">${safe}</code><button class="act link" id="copy-manual">Copiar enlace</button></div>`}
async function act(id,action,btn){const labels={approve:'Aprobando…',reject:'Rechazando…',resend:'Enviando…',generate_link:'Generando…'};const old=btn.textContent;btn.disabled=true;btn.textContent=labels[action]||'Procesando…';try{const x=await review(id,action);if(x.manual_link){msg(x.warning||'Enlace manual generado.','warn',`${esc(x.warning||'Enlace manual generado.')}${manualBox(x.manual_link)}`);setTimeout(()=>{const b=document.getElementById('copy-manual');if(b)b.onclick=async()=>{try{await navigator.clipboard.writeText(x.manual_link);b.textContent='Copiado ✓'}catch{b.textContent='Copia el enlace de arriba'}}},0)}else if(action==='approve')msg(x.email_sent?'Solicitud aprobada y correo enviado.':(x.warning||'Solicitud aprobada.'),x.email_sent?'ok':'warn');else if(action==='reject')msg('Solicitud rechazada.');else msg('Correo de acceso enviado.');await load(true)}catch(e){msg(e.name==='AbortError'?'El servidor tardó demasiado. Intenta de nuevo.':e.message,'err')}finally{btn.disabled=false;btn.textContent=old}}
function render(d){const users=d.users||[],sp=d.session_progress||[],ap=d.activity_progress||[],sessions=d.sessions||[],requests=d.access_requests||[];const pending=requests.filter(x=>x.status==='pending'),totalActive=users.reduce((a,x)=>a+Number(x.active_seconds||0),0),done=ap.filter(x=>x.status==='completed').length,attempts=ap.reduce((a,x)=>a+Number(x.attempts||0),0),hints=ap.reduce((a,x)=>a+Number(x.hints_used||0),0),byUS=new Map(sp.map(x=>[`${x.user_id}:${x.session_number}`,x]));const reqHtml=requests.slice(0,100).map(r=>`<article class="req"><div class="req-top"><div><h3>${esc(r.full_name)}</h3><div class="req-meta">${esc(r.email)} · ${esc(r.course_code)} · recibida ${when(r.created_at)}</div></div><span class="pill ${esc(r.status)}">${esc(r.status)}</span></div><div class="req-actions">${r.status==='pending'?`<button class="act approve" data-act="approve" data-id="${r.id}">Aprobar</button><button class="act reject" data-act="reject" data-id="${r.id}">Rechazar</button>`:r.status==='approved'?`<button class="act resend" data-act="resend" data-id="${r.id}">Enviar correo</button><button class="act link" data-act="generate_link" data-id="${r.id}">Generar enlace</button>`:'Sin acciones'}</div></article>`).join('');const rows=users.map(u=>`<tr><td><b>${esc(u.display_name||u.username)}</b><br><span class="muted">${esc(u.username)} · ${esc(u.role)}</span></td><td>${time(u.active_seconds)}</td><td>${u.activities_completed||0}</td><td>${u.attempts||0}</td><td>${u.hints_used||0}</td>${sessions.map(s=>{const x=byUS.get(`${u.user_id}:${s.session_number}`),cls=!x?'none':x.status==='completed'?'done':'progress',txt=!x?'·':x.status==='completed'?'✓':time(x.active_seconds);return `<td class="matrix ${cls}">${txt}</td>`}).join('')}</tr>`).join('');content.innerHTML=`<section class="grid"><div class="metric"><b>${users.length}</b><span>usuarios activos</span></div><div class="metric alert"><b>${pending.length}</b><span>solicitudes pendientes</span></div><div class="metric"><b>${time(totalActive)}</b><span>tiempo activo acumulado</span></div><div class="metric"><b>${done}</b><span>prácticas logradas</span></div><div class="metric"><b>${attempts}</b><span>intentos</span></div><div class="metric"><b>${hints}</b><span>pistas solicitadas</span></div></section><section class="card"><h2>Solicitudes de acceso</h2><p class="muted">Las solicitudes nuevas aparecen automáticamente. Aprobar crea/matricula al estudiante. Si Supabase bloquea el correo por límite, usa “Generar enlace” y compártelo manualmente.</p><div class="req-list">${reqHtml||'<div class="notice">No hay solicitudes registradas.</div>'}</div></section><section class="card"><h2>Matriz estudiante × sesión</h2><p class="muted">✓ = laboratorio completo; el tiempo refleja actividad registrada y no es una calificación.</p><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Activo</th><th>Prácticas</th><th>Intentos</th><th>Pistas</th>${sessions.map(s=>`<th>S${s.session_number}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="99">Sin datos aún.</td></tr>'}</tbody></table></div></section>`;content.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if((a==='approve'||a==='reject')&&!confirm(`¿Confirmas ${a==='approve'?'aprobar':'rechazar'} esta solicitud?`))return;act(b.dataset.id,a,b)})}
async function load(force=false){if(loading&&!force)return;const a=readAuth();if(!a?.token||!a?.user){content.innerHTML='<div class="notice">Inicia sesión desde el Portal.</div>';viewer.textContent='Sin sesión';return}if(!['teacher','admin'].includes(a.user.role)){content.innerHTML='<div class="statusbox show err">Tu cuenta no tiene rol docente.</div>';return}viewer.textContent=`${a.user.display_name||a.user.username} · ${a.user.role}`;loading=true;refresh.disabled=true;try{const d=await api('learning-dashboard?scope=all',{method:'GET'},6500);const sig=JSON.stringify([(d.access_requests||[]).map(x=>[x.id,x.status,x.invite_sent_at]),(d.users||[]).length,(d.activity_progress||[]).length]);if(sig!==lastSignature||force){render(d);lastSignature=sig}document.getElementById('auto').textContent='Actualizado '+new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})+' · automático cada 15 s'}catch(e){if(force)msg(e.name==='AbortError'?'El servidor tardó demasiado.':e.message,'err')}finally{loading=false;refresh.disabled=false}}
refresh.onclick=()=>load(true);logout.onclick=async()=>{const a=readAuth();localStorage.removeItem(STORE);try{if(a?.token)await fetch(API+'/learning-auth',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.token},body:JSON.stringify({action:'logout'})})}catch{}location.replace('portal.html')};load(true);setInterval(()=>{if(document.visibilityState==='visible')load(false)},15000);addEventListener('focus',()=>load(false));})();
</script></body></html>
